<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Launch2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .game-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 30px;
      max-width: 650px;
      width: 100%;
      text-align: center;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .sentence-box {
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }
    .summary-box {
      background: #eef6ff;
      border: 1px solid #bbe1fa;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      color: #1b4965;
      margin-bottom: 20px;
    }
    .leaderboard-title {
      color: #2b2d42;
      margin-top: 25px;
      margin-bottom: 10px;
    }
    .status-msg {
      font-weight: bold;
      color: #2ec4b6;
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #edf2f7;
      text-align: center;
    }
    th {
      background-color: #f7fafc;
      color: #4a5568;
    }
    .btn {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #2b6cb0;
    }
  </style>
</head>
<body>

<div class="game-card">
  <h2>Rocket Launch</h2>

  <!-- Active Gameplay Interface -->
  <div id="game-ui">
    <div class="status-bar">
      <span id="progress-text">1/10</span>
      <span id="timer-text">0:00</span>
      <span>❤️❤️❤️❤️❤️</span>
    </div>
    
    <div class="sentence-box" id="current-sentence">
      My younger brother likes to play football.
    </div>

    <button class="btn" onclick="completeSentence()">Complete Sentence</button>
  </div>

  <!-- End Game / Summary & Leaderboard Section -->
  <div id="results-ui" style="display: none;">
    <div class="summary-box" id="summary-stats">
      📋 Completed: 0/10 | 🎯 Accuracy: 100% | ⏱️ Time: 0m 00s
    </div>

    <h3 class="leaderboard-title">🏆 Top 5 Leaderboard 🏆</h3>
    <div class="status-msg" id="post-status">⏳ Posting score...</div>

    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Completed</th>
          <th>Accuracy</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="5">Loading leaderboard...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // ==========================================================
  // CONFIGURATION
  // ==========================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWcDa3GR9lFNXLp0EGwf9EzkkKNHAy5KeGYlyzhMAcUA4FHGxmKkv3fOncv4vD6Zh3Xg/exec";
  
  // Parse URL parameters (e.g. ?sheet=https://docs.google.com/spreadsheets/d/...&topicId=123)
  const urlParams = new URLSearchParams(window.location.search);
  const topicId = urlParams.get('topicId') || "defaultTopic";
  const playerName = urlParams.get('name') || "A Daligand";
  const gameName = "Rocket Launch";

  // Game state variables
  let currentSentenceIndex = 0;
  const totalSentences = 10;
  let correctCount = 0;
  let totalAttempts = 0;
  let startTime = Date.now();

  // Helper to format minutes and seconds (e.g., 1.4 minutes -> "1m 24s")
  function formatMinutes(decimalMinutes) {
    const totalSeconds = Math.round(decimalMinutes * 60);
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}m ${s < 10 ? '0' : ''}${s}s`;
  }

  // Handle sentence completion progression
  function completeSentence() {
    currentSentenceIndex++;
    correctCount++;
    totalAttempts++;

    if (currentSentenceIndex < totalSentences) {
      document.getElementById('progress-text').innerText = `${currentSentenceIndex + 1}/${totalSentences}`;
    } else {
      finishGame();
    }
  }

  // End of Game Trigger
  function finishGame() {
    document.getElementById('game-ui').style.display = 'none';
    document.getElementById('results-ui').style.display = 'block';

    const endTime = Date.now();
    const timeInMinutes = (endTime - startTime) / 60000; // Exact decimal minutes
    const accuracy = Math.round((correctCount / Math.max(1, totalAttempts)) * 100);
    const sentencesCompleted = currentSentenceIndex; // 1 to 10

    // Update UI Summary Box
    document.getElementById('summary-stats').innerText = 
      `📋 Completed: ${sentencesCompleted}/${totalSentences} | 🎯 Accuracy: ${accuracy}% | ⏱️ Time: ${formatMinutes(timeInMinutes)}`;

    // Post Score to Google Apps Script
    submitAndFetchLeaderboard({
      game: gameName,
      topicId: topicId,
      name: playerName,
      completed: sentencesCompleted, // Key sent to backend
      accuracy: accuracy,
      time: timeInMinutes
    });
  }

  // Submit Score via POST and Refresh Leaderboard Table
  function submitAndFetchLeaderboard(payload) {
    const statusElem = document.getElementById('post-status');
    statusElem.innerText = "⏳ Posting Score...";

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      statusElem.innerText = "🎯 Score Posted Successfully!";
      renderLeaderboard(data);
    })
    .catch(err => {
      console.error("Error submitting score:", err);
      statusElem.innerText = "⚠️ Failed to post score. Loading leaderboard...";
      fetchLeaderboardOnly();
    });
  }

  // Fallback: Fetch Leaderboard via GET if POST fails
  function fetchLeaderboardOnly() {
    fetch(`${APPS_SCRIPT_URL}?game=${encodeURIComponent(gameName)}&topicId=${encodeURIComponent(topicId)}`)
      .then(res => res.json())
      .then(data => renderLeaderboard(data))
      .catch(err => {
        document.getElementById('leaderboard-body').innerHTML = 
          `<tr><td colspan="5" style="color:red;">Error loading leaderboard.</td></tr>`;
      });
  }

  // Render Leaderboard Rows into HTML Table
  function renderLeaderboard(scores) {
    const tbody = document.getElementById('leaderboard-body');
    tbody.innerHTML = '';

    if (!Array.isArray(scores) || scores.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5">No scores submitted yet.</td></tr>`;
      return;
    }

    const rankBadges = ['🥇 1', '🥈 2', '🥉 3', '4', '5'];

    scores.forEach((entry, index) => {
      const row = document.createElement('tr');
      
      // Ensure 'completed' value defaults gracefully if missing
      const completedValue = entry.completed !== undefined ? entry.completed : 0;
      
      row.innerHTML = `
        <td><b>${rankBadges[index] || index + 1}</b></td>
        <td>${entry.name || 'Anonymous'}</td>
        <td>${completedValue}/${totalSentences}</td>
        <td>${Math.round(entry.accuracy)}%</td>
        <td>${formatMinutes(entry.time)}</td>
      `;
      tbody.appendChild(row);
    });
  }
</script>

</body>
</html>
