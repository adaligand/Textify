<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassTile</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Interact.js for Drag and Drop -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <!-- PDF Generation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Grid background for Room Builder to assist visual alignment */
    .grid-bg {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- TOP NAVBAR -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-2 cursor-pointer" onclick="showView('view-home')">
      <span class="text-2xl font-bold tracking-wide">ClassTile Web</span>
    </div>
    <div class="flex gap-2">
      <button onclick="showView('view-room-builder')" class="bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded text-sm font-medium transition">+ Room Design</button>
      <button onclick="openNewClassModal()" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded text-sm font-medium transition">+ New Class Plan</button>
    </div>
  </header>

  <!-- CONTAINER -->
  <main class="p-6 max-w-7xl mx-auto">

    <!-- VIEW 1: HOMEPAGE (STAFF & ROOM DIRECTORY) -->
    <section id="view-home" class="space-y-8">
      <div>
        <h2 class="text-xl font-bold mb-4 text-slate-700">Saved Room Designs</h2>
        <div id="room-list" class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-6 gap-4">
          <!-- Dynamically populated room cards -->
        </div>
      </div>
    </section>

    <!-- VIEW 2: ROOM DESIGNER -->
    <section id="view-room-builder" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border">
        <div class="flex gap-4 items-center">
          <input type="text" id="room-name-input" placeholder="Room Name (e.g. Lab 101)" class="border p-2 rounded w-64 text-sm">
          <button onclick="addDeskToRoom()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded text-sm">+ Add Desk</button>
          <span class="text-xs text-slate-500">Desks snap to grid (20px)</span>
        </div>
        <button onclick="saveRoomLayout()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium">Save Room Design</button>
      </div>

      <div id="room-canvas" class="relative w-full h-[550px] bg-white rounded-lg border-2 border-dashed border-slate-300 overflow-hidden grid-bg">
        <!-- Draggable desk templates generated here -->
      </div>
    </section>

    <!-- VIEW 3: SEATING CHART WORKSPACE -->
    <section id="view-chart" class="hidden space-y-4">
      <!-- CONTROL BAR -->
      <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-lg shadow-sm border gap-4">
        <div>
          <h1 id="chart-title" class="text-xl font-bold text-slate-800">Class Seating Chart</h1>
          <p id="chart-subtitle" class="text-xs text-slate-500">Teacher | Room</p>
        </div>

        <!-- VIEW MODE TOGGLES -->
        <div class="flex bg-slate-100 p-1 rounded-lg border text-sm">
          <button id="btn-mode-teacher" onclick="setMode('teacher')" class="px-3 py-1 rounded-md bg-white shadow-sm font-medium">Teacher View</button>
          <button id="btn-mode-student" onclick="setMode('student')" class="px-3 py-1 rounded-md font-medium text-slate-600">Student View</button>
          <button id="btn-mode-flipped" onclick="setMode('flipped')" class="px-3 py-1 rounded-md font-medium text-slate-600">Flip 180°</button>
        </div>

        <div class="flex gap-2">
          <button onclick="exportToPDF()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded text-sm font-medium">Export PDF</button>
          <button onclick="saveSeatingPlan()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded text-sm font-medium shadow-sm">Save Plan</button>
        </div>
      </div>

      <!-- MAIN LAYOUT GRID -->
      <div class="grid grid-cols-12 gap-6">
        <!-- UNASSIGNED STUDENTS BENCH -->
        <div class="col-span-3 bg-white p-4 rounded-lg shadow-sm border">
          <h3 class="font-bold text-sm text-slate-700 mb-2">Unassigned Roster (<span id="unassigned-count">0</span>)</h3>
          <div id="unassigned-bench" class="space-y-2 min-h-[450px] max-h-[500px] overflow-y-auto p-2 bg-slate-50 rounded border dropzone-bench">
            <!-- Student cards ready to drag onto canvas -->
          </div>
        </div>

        <!-- SEATING CHART CANVAS -->
        <div class="col-span-9 bg-white p-4 rounded-lg shadow-sm border overflow-hidden">
          <div id="seating-canvas-wrapper" class="transition-transform duration-300 origin-center">
            <div id="seating-canvas" class="relative w-full h-[520px] bg-slate-50 rounded border border-slate-200">
              <!-- Room desks rendered here -->
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: NEW CLASS SETUP -->
  <div id="modal-new-class" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg p-6 max-w-lg w-full space-y-4 shadow-xl">
      <h3 class="text-lg font-bold border-b pb-2">Create New Seating Plan</h3>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Teacher Name</label>
          <input type="text" id="input-teacher-name" class="w-full border p-2 rounded text-sm" placeholder="e.g. Mr. Smith">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Class Code</label>
          <input type="text" id="input-class-code" class="w-full border p-2 rounded text-sm" placeholder="e.g. 9P / Science">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Select Room Design</label>
          <select id="select-room-design" class="w-full border p-2 rounded text-sm bg-white"></select>
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Batch Roster Input (One name per line)</label>
          <textarea id="input-batch-roster" rows="5" class="w-full border p-2 rounded text-sm" placeholder="Mia Amos&#10;Harry Benton&#10;Skyla Sayers"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t">
        <button onclick="closeNewClassModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
        <button onclick="confirmCreateNewClass()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded font-medium">Build Seating Chart</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE ENGINE SETUP -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBSU87WMLPKqBwpO_6fQzWF2vgXrkz1d0E",
      authDomain: "classtile-19e74.firebaseapp.com",
      projectId: "classtile-19e74",
      storageBucket: "classtile-19e74.firebasestorage.app",
      messagingSenderId: "826310108132",
      appId: "1:826310108132:web:315b6e4d3a732cabd75df1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // STATE
    window.AppState = {
      currentView: 'view-home',
      currentTeacher: '',
      currentClassCode: '',
      currentRoomId: '',
      activeViewMode: 'teacher',
      students: [],
      roomDesks: []
    };

    // VIEW ROUTER
    window.showView = function(viewId) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
      window.AppState.currentView = viewId;

      if (viewId === 'view-home') renderHomeDirectory();
    };

    // --- ROOM DESIGNER (WITH GRID SNAPPING) ---
    window.addDeskToRoom = function() {
      const canvas = document.getElementById('room-canvas');
      const desk = document.createElement('div');
      desk.className = 'room-desk-item absolute w-28 h-16 bg-indigo-100 border-2 border-indigo-500 rounded cursor-move flex items-center justify-center text-xs font-bold text-indigo-800 select-none shadow-sm';
      desk.style.top = '20px';
      desk.style.left = '20px';
      desk.innerText = 'Desk';
      canvas.appendChild(desk);
    };

    // Snapping Desk Draggable Engine (Snaps to 20px grid)
    interact('.room-desk-item').draggable({
      modifiers: [
        interact.modifiers.snap({
          targets: [ interact.snappers.grid({ x: 20, y: 20 }) ],
          range: Infinity,
          relativePoints: [ { x: 0, y: 0 } ]
        })
      ],
      listeners: {
        move(event) {
          const target = event.target;
          const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
          const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
          target.style.transform = `translate(${x}px, ${y}px)`;
          target.setAttribute('data-x', x);
          target.setAttribute('data-y', y);
        }
      }
    });

    window.saveRoomLayout = async function() {
      const name = document.getElementById('room-name-input').value.trim();
      if (!name) return alert('Enter room name');

      const deskElements = document.querySelectorAll('.room-desk-item');
      if (deskElements.length === 0) return alert('Add at least one desk before saving.');

      const deskLayout = [];
      const canvasRect = document.getElementById('room-canvas').getBoundingClientRect();

      deskElements.forEach((el, index) => {
        const rect = el.getBoundingClientRect();
        deskLayout.push({
          id: index,
          left: Math.round(rect.left - canvasRect.left),
          top: Math.round(rect.top - canvasRect.top)
        });
      });

      await addDoc(collection(db, "rooms"), {
        roomName: name,
        deskLayout: deskLayout
      });

      alert('Room Saved Successfully!');
      showView('view-home');
    };

    // --- NEW CLASS MODAL ---
    window.openNewClassModal = async function() {
      const select = document.getElementById('select-room-design');
      select.innerHTML = '';
      const snapshot = await getDocs(collection(db, "rooms"));

      if (snapshot.empty) {
        alert('Please create a Room Design first using "+ Room Design".');
        showView('view-room-builder');
        return;
      }

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        select.innerHTML += `<option value="${docSnap.id}">${data.roomName}</option>`;
      });

      document.getElementById('modal-new-class').classList.remove('hidden');
    };

    window.closeNewClassModal = () => document.getElementById('modal-new-class').classList.add('hidden');

    window.confirmCreateNewClass = async function() {
      const teacher = document.getElementById('input-teacher-name').value.trim();
      const code = document.getElementById('input-class-code').value.trim();
      const roomId = document.getElementById('select-room-design').value;
      const rosterRaw = document.getElementById('input-batch-roster').value.trim();

      if (!teacher || !code || !rosterRaw) return alert('Fill in all required fields.');

      const studentNames = rosterRaw.split('\n').filter(n => n.trim().length > 0);
      const students = studentNames.map((name, i) => ({
        id: 's_' + i + '_' + Date.now(),
        name: name.trim(),
        seatIndex: null
      }));

      const roomSnap = await getDoc(doc(db, "rooms", roomId));
      window.AppState.roomDesks = roomSnap.data().deskLayout;
      window.AppState.currentTeacher = teacher;
      window.AppState.currentClassCode = code;
      window.AppState.currentRoomId = roomId;
      window.AppState.students = students;

      closeNewClassModal();
      renderSeatingChartWorkspace();
      showView('view-chart');
    };

    // --- SEATING CHART WORKSPACE ---
    function renderSeatingChartWorkspace() {
      document.getElementById('chart-title').innerText = `${window.AppState.currentClassCode} Seating Plan`;
      document.getElementById('chart-subtitle').innerText = `Teacher: ${window.AppState.currentTeacher}`;

      renderUnassignedBench();
      renderCanvasDesks();
      setupDragAndDrop();
    }

    function renderUnassignedBench() {
      const bench = document.getElementById('unassigned-bench');
      bench.innerHTML = '';

      const unassigned = window.AppState.students.filter(s => s.seatIndex === null);
      document.getElementById('unassigned-count').innerText = unassigned.length;

      unassigned.forEach(student => {
        const item = document.createElement('div');
        item.className = 'student-card bg-indigo-600 text-white p-2 rounded shadow text-xs font-bold cursor-grab select-none z-10';
        item.setAttribute('data-student-id', student.id);
        item.innerText = student.name;
        bench.appendChild(item);
      });
    }

    function renderCanvasDesks() {
      const canvas = document.getElementById('seating-canvas');
      canvas.innerHTML = '';

      window.AppState.roomDesks.forEach((desk, idx) => {
        const deskEl = document.createElement('div');
        deskEl.className = 'desk-slot absolute w-28 h-16 border-2 border-slate-300 rounded bg-white flex items-center justify-center text-xs shadow-sm transition-all';
        deskEl.style.left = desk.left + 'px';
        deskEl.style.top = desk.top + 'px';
        deskEl.setAttribute('data-seat-index', idx);

        const assignedStudent = window.AppState.students.find(s => s.seatIndex === idx);
        if (assignedStudent) {
          deskEl.className = 'desk-slot absolute w-28 h-16 border-2 border-emerald-500 rounded bg-emerald-50 flex items-center justify-center text-xs font-bold text-emerald-900 shadow-sm cursor-grab student-card';
          deskEl.setAttribute('data-student-id', assignedStudent.id);
          deskEl.innerText = assignedStudent.name;
        } else {
          deskEl.innerHTML = `<span class="text-slate-300 pointer-events-none">Desk ${idx + 1}</span>`;
        }

        canvas.appendChild(deskEl);
      });
    }

    // --- FIX FOR DRAG AND DROP BETWEEN UNASSIGNED AND DESKS ---
    function setupDragAndDrop() {
      // Draggable Student Cards
      interact('.student-card').draggable({
        inertia: false,
        autoScroll: true,
        listeners: {
          start(event) {
            event.target.classList.add('opacity-75', 'z-50');
          },
          move(event) {
            const target = event.target;
            const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
            const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
            target.style.transform = `translate(${x}px, ${y}px)`;
            target.setAttribute('data-x', x);
            target.setAttribute('data-y', y);
          },
          end(event) {
            const target = event.target;
            target.style.transform = 'none';
            target.removeAttribute('data-x');
            target.removeAttribute('data-y');
            target.classList.remove('opacity-75', 'z-50');
          }
        }
      });

      // Dropzone: Desks
      interact('.desk-slot').dropzone({
        accept: '.student-card',
        overlap: 0.5,
        ondrop(event) {
          const studentId = event.relatedTarget.getAttribute('data-student-id');
          const seatIdx = parseInt(event.target.getAttribute('data-seat-index'), 10);

          // Clear any existing occupant of this desk
          const existingOccupant = window.AppState.students.find(s => s.seatIndex === seatIdx);
          if (existingOccupant) existingOccupant.seatIndex = null;

          // Assign dragged student to this seat
          const student = window.AppState.students.find(s => s.id === studentId);
          if (student) {
            student.seatIndex = seatIdx;
            renderSeatingChartWorkspace();
          }
        }
      });

      // Dropzone: Return to Unassigned Roster Bench
      interact('.dropzone-bench').dropzone({
        accept: '.student-card',
        overlap: 0.2,
        ondrop(event) {
          const studentId = event.relatedTarget.getAttribute('data-student-id');
          const student = window.AppState.students.find(s => s.id === studentId);
          if (student) {
            student.seatIndex = null;
            renderSeatingChartWorkspace();
          }
        }
      });
    }

    // --- SAVE SEATING PLAN TO FIRESTORE ---
    window.saveSeatingPlan = async function() {
      if (!window.AppState.currentTeacher || !window.AppState.currentClassCode) {
        return alert('No active class plan to save.');
      }

      const planDocId = `${window.AppState.currentTeacher}_${window.AppState.currentClassCode}`.toLowerCase().replace(/[^a-z0-9]/g, '_');

      try {
        await setDoc(doc(db, "plans", planDocId), {
          teacherName: window.AppState.currentTeacher,
          classCode: window.AppState.currentClassCode,
          roomId: window.AppState.currentRoomId,
          students: window.AppState.students,
          updatedAt: new Date().toISOString()
        });

        alert('Seating plan saved successfully to Firestore!');
      } catch (err) {
        console.error(err);
        alert('Error saving plan: ' + err.message);
      }
    };

    // --- VIEW MODES ---
    window.setMode = function(mode) {
      window.AppState.activeViewMode = mode;
      const wrapper = document.getElementById('seating-canvas-wrapper');

      document.getElementById('btn-mode-teacher').className = mode === 'teacher' ? 'px-3 py-1 rounded-md bg-white shadow-sm font-medium' : 'px-3 py-1 rounded-md font-medium text-slate-600';
      document.getElementById('btn-mode-student').className = mode === 'student' ? 'px-3 py-1 rounded-md bg-white shadow-sm font-medium' : 'px-3 py-1 rounded-md font-medium text-slate-600';
      document.getElementById('btn-mode-flipped').className = mode === 'flipped' ? 'px-3 py-1 rounded-md bg-white shadow-sm font-medium' : 'px-3 py-1 rounded-md font-medium text-slate-600';

      wrapper.style.transform = (mode === 'flipped') ? 'rotate(180deg)' : 'rotate(0deg)';
    };

    // --- EXPORT PDF ---
    window.exportToPDF = function() {
      const { jsPDF } = window.jspdf;
      const canvasEl = document.getElementById('seating-canvas');

      html2canvas(canvasEl).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('landscape', 'mm', 'a4');
        pdf.setFontSize(16);
        pdf.text(`${window.AppState.currentClassCode} - ${window.AppState.currentTeacher}`, 10, 10);
        pdf.addImage(imgData, 'PNG', 10, 15, 277, 175);
        pdf.save(`${window.AppState.currentClassCode}_seating_plan.pdf`);
      });
    };

    // --- HOMEPAGE DIRECTORY ---
    async function renderHomeDirectory() {
      const roomContainer = document.getElementById('room-list');
      roomContainer.innerHTML = '<span class="text-xs text-slate-400">Loading saved rooms...</span>';

      const roomSnap = await getDocs(collection(db, "rooms"));
      roomContainer.innerHTML = '';

      if (roomSnap.empty) {
        roomContainer.innerHTML = '<span class="text-xs text-slate-400">No room designs saved yet. Click "+ Room Design" to create one.</span>';
      } else {
        roomSnap.forEach(docSnap => {
          const room = docSnap.data();
          roomContainer.innerHTML += `
            <div class="bg-white p-3 rounded-lg border shadow-sm text-center">
              <span class="font-bold text-sm block text-slate-800">${room.roomName}</span>
              <span class="text-xs text-slate-500">${room.deskLayout ? room.deskLayout.length : 0} Desks</span>
            </div>
          `;
        });
      }
    }

    // Initialize View
    showView('view-home');
  </script>
</body>
</html>
