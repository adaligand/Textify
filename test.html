<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .grid-bg {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
    }

    html,
    body {
      min-height: 100%;
    }

    body.dragging-active {
      cursor: grabbing !important;
      user-select: none !important;
    }

    .student-card,
    .desk-slot {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /*
      The actual dragged clone lives outside the scrollable roster.
      This prevents overflow-y-auto from clipping it while dragging.
    */
    #drag-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99999;
    }

    .drag-ghost {
      position: fixed;
      width: 240px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      opacity: 0.95;
      box-shadow: 0 15px 35px rgba(15, 23, 42, 0.25);
    }

    #seating-canvas {
      position: relative;
      overflow: hidden;
    }

    #room-stage {
      position: absolute;
      transform-origin: center center;
    }

    .room-desk {
      position: absolute;
      width: 112px;
      height: 64px;
    }

    .drop-highlight {
      border-color: #6366f1 !important;
      background: #eef2ff !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .bench-drop-highlight {
      background: #eef2ff !important;
      border-color: #818cf8 !important;
    }

    .drag-source-hidden {
      opacity: 0.25 !important;
    }

    .zoom-control {
      min-width: 70px;
      text-align: center;
    }
  </style>
</head>

    const app = initializeApp(firebaseConfig);

    window.AppState = {
      currentView: "view-home",

    const MAX_ZOOM = 2.5;
    const ZOOM_STEP = 0.1;


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function slugify(value) {
      return String(value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
    }


    window.showView = function(viewId) {
      document
        .querySelectorAll("main > section")
        .forEach(section => section.classList.add("hidden"));

      const view = document.getElementById(viewId);

      if (!view) {
        return;
      }

      view.classList.remove("hidden");
      window.AppState.currentView = viewId;

      cleanupDragState();

      if (viewId === "view-home") {
        renderHomeDirectory();
      }

      if (viewId === "view-saved-rooms") {
        renderSavedRooms();
      }

      if (viewId === "view-trash") {
        renderTrashBin();
        purgeExpiredTrashItems();
      }
    };


    /* ------------------------------------------------------------------
       ROOM DESIGNER
    ------------------------------------------------------------------ */


    window.openRoomBuilderForCreate = function() {
      window.AppState.editingRoomId = null;

      document.getElementById("room-name-input").value = "";
      document.getElementById("room-canvas").innerHTML = "";

      showView("view-room-builder");
    };


    window.openRoomBuilderForEdit = async function(roomId) {
      window.AppState.editingRoomId = roomId;

      const docSnap = await getDoc(doc(db, "rooms", roomId));

      if (!docSnap.exists()) {
        return;
      }

      const data = docSnap.data();

      document.getElementById("room-name-input").value =
        data.roomName || "";

      const canvas = document.getElementById("room-canvas");

      canvas.innerHTML = "";

      (data.deskLayout || []).forEach(desk => {
        renderRoomDeskElement(
          Number(desk.left) || 0,
          Number(desk.top) || 0
        );
      });

      showView("view-room-builder");
    };


    window.addDeskToRoom = function() {
      const canvas = document.getElementById("room-canvas");

      const deskCount =
        canvas.querySelectorAll(".room-desk-item").length;

      const columns = Math.max(
        1,
        Math.floor((canvas.clientWidth - 40) / 140)
      );

      const row = Math.floor(deskCount / columns);
      const column = deskCount % columns;

      renderRoomDeskElement(
        20 + column * 140,
        20 + row * 90
      );
    };


    function renderRoomDeskElement(left, top) {
      const canvas = document.getElementById("room-canvas");

      const desk = document.createElement("div");

      desk.className =
        "room-desk-item absolute w-28 h-16 bg-indigo-100 border-2 " +
        "border-indigo-500 rounded cursor-move flex items-center " +
        "justify-center text-xs font-bold text-indigo-800 " +
        "select-none shadow-sm";

      desk.style.left = `${left}px`;
      desk.style.top = `${top}px`;

      desk.textContent = "Desk";

      canvas.appendChild(desk);

      interact(desk).draggable({
        modifiers: [
          interact.modifiers.snap({
            targets: [
              interact.snappers.grid({
                x: 20,
                y: 20
              })
            ],
            range: Infinity,
            relativePoints: [
              {
                x: 0,
                y: 0
              }
            ]
          })
        ],

        listeners: {
          start(event) {
            document.body.classList.add("dragging-active");

            event.target.classList.add(
              "ring-2",
              "ring-indigo-400"
            );
          },

          move(event) {
            const target = event.target;

            const x =
              (parseFloat(target.getAttribute("data-x")) || 0) +
              event.dx;

            const y =
              (parseFloat(target.getAttribute("data-y")) || 0) +
              event.dy;

            target.style.transform =
              `translate(${x}px, ${y}px)`;

            target.setAttribute("data-x", x);
            target.setAttribute("data-y", y);
          },

          end(event) {
            const target = event.target;

            const x =
              (parseFloat(target.style.left) || 0) +
              (parseFloat(target.getAttribute("data-x")) || 0);

            const y =
              (parseFloat(target.style.top) || 0) +
              (parseFloat(target.getAttribute("data-y")) || 0);

            target.style.left = `${Math.max(0, Math.round(x / 20) * 20)}px`;
            target.style.top = `${Math.max(0, Math.round(y / 20) * 20)}px`;

            target.style.transform = "";
            target.removeAttribute("data-x");
            target.removeAttribute("data-y");

            target.classList.remove(
              "ring-2",
              "ring-indigo-400"
            );

            cleanupDragState();
          }
        }
      });
    }


    window.clearRoomCanvas = function() {
      document.getElementById("room-canvas").innerHTML = "";
    };


    window.saveRoomLayout = async function() {
      const name =
        document.getElementById("room-name-input").value.trim();

      if (!name) {
        alert("Enter room name.");
        return;
      }

      const deskElements =
        document.querySelectorAll(".room-desk-item");

      if (deskElements.length === 0) {
        alert("Add at least one desk before saving.");
        return;
      }

      const deskLayout = [];

      deskElements.forEach((element, index) => {
        const x =
          parseFloat(element.style.left) || 0;

        const y =
          parseFloat(element.style.top) || 0;

        deskLayout.push({
          id: index,
          left: Math.round(x),
          top: Math.round(y)
        });
      });

      const payload = {
        roomName: name,
        deskLayout,
        deleted: false,
        updatedAt: new Date().toISOString()
      };

      if (window.AppState.editingRoomId) {
        await updateDoc(
          doc(
            db,
            "rooms",
            window.AppState.editingRoomId
          ),
          payload
        );

        alert("Room updated successfully.");
      } else {
        await addDoc(
          collection(db, "rooms"),
          payload
        );

        alert("Room saved successfully.");
      }

      showView("view-saved-rooms");
    };


    window.duplicateRoom = async function(roomId) {
      const roomSnap =
        await getDoc(doc(db, "rooms", roomId));

      if (!roomSnap.exists()) {
        return;
      }

      const data = roomSnap.data();

      await addDoc(
        collection(db, "rooms"),
        {
          roomName: `${data.roomName} (Copy)`,
          deskLayout: data.deskLayout || [],
          deleted: false,
          updatedAt: new Date().toISOString()
        }
      );

      renderSavedRooms();
    };


    window.binRoom = async function(roomId) {
      if (!confirm(
        "Move this room design to the Recycle Bin?"
      )) {
        return;
      }

      await updateDoc(
        doc(db, "rooms", roomId),
        {
          deleted: true,
          deletedAt: new Date().toISOString()
        }
      );

      renderSavedRooms();
    };


    /* ------------------------------------------------------------------
       CLASS PLAN MODAL
    ------------------------------------------------------------------ */


    window.openNewClassModal = async function() {
      window.AppState.editingPlanId = null;

      document.getElementById("modal-class-title").textContent =
        "Create New Seating Plan";

      document.getElementById("input-teacher-name").value =
        window.AppState.activeTeacherFolder || "";

      document.getElementById("input-class-code").value = "";
      document.getElementById("input-batch-roster").value = "";

      await populateRoomDropdown();

      document
        .getElementById("modal-new-class")
        .classList.remove("hidden");
    };


    async function populateRoomDropdown() {
      const select =
        document.getElementById("select-room-design");

      select.innerHTML = "";

      const snapshot =
        await getDocs(collection(db, "rooms"));

      let roomCount = 0;

      snapshot.forEach(docSnap => {
        const data = docSnap.data();

        if (data.deleted) {
          return;
        }

        const option =
          document.createElement("option");

        option.value = docSnap.id;
        option.textContent = data.roomName;

        select.appendChild(option);

        roomCount += 1;
      });

      if (roomCount === 0) {
        const option =
          document.createElement("option");

        option.value = "";
        option.textContent = "No room designs available";

        select.appendChild(option);
      }
    }


    window.closeNewClassModal = function() {
      document
        .getElementById("modal-new-class")
        .classList.add("hidden");
    };

window.openEditClassModal = async function() {
  document.getElementById("modal-class-title").textContent = "Edit Seating Plan Details";
  document.getElementById("input-teacher-name").value = window.AppState.currentTeacher;
  document.getElementById("input-class-code").value = window.AppState.currentClassCode;
  
  await populateRoomDropdown();
  document.getElementById("select-room-design").value = window.AppState.currentRoomId;

  const rosterText = window.AppState.students.map(s => s.name).join('\n');
  document.getElementById("input-batch-roster").value = rosterText;
  
  document.getElementById("modal-new-class").classList.remove("hidden");
};

window.confirmCreateNewClass = async function() {
  const teacher = document.getElementById("input-teacher-name").value.trim();
  const code = document.getElementById("input-class-code").value.trim();
  const roomId = document.getElementById("select-room-design").value;
  const rosterRaw = document.getElementById("input-batch-roster").value.trim();

  if (!teacher || !code || !roomId || !rosterRaw) {
    alert("Fill in all required fields.");
    return;
  }

  const studentNames = rosterRaw.split(/\r?\n/).map(name => name.trim()).filter(Boolean);

  if (studentNames.length === 0) {
    alert("Enter at least one student.");
    return;
  }

  // Reconcile roster to preserve assigned seats and flags for existing students
  const existingStudents = window.AppState.students || [];
  const timestamp = Date.now();
  const newStudents = studentNames.map((name, index) => {
    const existing = existingStudents.find(s => s.name.toLowerCase() === name.toLowerCase());
    if (existing) return existing; 
    return { id: `s_${timestamp}_${index}`, name, seatIndex: null };
  });

  // Update room layout if the room was changed
  if (window.AppState.currentRoomId !== roomId || !window.AppState.roomDesks.length) {
    const roomSnap = await getDoc(doc(db, "rooms", roomId));
    if (!roomSnap.exists()) {
      alert("The selected room no longer exists.");
      return;
    }
    const roomData = roomSnap.data();
    window.AppState.roomDesks = Array.isArray(roomData.deskLayout) ? roomData.deskLayout : [];
  }

  window.AppState.currentTeacher = teacher;
  window.AppState.currentClassCode = code;
  window.AppState.currentRoomId = roomId;
  window.AppState.students = newStudents;
  
  // Unassign students if they are seated at a desk index that no longer exists in a newly selected, smaller room
  window.AppState.students.forEach(s => {
    if (s.seatIndex !== null && s.seatIndex >= window.AppState.roomDesks.length) {
      s.seatIndex = null;
    }
  });

  closeNewClassModal();
  renderSeatingChartWorkspace();
  showView("view-chart");
};


    window.openPlanForEdit = async function(planId) {
      const planSnap =
        await getDoc(doc(db, "plans", planId));

      if (!planSnap.exists()) {
        return;
      }

      const plan = planSnap.data();

      window.AppState.editingPlanId = planId;
      window.AppState.currentTeacher =
        plan.teacherName || "";

      window.AppState.currentClassCode =
        plan.classCode || "";

      window.AppState.currentRoomId =
        plan.roomId || "";

      window.AppState.students =
        Array.isArray(plan.students)
          ? plan.students
          : [];

      const roomSnap =
        await getDoc(
          doc(db, "rooms", window.AppState.currentRoomId)
        );

      if (roomSnap.exists()) {
        const roomData = roomSnap.data();

        window.AppState.roomDesks =
          Array.isArray(roomData.deskLayout)
            ? roomData.deskLayout
            : [];
      } else {
        window.AppState.roomDesks = [];
      }

      window.AppState.seatingZoom = null;
      window.AppState.activeViewMode = "teacher";

      renderSeatingChartWorkspace();
      showView("view-chart");
    };


    window.duplicatePlan = async function(planId) {
      const planSnap =
        await getDoc(doc(db, "plans", planId));

      if (!planSnap.exists()) {
        return;
      }

      const data = planSnap.data();

      const newCode =
        `${data.classCode} (Copy)`;

      const newPlanId =
        `${data.teacherName}_${newCode}`
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "_");

      await setDoc(
        doc(db, "plans", newPlanId),
        {
          ...data,
          classCode: newCode,
          updatedAt: new Date().toISOString(),
          deleted: false
        }
      );

      renderHomeDirectory();
    };


    window.binPlan = async function(planId) {
      if (!confirm(
        "Move this seating plan to the Recycle Bin?"
      )) {
        return;
      }

      await updateDoc(
        doc(db, "plans", planId),
        {
          deleted: true,
          deletedAt: new Date().toISOString()
        }
      );

      renderHomeDirectory();
    };

    function renderSeatingChartWorkspace() {
      document.getElementById("chart-title").textContent =
        `${window.AppState.currentClassCode} Seating Plan`;

      document.getElementById("chart-subtitle").textContent =
        `Teacher: ${window.AppState.currentTeacher}`;

      renderUnassignedBench();
      renderCanvasDesks();

      requestAnimationFrame(() => {
        fitSeatingToFrame();
      });
    }


    function renderUnassignedBench() {
      const bench =
        document.getElementById("unassigned-bench");

      bench.innerHTML = "";

      const unassigned =
        window.AppState.students.filter(
          student => student.seatIndex === null
        );

      document.getElementById("unassigned-count").textContent =
        unassigned.length;

      unassigned.forEach(student => {
        const item =
          createStudentCard(student);

        bench.appendChild(item);
      });
    }


    function createStudentCard(student) {
      const item =
        document.createElement("div");

      item.className =
        "student-card bg-indigo-600 hover:bg-indigo-700 " +
        "text-white p-2 rounded shadow text-xs font-bold " +
        "cursor-grab select-none relative z-20";

      item.setAttribute(
        "data-student-id",
        student.id
      );

      item.textContent = student.name;

      return item;
    }


    function getRoomBounds() {
      const desks = window.AppState.roomDesks;

      if (!desks.length) {
        return {
          minX: 0,
          minY: 0,
          maxX: DESK_WIDTH,
          maxY: DESK_HEIGHT,
          width: DESK_WIDTH,
          height: DESK_HEIGHT
        };
      }

      const minX =
        Math.min(...desks.map(desk => Number(desk.left) || 0));

      const minY =
        Math.min(...desks.map(desk => Number(desk.top) || 0));

      const maxX =
        Math.max(
          ...desks.map(
            desk =>
              (Number(desk.left) || 0) +
              DESK_WIDTH
          )
        );

      const maxY =
        Math.max(
          ...desks.map(
            desk =>
              (Number(desk.top) || 0) +
              DESK_HEIGHT
          )
        );

      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(DESK_WIDTH, maxX - minX),
        height: Math.max(DESK_HEIGHT, maxY - minY)
      };
    }

 function calculateAutoZoom() {
  const canvas = document.getElementById("seating-canvas");
  const bounds = getRoomBounds(); // Define bounds here
  if (!canvas || !bounds) return 1;

  const padding = ROOM_PADDING;
  const availableWidth = canvas.clientWidth - padding;
  const availableHeight = canvas.clientHeight - padding;
  
  // Define width and height based on bounds
  const roomWidth = bounds.width; 
  const roomHeight = bounds.height;

  if (roomWidth <= 0 || roomHeight <= 0) return 1;

  const scaleX = availableWidth / roomWidth;
  const scaleY = availableHeight / roomHeight;

  return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, Math.min(scaleX, scaleY)));
}

function renderCanvasDesks() {
  const stage = document.getElementById("room-stage"); 
  const canvas = document.getElementById("seating-canvas");
  if (!stage || !canvas) return;

  stage.innerHTML = "";

  const zoom = getSeatingZoom();
  const bounds = getRoomBounds();
  const roomWidth = bounds.width;
  const roomHeight = bounds.height;
  const desks = window.AppState.roomDesks; 

  stage.style.width = `${roomWidth}px`;
  stage.style.height = `${roomHeight}px`;

  // Center stage inside canvas viewport
  stage.style.left = `${Math.max(0, (canvas.clientWidth - roomWidth * zoom) / 2)}px`;
  stage.style.top = `${Math.max(0, (canvas.clientHeight - roomHeight * zoom) / 2)}px`;
  stage.style.transformOrigin = "0 0";
  stage.style.transform = `scale(${zoom})`;

  const isFlipped = window.AppState.activeViewMode === "flipped";
  const isTeacherView = window.AppState.activeViewMode === "teacher";

  desks.forEach((desk, index) => {
    const deskElement = document.createElement("div");

    const rawLeft = Number(desk.left) || 0;
    const rawTop = Number(desk.top) || 0;

    let left = rawLeft - bounds.minX + ROOM_PADDING / 2;
    let top = rawTop - bounds.minY + ROOM_PADDING / 2;

    if (isFlipped) {
      left = roomWidth - (rawLeft - bounds.minX) - DESK_WIDTH - ROOM_PADDING / 2;
      top = roomHeight - (rawTop - bounds.minY) - DESK_HEIGHT - ROOM_PADDING / 2;
    }

    deskElement.style.left = `${left}px`;
    deskElement.style.top = `${top}px`;
    deskElement.style.position = "absolute";
    deskElement.dataset.seatIndex = String(index);

    const assignedStudent = window.AppState.students.find(
      student => student.seatIndex !== null && Number(student.seatIndex) === index
    );

    if (assignedStudent) {
      deskElement.className =
        "desk-slot room-desk border-2 border-emerald-500 rounded bg-emerald-100 " +
        "flex flex-col items-center justify-between p-1 text-xs font-bold text-emerald-900 " +
        "shadow-md cursor-pointer student-card z-20 overflow-hidden relative group";

      deskElement.dataset.studentId = assignedStudent.id;

      // --- Unassign Button ---
      const removeBtn = document.createElement("button");
      removeBtn.className =
        "absolute top-0.5 right-0.5 w-4 h-4 bg-red-500 hover:bg-red-600 " +
        "text-white rounded-full text-[9px] flex items-center justify-center " +
        "font-bold z-30 shadow-sm cursor-pointer";
      removeBtn.textContent = "✕";
      removeBtn.title = "Unassign student";
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        unassignStudent(assignedStudent.id);
      };
      deskElement.appendChild(removeBtn);

      // --- Name Parsing ---
      const fullName = (assignedStudent.name || "").trim();
      const nameParts = fullName.split(/\s+/);
      const firstName = nameParts[0] || "";
      const lastName = nameParts.slice(1).join(" ") || "";

      // --- Line 1: First Name ---
      const firstNameEl = document.createElement("span");
      firstNameEl.className = "font-bold text-xs truncate w-full text-center px-1 leading-tight pointer-events-none";
      firstNameEl.textContent = firstName;
      deskElement.appendChild(firstNameEl);

      // --- Line 2: Last Name (SVG auto-scaled to remain on single line) ---
      if (lastName) {
        const lastNameContainer = document.createElement("div");
        lastNameContainer.className = "w-full px-1 pointer-events-none flex justify-center items-center h-3.5";
        
        const svgBoxWidth = Math.max(100, lastName.length * 9);
        lastNameContainer.innerHTML = `
          <svg class="w-full h-full" viewBox="0 0 ${svgBoxWidth} 14" preserveAspectRatio="xMidYMid meet">
            <text x="50%" y="11" text-anchor="middle" font-size="11" font-weight="bold" fill="#064e3b">${escapeHtml(lastName)}</text>
          </svg>
        `;
        deskElement.appendChild(lastNameContainer);
      }

      // --- Line 3: Target Grade (Confidential - Teacher View Only) ---
      if (isTeacherView && assignedStudent.grade) {
        const gradeEl = document.createElement("span");
        gradeEl.className = "text-[10px] text-emerald-800 font-semibold truncate w-full text-center px-1 leading-tight pointer-events-none";
        gradeEl.textContent = `🎯 ${assignedStudent.grade}`;
        deskElement.appendChild(gradeEl);
      }

      // --- Line 4: Flags (Confidential - Teacher View Only) ---
      const flagsText = getStudentFlagIcons(assignedStudent);
      if (isTeacherView && flagsText) {
        const flagsEl = document.createElement("span");
        flagsEl.className = "text-[10px] text-emerald-800 font-normal truncate w-full text-center px-1 leading-tight pointer-events-none";
        flagsEl.textContent = flagsText;
        deskElement.appendChild(flagsEl);
      }

      // Open metadata flags modal on card click
      deskElement.onclick = () => openStudentFlagsModal(assignedStudent.id);
    } else {
      deskElement.className =
        "desk-slot room-desk border-2 border-slate-300 rounded bg-white " +
        "flex flex-col items-center justify-center text-xs shadow-sm overflow-hidden";

      const deskNumber = document.createElement("span");
      deskNumber.className = "text-slate-400 pointer-events-none font-medium";
      deskNumber.textContent = `Desk ${index + 1}`;

      deskElement.appendChild(deskNumber);
    }

    stage.appendChild(deskElement);
  });

  updateZoomDisplay();
  setupDragAndDrop();
}

    function getSeatingZoom() {
      return window.AppState.seatingZoom ??
        calculateAutoZoom();
    }

    function cleanupDragState() {
  document.body.classList.remove("dragging-active");

  document.querySelectorAll(".drag-source-hidden").forEach(element => {
    element.classList.remove("drag-source-hidden");
  });

  document.querySelectorAll(".drop-highlight").forEach(element => {
    element.classList.remove("drop-highlight");
  });

  document.querySelectorAll(".bench-drop-highlight").forEach(element => {
    element.classList.remove("bench-drop-highlight");
  });

  document.querySelectorAll("[data-dragging='true']").forEach(element => {
    element.removeAttribute("data-dragging");
  });

  // ADD THIS LINE: Destroys all visual drag clones to prevent duplicates
  document.getElementById("drag-layer").innerHTML = "";

  window.AppState.dragState.active = false;
  window.AppState.dragState.target = null;
}


    function installGlobalDragRecovery() {
      const cleanup = () => {
        if (window.AppState.dragState.active) {
          cleanupDragState();
        }
      };

      window.addEventListener(
        "pointerup",
        cleanup,
        true
      );

      window.addEventListener(
        "pointercancel",
        cleanup,
        true
      );

      window.addEventListener(
        "mouseup",
        cleanup,
        true
      );

      window.addEventListener(
        "touchend",
        cleanup,
        true
      );

      window.addEventListener(
        "touchcancel",
        cleanup,
        true
      );

      window.addEventListener(
        "blur",
        cleanup
      );

      document.addEventListener(
        "visibilitychange",
        cleanup
      );
    }


    function destroyStudentInteractions() {
      interact(".student-card").unset();
      interact(".desk-slot").unset();
      interact(".dropzone-bench").unset();

      cleanupDragState();
    }


    function setupDragAndDrop() {
      destroyStudentInteractions();

      setupStudentDraggable();
      setupDeskDropzones();
      setupBenchDropzone();
    }
let dragClone = null;

function setupStudentDraggable() {
  interact(".student-card").draggable({
    inertia: false,
    autoScroll: true,

    listeners: {
      start(event) {
        const target = event.target;
        window.AppState.dragState.active = true;
        window.AppState.dragState.target = target;

        document.body.classList.add("dragging-active");
        target.dataset.dragging = "true";
        target.classList.add("drag-source-hidden");

        // Force wipe the layer in case an old clone got stuck
        document.getElementById("drag-layer").innerHTML = "";

        const dragClone = target.cloneNode(true);
        dragClone.id = "active-drag-clone"; 
        dragClone.classList.remove("drag-source-hidden");
        dragClone.classList.add("drag-ghost");
        
        // CRITICAL: Force the clone to ignore the mouse so the dropzone can see the cursor
        dragClone.style.pointerEvents = "none";
        
        document.getElementById("drag-layer").appendChild(dragClone);
        
        // Use clientX/clientY for standard cursor tracking
        dragClone.style.left = `${event.clientX}px`;
        dragClone.style.top = `${event.clientY}px`;
      },

      move(event) {
        const target = event.target;
        const zoom = getSeatingZoom() || 1;

        const x = (parseFloat(target.getAttribute("data-x")) || 0) + (event.dx / zoom);
        const y = (parseFloat(target.getAttribute("data-y")) || 0) + (event.dy / zoom);

        target.style.transform = `translate(${x}px, ${y}px)`;
        target.setAttribute("data-x", String(x));
        target.setAttribute("data-y", String(y));

        const dragClone = document.getElementById("active-drag-clone");
        if (dragClone) {
          dragClone.style.left = `${event.clientX}px`;
          dragClone.style.top = `${event.clientY}px`;
        }
      },

      end(event) {
        const target = event.target;
        target.style.transform = "";
        target.removeAttribute("data-x");
        target.removeAttribute("data-y");
        
        document.getElementById("drag-layer").innerHTML = ""; // Force clear
        cleanupDragState();
      },

      cancel(event) {
        if (event && event.target) {
          event.target.style.transform = "";
          event.target.removeAttribute("data-x");
          event.target.removeAttribute("data-y");
        }
        
        document.getElementById("drag-layer").innerHTML = ""; // Force clear
        cleanupDragState();
      }
    }
  });
}
    function setupDeskDropzones() {
      interact(".desk-slot").dropzone({
        accept: ".student-card",
        overlap: "pointer",

        ondragenter(event) {
          event.target.classList.add(
            "drop-highlight"
          );
        },

        ondragleave(event) {
          event.target.classList.remove(
            "drop-highlight"
          );
        },

        ondrop(event) {
          const studentId =
            event.relatedTarget.dataset.studentId;

          const seatIndex =
            Number(
              event.target.dataset.seatIndex
            );

          if (!studentId || Number.isNaN(seatIndex)) {
            return;
          }

          assignStudentToSeat(
            studentId,
            seatIndex
          );
        },

        ondropdeactivate(event) {
          event.target.classList.remove(
            "drop-highlight"
          );
        }
      });
    }

function getStudentFlagIcons(student) {
  let flags = [];
  if (student.eal) flags.push("🌍");
  if (student.pp) flags.push("🅿️");
  if (student.gt) flags.push("⭐");
  if (student.sen) flags.push("🅺");
  if (student.lac) flags.push("❤️");
  if (student.med) flags.push("🚑");
  if (student.yc) flags.push("C");
  return flags.join(" ");
}

    function setupBenchDropzone() {
      interact(".dropzone-bench").dropzone({
        accept: ".student-card",
        overlap:"pointer",

        ondragenter(event) {
          event.target.classList.add(
            "bench-drop-highlight"
          );
        },

        ondragleave(event) {
          event.target.classList.remove(
            "bench-drop-highlight"
          );

          const studentId =
            event.relatedTarget.dataset.studentId;

          if (!studentId) {

          }

          unassignStudent(

          );

        ondropdeactivate(event) {

    function assignStudentToSeat(
      studentId,
      seatIndex
    ) {
      const student =
        window.AppState.students.find(
          item => item.id === studentId
        );

      if (!student) {
        return;
      }

      const previousSeat =
        student.seatIndex;

      const existingStudent =
        window.AppState.students.find(
          item =>
            item.id !== studentId &&
            Number(item.seatIndex) === seatIndex
        );

      if (existingStudent) {
        existingStudent.seatIndex =
          previousSeat === null
            ? null
            : previousSeat;
      }

      student.seatIndex =
        seatIndex;

      cleanupDragState();

      renderSeatingChartWorkspace();
    }


    function unassignStudent(studentId) {
      const student =
        window.AppState.students.find(
          item => item.id === studentId
        );

      if (!student) {
        return;
      }

      student.seatIndex = null;

      cleanupDragState();

      renderSeatingChartWorkspace();
    }


    /* ------------------------------------------------------------------
       ZOOM / FIT
    ------------------------------------------------------------------ */


    function fitSeatingToFrame() {
      window.AppState.seatingZoom =
        calculateAutoZoom();

      renderCanvasDesks();
    }


    function zoomInSeating() {
      const current =
        getSeatingZoom();

      window.AppState.seatingZoom =
        Math.min(
          MAX_ZOOM,
          current + ZOOM_STEP
        );

      renderCanvasDesks();
    }


    function zoomOutSeating() {
      const current =
        getSeatingZoom();

      window.AppState.seatingZoom =
        Math.max(
          MIN_ZOOM,
          current - ZOOM_STEP
        );

      renderCanvasDesks();
    }


    function updateZoomDisplay() {
      const display =
        document.getElementById("zoom-display");

      if (!display) {
        return;
      }

      const zoom =
        getSeatingZoom();

      const autoZoom =
        calculateAutoZoom();

      if (
        window.AppState.seatingZoom === null ||
        window.AppState.seatingZoom === undefined
      ) {
        display.textContent =
          "Auto";
        return;
      }

      if (
        Math.abs(zoom - autoZoom) < 0.01
      ) {
        display.textContent =
          "Auto";
        return;
      }

      display.textContent =
        `${Math.round(zoom * 100)}%`;
    }


    window.zoomInSeating =
      zoomInSeating;

    window.zoomOutSeating =
      zoomOutSeating;

    window.fitSeatingToFrame =
      fitSeatingToFrame;


    /* ------------------------------------------------------------------
       SAVE PLAN
    ------------------------------------------------------------------ */


    window.saveSeatingPlan = async function() {
      if (
        !window.AppState.currentTeacher ||
        !window.AppState.currentClassCode
      ) {
        alert("No active class plan.");
        return;
      }

      const planDocId =
        window.AppState.editingPlanId ||
        slugify(
          `${window.AppState.currentTeacher}_${window.AppState.currentClassCode}`
        );

      await setDoc(
        doc(db, "plans", planDocId),
        {
          teacherName:
            window.AppState.currentTeacher,

          classCode:
            window.AppState.currentClassCode,

          roomId:
            window.AppState.currentRoomId,

          students:
            window.AppState.students,

          updatedAt:
            new Date().toISOString(),

          deleted: false
        }
      );

      window.AppState.editingPlanId =
        planDocId;

      alert("Seating plan saved.");
    };


    /* ------------------------------------------------------------------
       RECYCLE BIN
    ------------------------------------------------------------------ */


    window.restoreItem =
      async function(collectionName, id) {
        await updateDoc(
          doc(db, collectionName, id),
          {
            deleted: false,
            deletedAt: null
          }
        );

        renderTrashBin();
      };


    async function purgeExpiredTrashItems() {
      const now = Date.now();

      const cutoff =
        30 *
        24 *
        60 *
        60 *
        1000;

      for (const collectionName of [
        "rooms",
        "plans"
      ]) {
        const snapshot =
          await getDocs(
            collection(db, collectionName)
          );

        for (const docSnap of snapshot.docs) {
          const data =
            docSnap.data();

          if (
            !data.deleted ||
            !data.deletedAt
          ) {
            continue;
          }

          const deletedTime =
            new Date(
              data.deletedAt
            ).getTime();

          if (
            Number.isFinite(deletedTime) &&
            now - deletedTime > cutoff
          ) {
            await deleteDoc(
              doc(
                db,
                collectionName,
                docSnap.id
              )
            );
          }
        }
      }
    }


    /* ------------------------------------------------------------------
       HOME DIRECTORY
    ------------------------------------------------------------------ */


    window.openTeacherFolder =
      function(teacherName) {
        window.AppState.activeTeacherFolder =
          teacherName;

        renderHomeDirectory();
      };


    window.closeTeacherFolder =
      function() {
        window.AppState.activeTeacherFolder =
          null;

        renderHomeDirectory();
      };


    async function renderHomeDirectory() {
      const folderContainer =
        document.getElementById(
          "teacher-folder-list"
        );

      const planContainer =
        document.getElementById(
          "teacher-plan-list"
        );

      folderContainer.innerHTML =
        '<span class="text-xs text-slate-400">Loading...</span>';

      const planSnap =
        await getDocs(
          collection(db, "plans")
        );

      const teacherMap = {};
      const activePlans = [];

      planSnap.forEach(docSnap => {
        const plan =
          docSnap.data();

        if (plan.deleted) {
          return;
        }

        const activePlan = {
          id: docSnap.id,
          ...plan
        };

        activePlans.push(
          activePlan
        );

        const teacherName =
          plan.teacherName ||
          "Unassigned";

        teacherMap[teacherName] =
          (teacherMap[teacherName] || 0) + 1;
      });


      if (
        window.AppState.activeTeacherFolder
      ) {
        document.getElementById(
          "section-plans-title"
        ).textContent =
          `Teacher: ${window.AppState.activeTeacherFolder}`;

        document.getElementById(
          "btn-back-teachers"
        ).classList.remove("hidden");

        folderContainer.classList.add(
          "hidden"
        );

        planContainer.classList.remove(
          "hidden"
        );

        const filteredPlans =
          activePlans.filter(
            plan =>
              plan.teacherName ===
              window.AppState.activeTeacherFolder
          );

        planContainer.innerHTML = "";

        filteredPlans.forEach(plan => {
          const card =
            document.createElement("div");

          card.className =
            "bg-white p-4 rounded-lg border shadow-sm " +
            "flex flex-col justify-between space-y-3";

          const info =
            document.createElement("div");

          const className =
            document.createElement("span");

          className.className =
            "font-bold text-base block text-slate-800";

          className.textContent =
            plan.classCode;

          const studentCount =
            document.createElement("span");

          studentCount.className =
            "text-xs text-slate-500";

          studentCount.textContent =
            `${plan.students?.length || 0} Students`;

          info.appendChild(className);
          info.appendChild(studentCount);

          const actions =
            document.createElement("div");

          actions.className =
            "flex gap-1 border-t pt-2 text-xs";

          const openButton =
            createButton(
              "Open",
              "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium",
              () =>
                window.openPlanForEdit(plan.id)
            );

          const copyButton =
            createButton(
              "Duplicate",
              "bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded",
              () =>
                window.duplicatePlan(plan.id)
            );

          const binButton =
            createButton(
              "Bin",
              "bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded ml-auto",
              () =>
                window.binPlan(plan.id)
            );

          actions.appendChild(openButton);
          actions.appendChild(copyButton);
          actions.appendChild(binButton);

          card.appendChild(info);
          card.appendChild(actions);

          planContainer.appendChild(card);
        });

        if (filteredPlans.length === 0) {
          planContainer.innerHTML =
            '<span class="text-xs text-slate-400">No seating plans for this teacher.</span>';
        }

        return;
      }


      document.getElementById(
        "section-plans-title"
      ).textContent =
        "Teachers";

      document.getElementById(
        "btn-back-teachers"
      ).classList.add("hidden");

      folderContainer.classList.remove(
        "hidden"
      );

      planContainer.classList.add(
        "hidden"
      );

      folderContainer.innerHTML = "";

      const teacherNames =
        Object.keys(teacherMap)
          .sort((a, b) =>
            a.localeCompare(b)
          );

      teacherNames.forEach(teacherName => {
        const card =
          document.createElement("div");

        card.className =
          "bg-white p-4 rounded-lg border shadow-sm " +
          "hover:border-indigo-500 hover:shadow-md cursor-pointer " +
          "transition flex items-center gap-3";

        card.addEventListener(
          "click",
          () =>
            window.openTeacherFolder(
              teacherName
            )
        );

        const icon =
          document.createElement("span");

        icon.className =
          "text-3xl";

        icon.textContent =
          "📁";

        const info =
          document.createElement("div");

        const name =
          document.createElement("span");

        name.className =
          "font-bold text-sm block text-slate-800";

        name.textContent =
          teacherName;

        const count =
          document.createElement("span");

        count.className =
          "text-xs text-slate-500";

        count.textContent =
          `${teacherMap[teacherName]} Plan(s)`;

        info.appendChild(name);
        info.appendChild(count);

        card.appendChild(icon);
        card.appendChild(info);

        folderContainer.appendChild(card);
      });

      if (teacherNames.length === 0) {
        folderContainer.innerHTML =
          '<span class="text-xs text-slate-400">No teachers found. Create a plan to get started.</span>';
      }
    }


    function createButton(
      text,
      className,
      onClick
    ) {
      const button =
        document.createElement("button");

      button.className =
        className;

      button.textContent =
        text;

      button.addEventListener(
        "click",
        event => {
          event.stopPropagation();
          onClick();
        }
      );

      return button;
    }


    /* ------------------------------------------------------------------
       SAVED ROOMS
    ------------------------------------------------------------------ */


    async function renderSavedRooms() {
      const roomContainer =
        document.getElementById(
          "room-list"
        );

      roomContainer.innerHTML =
        '<span class="text-xs text-slate-400">Loading saved rooms...</span>';

      const roomSnap =
        await getDocs(
          collection(db, "rooms")
        );

      roomContainer.innerHTML = "";

      roomSnap.forEach(docSnap => {
        const room =
          docSnap.data();

        if (room.deleted) {
          return;
        }

        const card =
          document.createElement("div");

        card.className =
          "bg-white p-3 rounded-lg border shadow-sm " +
          "flex flex-col justify-between space-y-2";

        const info =
          document.createElement("div");

        const name =
          document.createElement("span");

        name.className =
          "font-bold text-sm block text-slate-800";

        name.textContent =
          room.roomName;

        const deskCount =
          document.createElement("span");

        deskCount.className =
          "text-xs text-slate-500";

        deskCount.textContent =
          `${room.deskLayout?.length || 0} Desks`;

        info.appendChild(name);
        info.appendChild(deskCount);

        const actions =
          document.createElement("div");

        actions.className =
          "flex gap-1 border-t pt-2 text-xs";

        actions.appendChild(
          createButton(
            "Edit",
            "bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-1.5 py-1 rounded",
            () =>
              window.openRoomBuilderForEdit(
                docSnap.id
              )
          )
        );

        actions.appendChild(
          createButton(
            "Copy",
            "bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-1 rounded",
            () =>
              window.duplicateRoom(
                docSnap.id
              )
          )
        );

        actions.appendChild(
          createButton(
            "Bin",
            "bg-red-50 hover:bg-red-100 text-red-600 px-1.5 py-1 rounded ml-auto",
            () =>
              window.binRoom(
                docSnap.id
              )
          )
        );

        card.appendChild(info);
        card.appendChild(actions);

        roomContainer.appendChild(card);
      });

      if (!roomContainer.children.length) {
        roomContainer.innerHTML =
          '<span class="text-xs text-slate-400">No room designs saved.</span>';
      }
    }


    /* ------------------------------------------------------------------
       TRASH
    ------------------------------------------------------------------ */


    async function renderTrashBin() {
      const trashContainer =
        document.getElementById(
          "trash-list"
        );

      trashContainer.innerHTML =
        '<span class="text-xs text-slate-400">Loading trash...</span>';

      const trashItems = [];

      const planSnap =
        await getDocs(
          collection(db, "plans")
        );

      planSnap.forEach(docSnap => {
        const plan =
          docSnap.data();

        if (!plan.deleted) {
          return;
        }

        trashItems.push({
          type: "Plan",
          name:
            `${plan.classCode} (${plan.teacherName})`,
          id: docSnap.id,
          collection: "plans"
        });
      });


      const roomSnap =
        await getDocs(
          collection(db, "rooms")
        );

      roomSnap.forEach(docSnap => {
        const room =
          docSnap.data();

        if (!room.deleted) {
          return;
        }

        trashItems.push({
          type: "Room",
          name: room.roomName,
          id: docSnap.id,
          collection: "rooms"
        });
      });


      trashContainer.innerHTML = "";


      if (!trashItems.length) {
        trashContainer.innerHTML =
          '<span class="text-xs text-slate-400">Recycle Bin is empty.</span>';

        return;
      }


      trashItems.forEach(item => {
        const card =
          document.createElement("div");

        card.className =
          "bg-slate-50 p-3 rounded border shadow-sm " +
          "flex justify-between items-center text-xs";

        const info =
          document.createElement("div");

        const name =
          document.createElement("span");

        name.className =
          "font-semibold text-slate-700 block";

        name.textContent =
          item.name;

        const type =
          document.createElement("span");

        type.className =
          "text-[10px] text-slate-400 uppercase";

        type.textContent =
          item.type;

        info.appendChild(name);
        info.appendChild(type);

        const restore =
          createButton(
            "Restore",
            "bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded font-medium border border-emerald-200",
            () =>
              window.restoreItem(
                item.collection,
                item.id
              )
          );

        card.appendChild(info);
        card.appendChild(restore);

        trashContainer.appendChild(card);
      });
    }


    /* ------------------------------------------------------------------
       VIEW MODES
    ------------------------------------------------------------------ */


    window.setMode =
      function(mode) {
        window.AppState.activeViewMode =
          mode;

        const modes = [
          "teacher",
          "student",
          "flipped"
        ];

        modes.forEach(currentMode => {
          const button =
            document.getElementById(
              `btn-mode-${currentMode}`
            );

          if (!button) {
            return;
          }

          if (currentMode === mode) {
            button.className =
              "px-3 py-1 rounded-md bg-white shadow-sm font-medium";
          } else {
            button.className =
              "px-3 py-1 rounded-md font-medium text-slate-600";
          }
        });

        renderCanvasDesks();
      };


    /* ------------------------------------------------------------------
       PDF
    ------------------------------------------------------------------ */


    window.exportToPDF =
      async function() {
        const {
          jsPDF
        } = window.jspdf;

        const canvasElement =
          document.getElementById(
            "seating-canvas"
          );

        cleanupDragState();

        const canvas =
          await html2canvas(
            canvasElement,
            {
              backgroundColor: "#f8fafc",
              scale: 2
            }
          );

        const imageData =
          canvas.toDataURL(
            "image/png"
          );

        const pdf =
          new jsPDF(
            "landscape",
            "mm",
            "a4"
          );

        pdf.setFontSize(16);

        pdf.text(
          `${window.AppState.currentClassCode} - ${window.AppState.currentTeacher}`,
          10,
          10
        );

        const pageWidth =
          277;

        const pageHeight =
          175;

        const imageRatio =
          canvas.width /
          canvas.height;

        let width =
          pageWidth;

        let height =
          width /
          imageRatio;

        if (height > pageHeight) {
          height =
            pageHeight;

          width =
            height *
            imageRatio;
        }

        pdf.addImage(
          imageData,
          "PNG",
          10,
          15,
          width,
          height
        );

        const filename =
          `${slugify(window.AppState.currentClassCode)}_seating_plan.pdf`;

        pdf.save(filename);
      };


    /* ------------------------------------------------------------------
       RESIZE
    ------------------------------------------------------------------ */


    let resizeTimer = null;

    window.addEventListener(
      "resize",
      () => {
        clearTimeout(resizeTimer);

        resizeTimer =
          setTimeout(() => {
            if (
              window.AppState.currentView ===
              "view-chart"
            ) {
              if (
                window.AppState.seatingZoom === null ||
                window.AppState.seatingZoom === undefined
              ) {
                renderCanvasDesks();
              }
            }
          }, 100);
      }
    );


    /* ------------------------------------------------------------------
       INITIALIZATION
    ------------------------------------------------------------------ */


    installGlobalDragRecovery();

    showView("view-home");
  </script>
</body>
