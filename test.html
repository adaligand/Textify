<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassTile Web</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Interact.js -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <!-- PDF Generation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .grid-bg {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
    }
    /* Prevents cursor locking and stuck touch/mouse events during drag */
    .dragging-active {
      cursor: grabbing !important;
      user-select: none !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- TOP NAVBAR -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-2 cursor-pointer" onclick="showView('view-home')">
      <span class="text-2xl font-bold tracking-wide">ClassTile Web</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openRoomBuilderForCreate()" class="bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded text-sm font-medium transition">+ Room Design</button>
      <button onclick="openNewClassModal()" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded text-sm font-medium transition">+ New Class Plan</button>
      <button onclick="showView('view-saved-rooms')" class="bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded text-sm font-medium transition">Saved Rooms</button>
      <button onclick="showView('view-trash')" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm font-medium transition flex items-center gap-1">🗑️ Recycle Bin</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="p-6 max-w-[1600px] mx-auto">

    <!-- VIEW 1: HOMEPAGE (TEACHER FOLDERS ONLY) -->
    <section id="view-home" class="space-y-6">
      <div class="flex items-center gap-2">
        <button id="btn-back-teachers" onclick="closeTeacherFolder()" class="hidden text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded text-slate-700">← Back to Teachers</button>
        <h2 id="section-plans-title" class="text-xl font-bold text-slate-700">Teachers</h2>
      </div>
      
      <div id="teacher-folder-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
      <div id="teacher-plan-list" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <!-- VIEW 2: SAVED ROOMS -->
    <section id="view-saved-rooms" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-700">Saved Room Designs</h2>
        <button onclick="openRoomBuilderForCreate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm font-medium">+ Create Room Design</button>
      </div>
      <div id="room-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4"></div>
    </section>

    <!-- VIEW 3: RECYCLE BIN -->
    <section id="view-trash" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-lg border border-slate-300 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-slate-700 flex items-center gap-2">🗑️ Recycle Bin</h2>
          <span class="text-xs text-slate-500">Items permanently deleted after 30 days</span>
        </div>
        <div id="trash-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3"></div>
      </div>
    </section>

    <!-- VIEW 4: ROOM DESIGNER -->
    <section id="view-room-builder" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border">
        <div class="flex gap-4 items-center">
          <input type="text" id="room-name-input" placeholder="Room Name (e.g. Lab 101)" class="border p-2 rounded w-64 text-sm">
          <button onclick="addDeskToRoom()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded text-sm">+ Add Desk</button>
          <button onclick="clearRoomCanvas()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded text-sm border border-red-200">Clear Desks</button>
        </div>
        <div class="flex gap-2">
          <button onclick="showView('view-home')" class="px-3 py-2 text-sm text-slate-600">Cancel</button>
          <button onclick="saveRoomLayout()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium">Save Room Design</button>
        </div>
      </div>

      <div id="room-canvas" class="relative w-full h-[700px] bg-white rounded-lg border-2 border-dashed border-slate-300 overflow-hidden grid-bg"></div>
    </section>

    <!-- VIEW 5: SEATING CHART WORKSPACE -->
    <section id="view-chart" class="hidden space-y-4">
      <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-lg shadow-sm border gap-4">
        <div>
          <h1 id="chart-title" class="text-xl font-bold text-slate-800">Class Seating Chart</h1>
          <p id="chart-subtitle" class="text-xs text-slate-500">Teacher | Room</p>
        </div>

        <div class="flex bg-slate-100 p-1 rounded-lg border text-sm">
          <button id="btn-mode-teacher" onclick="setMode('teacher')" class="px-3 py-1 rounded-md bg-white shadow-sm font-medium">Teacher View</button>
          <button id="btn-mode-student" onclick="setMode('student')" class="px-3 py-1 rounded-md font-medium text-slate-600">Student View</button>
          <button id="btn-mode-flipped" onclick="setMode('flipped')" class="px-3 py-1 rounded-md font-medium text-slate-600">Flip 180°</button>
        </div>

        <div class="flex gap-2">
          <button onclick="exportToPDF()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded text-sm font-medium">Export PDF</button>
          <button onclick="saveSeatingPlan()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded text-sm font-medium shadow-sm">Save Plan</button>
        </div>
      </div>

      <div class="flex gap-6 w-full items-start">
        <!-- Unassigned Roster Sidebar -->
        <div class="w-72 bg-white p-4 rounded-lg shadow-sm border flex-shrink-0">
          <h3 class="font-bold text-sm text-slate-700 mb-2">Unassigned Roster (<span id="unassigned-count">0</span>)</h3>
          <div id="unassigned-bench" class="space-y-2 h-[700px] overflow-y-auto p-2 bg-slate-50 rounded border dropzone-bench relative"></div>
        </div>

        <!-- Seating Canvas Area -->
        <div class="flex-grow bg-white p-4 rounded-lg shadow-sm border overflow-hidden">
          <div id="seating-canvas" class="relative w-full h-[700px] bg-slate-50 rounded border border-slate-200 overflow-hidden"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: NEW / EDIT CLASS PLAN -->
  <div id="modal-new-class" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg p-6 max-w-lg w-full space-y-4 shadow-xl">
      <h3 id="modal-class-title" class="text-lg font-bold border-b pb-2">Create New Seating Plan</h3>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Teacher Name</label>
          <input type="text" id="input-teacher-name" class="w-full border p-2 rounded text-sm" placeholder="e.g. Mr. Smith">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Class Code</label>
          <input type="text" id="input-class-code" class="w-full border p-2 rounded text-sm" placeholder="e.g. 9P / Science">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Select Room Design</label>
          <select id="select-room-design" class="w-full border p-2 rounded text-sm bg-white"></select>
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-500">Batch Roster Input (One name per line)</label>
          <textarea id="input-batch-roster" rows="5" class="w-full border p-2 rounded text-sm" placeholder="Mia Amos&#10;Harry Benton&#10;Skyla Sayers"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t">
        <button onclick="closeNewClassModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
        <button onclick="confirmCreateNewClass()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded font-medium">Build Seating Chart</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBSU87WMLPKqBwpO_6fQzWF2vgXrkz1d0E",
      authDomain: "classtile-19e74.firebaseapp.com",
      projectId: "classtile-19e74",
      storageBucket: "classtile-19e74.firebasestorage.app",
      messagingSenderId: "826310108132",
      appId: "1:826310108132:web:315b6e4d3a732cabd75df1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.AppState = {
      currentView: 'view-home',
      activeTeacherFolder: null,
      editingRoomId: null,
      editingPlanId: null,
      currentTeacher: '',
      currentClassCode: '',
      currentRoomId: '',
      activeViewMode: 'teacher',
      students: [],
      roomDesks: []
    };

    window.showView = function(viewId) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
      window.AppState.currentView = viewId;

      if (viewId === 'view-home') renderHomeDirectory();
      if (viewId === 'view-saved-rooms') renderSavedRooms();
      if (viewId === 'view-trash') {
        renderTrashBin();
        purgeExpiredTrashItems();
      }
    };

    // --- ROOM DESIGNER ENGINE ---
    window.openRoomBuilderForCreate = function() {
      window.AppState.editingRoomId = null;
      document.getElementById('room-name-input').value = '';
      document.getElementById('room-canvas').innerHTML = '';
      showView('view-room-builder');
    };

    window.openRoomBuilderForEdit = async function(roomId) {
      window.AppState.editingRoomId = roomId;
      const docSnap = await getDoc(doc(db, "rooms", roomId));
      if (!docSnap.exists()) return;

      const data = docSnap.data();
      document.getElementById('room-name-input').value = data.roomName;
      const canvas = document.getElementById('room-canvas');
      canvas.innerHTML = '';

      if (data.deskLayout) {
        data.deskLayout.forEach(desk => {
          renderRoomDeskElement(desk.left, desk.top);
        });
      }

      showView('view-room-builder');
    };

    window.addDeskToRoom = function() {
      renderRoomDeskElement(20, 20);
    };

    function renderRoomDeskElement(left, top) {
      const canvas = document.getElementById('room-canvas');
      const desk = document.createElement('div');
      desk.className = 'room-desk-item absolute w-28 h-16 bg-indigo-100 border-2 border-indigo-500 rounded cursor-move flex items-center justify-center text-xs font-bold text-indigo-800 select-none shadow-sm';
      desk.style.left = left + 'px';
      desk.style.top = top + 'px';
      desk.innerText = 'Desk';
      canvas.appendChild(desk);
    }

    window.clearRoomCanvas = function() {
      document.getElementById('room-canvas').innerHTML = '';
    };

    interact('.room-desk-item').draggable({
      modifiers: [
        interact.modifiers.snap({
          targets: [ interact.snappers.grid({ x: 20, y: 20 }) ],
          range: Infinity,
          relativePoints: [ { x: 0, y: 0 } ]
        })
      ],
      listeners: {
        move(event) {
          const target = event.target;
          const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
          const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
          target.style.transform = `translate(${x}px, ${y}px)`;
          target.setAttribute('data-x', x);
          target.setAttribute('data-y', y);
        }
      }
    });

    window.saveRoomLayout = async function() {
      const name = document.getElementById('room-name-input').value.trim();
      if (!name) return alert('Enter room name');

      const deskElements = document.querySelectorAll('.room-desk-item');
      if (deskElements.length === 0) return alert('Add at least one desk before saving.');

      const deskLayout = [];

      deskElements.forEach((el, index) => {
        const xOffset = parseFloat(el.getAttribute('data-x')) || 0;
        const yOffset = parseFloat(el.getAttribute('data-y')) || 0;
        const originalLeft = parseFloat(el.style.left) || 0;
        const originalTop = parseFloat(el.style.top) || 0;

        deskLayout.push({
          id: index,
          left: Math.round(originalLeft + xOffset),
          top: Math.round(originalTop + yOffset)
        });
      });

      const payload = {
        roomName: name,
        deskLayout: deskLayout,
        deleted: false
      };

      if (window.AppState.editingRoomId) {
        await updateDoc(doc(db, "rooms", window.AppState.editingRoomId), payload);
        alert('Room Updated Successfully!');
      } else {
        await addDoc(collection(db, "rooms"), payload);
        alert('Room Saved Successfully!');
      }

      showView('view-saved-rooms');
    };

    window.duplicateRoom = async function(roomId) {
      const roomSnap = await getDoc(doc(db, "rooms", roomId));
      if (!roomSnap.exists()) return;

      const data = roomSnap.data();
      await addDoc(collection(db, "rooms"), {
        roomName: `${data.roomName} (Copy)`,
        deskLayout: data.deskLayout,
        deleted: false
      });

      renderSavedRooms();
    };

    window.binRoom = async function(roomId) {
      if (!confirm('Move this room design to the Recycle Bin?')) return;
      await updateDoc(doc(db, "rooms", roomId), {
        deleted: true,
        deletedAt: new Date().toISOString()
      });
      renderSavedRooms();
    };

    // --- SEATING PLAN MANAGEMENT & MODAL ---
    window.openNewClassModal = async function() {
      window.AppState.editingPlanId = null;
      document.getElementById('modal-class-title').innerText = "Create New Seating Plan";
      document.getElementById('input-teacher-name').value = window.AppState.activeTeacherFolder || '';
      document.getElementById('input-class-code').value = '';
      document.getElementById('input-batch-roster').value = '';

      await populateRoomDropdown();
      document.getElementById('modal-new-class').classList.remove('hidden');
    };

    async function populateRoomDropdown() {
      const select = document.getElementById('select-room-design');
      select.innerHTML = '';
      const snapshot = await getDocs(collection(db, "rooms"));

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (!data.deleted) {
          select.innerHTML += `<option value="${docSnap.id}">${data.roomName}</option>`;
        }
      });
    }

    window.closeNewClassModal = () => document.getElementById('modal-new-class').classList.add('hidden');

    window.confirmCreateNewClass = async function() {
      const teacher = document.getElementById('input-teacher-name').value.trim();
      const code = document.getElementById('input-class-code').value.trim();
      const roomId = document.getElementById('select-room-design').value;
      const rosterRaw = document.getElementById('input-batch-roster').value.trim();

      if (!teacher || !code || !rosterRaw) return alert('Fill in all required fields.');

      const studentNames = rosterRaw.split('\n').filter(n => n.trim().length > 0);
      const students = studentNames.map((name, i) => ({
        id: 's_' + i + '_' + Date.now(),
        name: name.trim(),
        seatIndex: null
      }));

      const roomSnap = await getDoc(doc(db, "rooms", roomId));
      window.AppState.roomDesks = roomSnap.data().deskLayout;
      window.AppState.currentTeacher = teacher;
      window.AppState.currentClassCode = code;
      window.AppState.currentRoomId = roomId;
      window.AppState.students = students;

      closeNewClassModal();
      renderSeatingChartWorkspace();
      showView('view-chart');
    };

    window.openPlanForEdit = async function(planId) {
      const planSnap = await getDoc(doc(db, "plans", planId));
      if (!planSnap.exists()) return;

      const plan = planSnap.data();
      window.AppState.editingPlanId = planId;
      window.AppState.currentTeacher = plan.teacherName;
      window.AppState.currentClassCode = plan.classCode;
      window.AppState.currentRoomId = plan.roomId;
      window.AppState.students = plan.students;

      const roomSnap = await getDoc(doc(db, "rooms", plan.roomId));
      if (roomSnap.exists()) {
        window.AppState.roomDesks = roomSnap.data().deskLayout;
      }

      renderSeatingChartWorkspace();
      showView('view-chart');
    };

    window.duplicatePlan = async function(planId) {
      const planSnap = await getDoc(doc(db, "plans", planId));
      if (!planSnap.exists()) return;

      const data = planSnap.data();
      const newCode = `${data.classCode} (Copy)`;
      const newPlanId = `${data.teacherName}_${newCode}`.toLowerCase().replace(/[^a-z0-9]/g, '_');

      await setDoc(doc(db, "plans", newPlanId), {
        ...data,
        classCode: newCode,
        updatedAt: new Date().toISOString(),
        deleted: false
      });

      renderHomeDirectory();
    };

    window.binPlan = async function(planId) {
      if (!confirm('Move this seating plan to the Recycle Bin?')) return;
      await updateDoc(doc(db, "plans", planId), {
        deleted: true,
        deletedAt: new Date().toISOString()
      });
      renderHomeDirectory();
    };

    // --- SEATING WORKSPACE ENGINE ---
    function renderSeatingChartWorkspace() {
      document.getElementById('chart-title').innerText = `${window.AppState.currentClassCode} Seating Plan`;
      document.getElementById('chart-subtitle').innerText = `Teacher: ${window.AppState.currentTeacher}`;

      renderUnassignedBench();
      renderCanvasDesks();
      setupDragAndDrop();
    }

    function renderUnassignedBench() {
      const bench = document.getElementById('unassigned-bench');
      bench.innerHTML = '';

      const unassigned = window.AppState.students.filter(s => s.seatIndex === null);
      document.getElementById('unassigned-count').innerText = unassigned.length;

      unassigned.forEach(student => {
        const item = document.createElement('div');
        item.className = 'student-card bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded shadow text-xs font-bold cursor-grab select-none relative z-20';
        item.setAttribute('data-student-id', student.id);
        item.innerText = student.name;
        bench.appendChild(item);
      });
    }

    function renderCanvasDesks() {
      const canvas = document.getElementById('seating-canvas');
      canvas.innerHTML = '';

      const isFlipped = window.AppState.activeViewMode === 'flipped';
      const canvasWidth = canvas.clientWidth || 1000;
      const canvasHeight = canvas.clientHeight || 700;

      window.AppState.roomDesks.forEach((desk, idx) => {
        const deskEl = document.createElement('div');
        
        let posX = desk.left;
        let posY = desk.top;

        if (isFlipped) {
          posX = canvasWidth - desk.left - 112;
          posY = canvasHeight - desk.top - 64;
        }

        deskEl.style.left = posX + 'px';
        deskEl.style.top = posY + 'px';
        deskEl.setAttribute('data-seat-index', idx);

        const assignedStudent = window.AppState.students.find(s => s.seatIndex === idx);
        if (assignedStudent) {
          deskEl.className = 'desk-slot absolute w-28 h-16 border-2 border-emerald-500 rounded bg-emerald-100 flex flex-col items-center justify-center text-xs font-bold text-emerald-900 shadow-md cursor-grab student-card z-20';
          deskEl.setAttribute('data-student-id', assignedStudent.id);
          deskEl.innerHTML = `<span class="pointer-events-none truncate w-full text-center">${assignedStudent.name}</span><span class="text-[9px] text-emerald-600 pointer-events-none">Desk ${idx + 1}</span>`;
        } else {
          deskEl.className = 'desk-slot absolute w-28 h-16 border-2 border-slate-300 rounded bg-white flex flex-col items-center justify-center text-xs shadow-sm transition-all overflow-hidden p-1';
          deskEl.innerHTML = `<span class="text-slate-400 pointer-events-none font-medium">Desk ${idx + 1}</span>`;
        }

        canvas.appendChild(deskEl);
      });
    }

    // ROBUST INTERACT DRAG & DROP
    function setupDragAndDrop() {
      interact('.student-card').draggable({
        inertia: false,
        autoScroll: true,
        listeners: {
          start(event) {
            const target = event.target;
            document.body.classList.add('dragging-active');
            target.classList.add('opacity-80', 'z-50', 'ring-2', 'ring-indigo-400');
          },
          move(event) {
            const target = event.target;
            const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
            const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
            target.style.transform = `translate(${x}px, ${y}px)`;
            target.setAttribute('data-x', x);
            target.setAttribute('data-y', y);
          },
          end(event) {
            const target = event.target;
            document.body.classList.remove('dragging-active');
            target.style.transform = '';
            target.removeAttribute('data-x');
            target.removeAttribute('data-y');
            target.classList.remove('opacity-80', 'z-50', 'ring-2', 'ring-indigo-400');
          }
        }
      });

      interact('.desk-slot').dropzone({
        accept: '.student-card',
        overlap: 0.1,
        ondrop(event) {
          const studentId = event.relatedTarget.getAttribute('data-student-id');
          const seatIdx = parseInt(event.target.getAttribute('data-seat-index'), 10);

          const existingOccupant = window.AppState.students.find(s => s.seatIndex === seatIdx);
          if (existingOccupant) existingOccupant.seatIndex = null;

          const student = window.AppState.students.find(s => s.id === studentId);
          if (student) {
            student.seatIndex = seatIdx;
            renderSeatingChartWorkspace();
          }
        }
      });

      interact('.dropzone-bench').dropzone({
        accept: '.student-card',
        overlap: 0.1,
        ondrop(event) {
          const studentId = event.relatedTarget.getAttribute('data-student-id');
          const student = window.AppState.students.find(s => s.id === studentId);
          if (student) {
            student.seatIndex = null;
            renderSeatingChartWorkspace();
          }
        }
      });
    }

    window.saveSeatingPlan = async function() {
      if (!window.AppState.currentTeacher || !window.AppState.currentClassCode) return alert('No active class plan.');

      const planDocId = window.AppState.editingPlanId || `${window.AppState.currentTeacher}_${window.AppState.currentClassCode}`.toLowerCase().replace(/[^a-z0-9]/g, '_');

      await setDoc(doc(db, "plans", planDocId), {
        teacherName: window.AppState.currentTeacher,
        classCode: window.AppState.currentClassCode,
        roomId: window.AppState.currentRoomId,
        students: window.AppState.students,
        updatedAt: new Date().toISOString(),
        deleted: false
      });

      alert('Seating plan saved!');
    };

    // --- RECYCLE BIN ENGINE ---
    window.restoreItem = async function(collectionName, id) {
      await updateDoc(doc(db, collectionName, id), {
        deleted: false,
        deletedAt: null
      });
      renderTrashBin();
    };

    async function purgeExpiredTrashItems() {
      const now = new Date();
      const cutoff = 30 * 24 * 60 * 60 * 1000;

      ['rooms', 'plans'].forEach(async (coll) => {
        const snap = await getDocs(collection(db, coll));
        snap.forEach(async (docSnap) => {
          const data = docSnap.data();
          if (data.deleted && data.deletedAt) {
            const deletedDate = new Date(data.deletedAt);
            if (now - deletedDate > cutoff) {
              await deleteDoc(doc(db, coll, docSnap.id));
            }
          }
        });
      });
    }

    // --- HOMEPAGE TEACHER FOLDERS ---
    window.openTeacherFolder = function(teacherName) {
      window.AppState.activeTeacherFolder = teacherName;
      renderHomeDirectory();
    };

    window.closeTeacherFolder = function() {
      window.AppState.activeTeacherFolder = null;
      renderHomeDirectory();
    };

    async function renderHomeDirectory() {
      const folderContainer = document.getElementById('teacher-folder-list');
      const planContainer = document.getElementById('teacher-plan-list');

      folderContainer.innerHTML = '<span class="text-xs text-slate-400">Loading...</span>';

      const planSnap = await getDocs(collection(db, "plans"));
      const teacherMap = {};
      const activePlans = [];

      planSnap.forEach(docSnap => {
        const plan = docSnap.data();
        if (!plan.deleted) {
          activePlans.push({ id: docSnap.id, ...plan });
          const tName = plan.teacherName || 'Unassigned';
          if (!teacherMap[tName]) teacherMap[tName] = 0;
          teacherMap[tName]++;
        }
      });

      if (window.AppState.activeTeacherFolder) {
        document.getElementById('section-plans-title').innerText = `Teacher: ${window.AppState.activeTeacherFolder}`;
        document.getElementById('btn-back-teachers').classList.remove('hidden');
        folderContainer.classList.add('hidden');
        planContainer.classList.remove('hidden');

        const filteredPlans = activePlans.filter(p => p.teacherName === window.AppState.activeTeacherFolder);
        planContainer.innerHTML = '';

        filteredPlans.forEach(plan => {
          planContainer.innerHTML += `
            <div class="bg-white p-4 rounded-lg border shadow-sm flex flex-col justify-between space-y-3">
              <div>
                <span class="font-bold text-base block text-slate-800">${plan.classCode}</span>
                <span class="text-xs text-slate-500">${plan.students ? plan.students.length : 0} Students</span>
              </div>
              <div class="flex gap-1 border-t pt-2 text-xs">
                <button onclick="openPlanForEdit('${plan.id}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium">Open</button>
                <button onclick="duplicatePlan('${plan.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded">Duplicate</button>
                <button onclick="binPlan('${plan.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded ml-auto">Bin</button>
              </div>
            </div>
          `;
        });

        if (filteredPlans.length === 0) {
          planContainer.innerHTML = '<span class="text-xs text-slate-400">No seating plans for this teacher.</span>';
        }

      } else {
        document.getElementById('section-plans-title').innerText = 'Teachers';
        document.getElementById('btn-back-teachers').classList.add('hidden');
        folderContainer.classList.remove('hidden');
        planContainer.classList.add('hidden');

        folderContainer.innerHTML = '';
        const teacherNames = Object.keys(teacherMap);

        teacherNames.forEach(tName => {
          folderContainer.innerHTML += `
            <div onclick="openTeacherFolder('${tName}')" class="bg-white p-4 rounded-lg border shadow-sm hover:border-indigo-500 hover:shadow-md cursor-pointer transition flex items-center gap-3">
              <span class="text-3xl">📁</span>
              <div>
                <span class="font-bold text-sm block text-slate-800">${tName}</span>
                <span class="text-xs text-slate-500">${teacherMap[tName]} Plan(s)</span>
              </div>
            </div>
          `;
        });

        if (teacherNames.length === 0) {
          folderContainer.innerHTML = '<span class="text-xs text-slate-400">No teachers found. Create a plan to get started.</span>';
        }
      }
    }

    // --- RENDER SAVED ROOMS VIEW ---
    async function renderSavedRooms() {
      const roomContainer = document.getElementById('room-list');
      roomContainer.innerHTML = '<span class="text-xs text-slate-400">Loading saved rooms...</span>';

      const roomSnap = await getDocs(collection(db, "rooms"));
      roomContainer.innerHTML = '';

      roomSnap.forEach(docSnap => {
        const room = docSnap.data();
        if (!room.deleted) {
          roomContainer.innerHTML += `
            <div class="bg-white p-3 rounded-lg border shadow-sm flex flex-col justify-between space-y-2">
              <div>
                <span class="font-bold text-sm block text-slate-800">${room.roomName}</span>
                <span class="text-xs text-slate-500">${room.deskLayout ? room.deskLayout.length : 0} Desks</span>
              </div>
              <div class="flex gap-1 border-t pt-2 text-xs">
                <button onclick="openRoomBuilderForEdit('${docSnap.id}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-1.5 py-1 rounded">Edit</button>
                <button onclick="duplicateRoom('${docSnap.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-1 rounded">Copy</button>
                <button onclick="binRoom('${docSnap.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-1.5 py-1 rounded ml-auto">Bin</button>
              </div>
            </div>
          `;
        }
      });

      if (!roomContainer.innerHTML) roomContainer.innerHTML = '<span class="text-xs text-slate-400">No room designs saved.</span>';
    }

    // --- RENDER RECYCLE BIN VIEW ---
    async function renderTrashBin() {
      const trashContainer = document.getElementById('trash-list');
      trashContainer.innerHTML = '<span class="text-xs text-slate-400">Loading trash...</span>';

      const trashItems = [];

      const planSnap = await getDocs(collection(db, "plans"));
      planSnap.forEach(docSnap => {
        const plan = docSnap.data();
        if (plan.deleted) {
          trashItems.push({ type: 'Plan', name: `${plan.classCode} (${plan.teacherName})`, id: docSnap.id, collection: 'plans' });
        }
      });

      const roomSnap = await getDocs(collection(db, "rooms"));
      roomSnap.forEach(docSnap => {
        const room = docSnap.data();
        if (room.deleted) {
          trashItems.push({ type: 'Room', name: room.roomName, id: docSnap.id, collection: 'rooms' });
        }
      });

      trashContainer.innerHTML = '';

      if (trashItems.length === 0) {
        trashContainer.innerHTML = '<span class="text-xs text-slate-400">Recycle Bin is empty.</span>';
      } else {
        trashItems.forEach(item => {
          trashContainer.innerHTML += `
            <div class="bg-slate-50 p-3 rounded border shadow-sm flex justify-between items-center text-xs">
              <div>
                <span class="font-semibold text-slate-700 block">${item.name}</span>
                <span class="text-[10px] text-slate-400 uppercase">${item.type}</span>
              </div>
              <button onclick="restoreItem('${item.collection}', '${item.id}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded font-medium border border-emerald-200">Restore</button>
            </div>
          `;
        });
      }
    }

    // --- VIEW MODES ---
    window.setMode = function(mode) {
      window.AppState.activeViewMode = mode;

      document.getElementById('btn-mode-teacher').className = mode === 'teacher' ? 'px-3 py-1 rounded-md bg-white shadow-sm font-medium' : 'px-3 py-1 rounded-md font-medium text-slate-600';
      document.getElementById('btn-mode-student').className = mode === 'student' ? 'px-3 py-1 rounded-md bg-white shadow-sm font-medium' : 'px-3 py-1 rounded-md font-medium text-slate-600';
      document.getElementById('btn-mode-flipped').className = mode === 'flipped' ? 'px-3 py-1 rounded-md bg-white shadow-sm font-medium' : 'px-3 py-1 rounded-md font-medium text-slate-600';

      renderCanvasDesks();
      setupDragAndDrop();
    };

    // --- EXPORT PDF ---
    window.exportToPDF = function() {
      const { jsPDF } = window.jspdf;
      const canvasEl = document.getElementById('seating-canvas');

      html2canvas(canvasEl).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('landscape', 'mm', 'a4');
        pdf.setFontSize(16);
        pdf.text(`${window.AppState.currentClassCode} - ${window.AppState.currentTeacher}`, 10, 10);
        pdf.addImage(imgData, 'PNG', 10, 15, 277, 175);
        pdf.save(`${window.AppState.currentClassCode}_seating_plan.pdf`);
      });
    };

    showView('view-home');
  </script>
</body>
</html>
