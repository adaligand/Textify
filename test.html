<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassTile Web</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .grid-bg {
      background-size: 20px 20px;
      background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
    }

    html,
    body {
      min-height: 100%;
    }

    body.dragging-active {
      cursor: grabbing !important;
      user-select: none !important;
    }

    .student-card,
    .desk-slot {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #drag-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99999;
    }

    .drag-ghost {
      position: fixed;
      width: 240px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      opacity: 0.95;
      box-shadow: 0 15px 35px rgba(15, 23, 42, 0.25);
    }

    #seating-canvas {
      position: relative;
      overflow: hidden;
    }

    #room-stage {
      position: absolute;
      transform-origin: center center;
    }

    .room-desk {
      position: absolute;
      width: 112px;
      height: 80px;
    }

    .drop-highlight {
      border-color: #6366f1 !important;
      background: #eef2ff !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .bench-drop-highlight {
      background: #eef2ff !important;
      border-color: #818cf8 !important;
    }

    .drag-source-hidden {
      opacity: 0.25 !important;
    }

    .zoom-control {
      min-width: 70px;
      text-align: center;
    }

    #seating-canvas:fullscreen {
      background-color: #f8fafc;
      padding: 1rem;
      width: 100vw;
      height: 100vh;
      border: none;
      border-radius: 0;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    </div>

    <div class="flex items-center gap-2">
      <button

      <button

      <button

    window.AppState = {

      currentTeacher: "",

        active: false,
        target: null
      }
    };


    const DESK_WIDTH = 112;
    const DESK_HEIGHT = 80;
    const ROOM_PADDING = 80;
    const MIN_ZOOM = 0.05;
    const MAX_ZOOM = 2.5;
    const ZOOM_STEP = 0.1;


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function slugify(value) {
      return String(value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
    }


    window.showView = function(viewId) {
      document
        .querySelectorAll("main > section")
        .forEach(section => section.classList.add("hidden"));

      const view = document.getElementById(viewId);

      if (!view) {
        return;
      }

      view.classList.remove("hidden");
      window.AppState.currentView = viewId;

      cleanupDragState();

      if (viewId === "view-home") {
        renderHomeDirectory();
      }

      if (viewId === "view-saved-rooms") {
        renderSavedRooms();
      }

      if (viewId === "view-trash") {
        renderTrashBin();
        purgeExpiredTrashItems();
      }
    };


    /* ------------------------------------------------------------------
       ROOM DESIGNER
    ------------------------------------------------------------------ */


    window.openRoomBuilderForCreate = function() {
      window.AppState.editingRoomId = null;

      document.getElementById("room-name-input").value = "";
      document.getElementById("room-canvas").innerHTML = "";

      showView("view-room-builder");
    };


window.openRoomBuilderForEdit = async function(roomId) {
  window.AppState.editingRoomId = roomId;

  const docSnap = await getDoc(doc(db, "rooms", roomId));
  if (!docSnap.exists()) return;

  const data = docSnap.data();
  document.getElementById("room-name-input").value = data.roomName || "";

  const canvas = document.getElementById("room-canvas");
  canvas.innerHTML = "";

  (data.deskLayout || []).forEach(desk => {
    renderRoomDeskElement(
      Number(desk.left) || 0,
      Number(desk.top) || 0,
      Number(desk.rotation) || 0
    );
  });

  updateRoomDeskNumbers();
  showView("view-room-builder");
};

window.addDeskToRoom = function() {
  const canvas = document.getElementById("room-canvas");
  if (!canvas) return;

  const existingDesks = Array.from(canvas.querySelectorAll(".room-desk-item")).map(desk => ({
    left: parseFloat(desk.style.left) || 0,
    top: parseFloat(desk.style.top) || 0
  }));

  const gridStepX = 140; // Desk width (112px) + gap
  const gridStepY = 100; // Desk height (80px) + gap
  const maxCols = Math.max(1, Math.floor((canvas.clientWidth - 40) / gridStepX));
  const maxRows = Math.max(1, Math.floor((canvas.clientHeight - 40) / gridStepY));

  let targetLeft = 20;
  let targetTop = 20;
  let foundSpot = false;

  // Search row-by-row within visible canvas bounds
  for (let r = 0; r < maxRows; r++) {
    for (let c = 0; c < maxCols; c++) {
      const testLeft = 20 + c * gridStepX;
      const testTop = 20 + r * gridStepY;

      const isOccupied = existingDesks.some(
        d => Math.abs(d.left - testLeft) < 60 && Math.abs(d.top - testTop) < 40
      );

      if (!isOccupied) {
        targetLeft = testLeft;
        targetTop = testTop;
        foundSpot = true;
        break;
      }
    }
    if (foundSpot) break;
  }

  // Fallback: offset within visible frame if canvas is full
  if (!foundSpot) {
    const offset = (existingDesks.length * 20) % 100;
    targetLeft = 20 + offset;
    targetTop = 20 + offset;
  }

  renderRoomDeskElement(targetLeft, targetTop, 0);
};

function updateRoomDeskNumbers() {
  const canvas = document.getElementById("room-canvas");
  if (!canvas) return;

  const deskElements = Array.from(canvas.querySelectorAll(".room-desk-item"));

  // Sort spatial order: top-to-bottom, left-to-right (30px row tolerance)
  deskElements.sort((a, b) => {
    const topA = parseFloat(a.style.top) || 0;
    const topB = parseFloat(b.style.top) || 0;
    const leftA = parseFloat(a.style.left) || 0;
    const leftB = parseFloat(b.style.left) || 0;

    if (Math.abs(topA - topB) > 30) {
      return topA - topB;
    }
    return leftA - leftB;
  });

  deskElements.forEach((desk, index) => {
    const label = desk.querySelector(".desk-label");
    if (label) {
      label.textContent = `Desk ${index + 1}`;
    }
  });
}

function renderRoomDeskElement(left, top, rotation = 0) {
  const canvas = document.getElementById("room-canvas");

  const desk = document.createElement("div");
  desk.className =
    "room-desk-item absolute w-28 h-20 bg-indigo-100 border-2 " +
    "border-indigo-500 rounded cursor-move flex items-center " +
    "justify-center text-xs font-bold text-indigo-800 " +
    "select-none shadow-sm transition-transform duration-100";

  desk.style.left = `${left}px`;
  desk.style.top = `${top}px`;
  desk.setAttribute("data-rotation", String(rotation));

  if (rotation) {
    desk.style.transform = `rotate(${rotation}deg)`;
  }

  // Rotate button in top-left corner
  const rotateBtn = document.createElement("button");
  rotateBtn.className =
    "absolute -top-1.5 -left-1.5 w-5 h-5 bg-indigo-600 hover:bg-indigo-700 " +
    "text-white rounded-full text-[10px] flex items-center justify-center " +
    "font-bold z-10 shadow-sm cursor-pointer";
  rotateBtn.innerHTML = "↻";
  rotateBtn.title = "Rotate 90°";
  rotateBtn.onclick = (e) => {
    e.stopPropagation();
    let curRot = (parseInt(desk.getAttribute("data-rotation")) || 0) + 90;
    if (curRot >= 360) curRot = 0;
    desk.setAttribute("data-rotation", String(curRot));
    desk.style.transform = curRot ? `rotate(${curRot}deg)` : "";
  };
  desk.appendChild(rotateBtn);

  const label = document.createElement("span");
  label.className = "desk-label pointer-events-none";
  desk.appendChild(label);

  // Delete button in top-right corner
  const removeBtn = document.createElement("button");
  removeBtn.className =
    "absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 hover:bg-red-600 " +
    "text-white rounded-full text-[9px] flex items-center justify-center " +
    "font-bold z-10 shadow-sm cursor-pointer";
  removeBtn.textContent = "✕";
  removeBtn.title = "Delete desk";
  removeBtn.onclick = (e) => {
    e.stopPropagation();
    desk.remove();
    updateRoomDeskNumbers();
  };
  desk.appendChild(removeBtn);

  desk.addEventListener("mousedown", () => {
    document.querySelectorAll(".room-desk-item").forEach(d => d.style.zIndex = "1");
    desk.style.zIndex = "10";
  });

  interact(desk).draggable({
    modifiers: [
      interact.modifiers.snap({
        targets: [interact.snappers.grid({ x: 20, y: 20 })],
        range: Infinity,
        relativePoints: [{ x: 0, y: 0 }]
      })
    ],

    listeners: {
      start(event) {
        document.body.classList.add("dragging-active");
        event.target.classList.add("ring-2", "ring-indigo-400");
      },

      move(event) {
        const target = event.target;
        const x = (parseFloat(target.getAttribute("data-x")) || 0) + event.dx;
        const y = (parseFloat(target.getAttribute("data-y")) || 0) + event.dy;
        const currentRot = parseInt(target.getAttribute("data-rotation")) || 0;

        target.style.transform = `translate(${x}px, ${y}px)${currentRot ? ` rotate(${currentRot}deg)` : ""}`;
        target.setAttribute("data-x", x);
        target.setAttribute("data-y", y);
      },

      end(event) {
        const target = event.target;
        const x = (parseFloat(target.style.left) || 0) + (parseFloat(target.getAttribute("data-x")) || 0);
        const y = (parseFloat(target.style.top) || 0) + (parseFloat(target.getAttribute("data-y")) || 0);

        let finalLeft = Math.max(0, Math.round(x / 20) * 20);
        let finalTop = Math.max(0, Math.round(y / 20) * 20);

        if (canvas) {
          const maxLeft = Math.max(0, canvas.clientWidth - 112);
          const maxTop = Math.max(0, canvas.clientHeight - 80);
          finalLeft = Math.min(finalLeft, maxLeft);
          finalTop = Math.min(finalTop, maxTop);
        }

        target.style.left = `${finalLeft}px`;
        target.style.top = `${finalTop}px`;

        const currentRot = parseInt(target.getAttribute("data-rotation")) || 0;
        target.style.transform = currentRot ? `rotate(${currentRot}deg)` : "";

        target.removeAttribute("data-x");
        target.removeAttribute("data-y");
        target.classList.remove("ring-2", "ring-indigo-400");

        updateRoomDeskNumbers();
        cleanupDragState();
      }
    }
  });

  if (canvas) {
    canvas.appendChild(desk);
    updateRoomDeskNumbers();
  }
}

window.saveRoomLayout = async function() {
  try {
    const nameInput = document.getElementById("room-name-input");
    const name = nameInput ? nameInput.value.trim() : "";
    
    if (!name) {
      alert("Please enter a room name.");
      return;
    }

    const deskElements = Array.from(document.querySelectorAll(".room-desk-item"));
    if (deskElements.length === 0) {
      alert("Add at least one desk before saving.");
      return;
    }

    const deskLayout = deskElements.map((element, index) => ({
      id: index,
      left: Math.round(parseFloat(element.style.left) || 0),
      top: Math.round(parseFloat(element.style.top) || 0),
      rotation: parseInt(element.getAttribute("data-rotation")) || 0
    }));

    const payload = {
      roomName: name,
      deskLayout,
      deleted: false,
      updatedAt: new Date().toISOString()
    };

    if (!window.AppState) window.AppState = {};

    if (window.AppState.editingRoomId) {
      await updateDoc(doc(db, "rooms", window.AppState.editingRoomId), payload);

      const plansSnap = await getDocs(collection(db, "plans"));
      for (const planDoc of plansSnap.docs) {
        const planData = planDoc.data();
        if (planData.roomId === window.AppState.editingRoomId) {
          let updatedStudents = Array.isArray(planData.students) ? [...planData.students] : [];
          updatedStudents = updatedStudents.map(student => {
            if (student.seatIndex !== null && Number(student.seatIndex) >= deskLayout.length) {
              return { ...student, seatIndex: null };
            }
            return student;
          });

          await updateDoc(doc(db, "plans", planDoc.id), {
            students: updatedStudents,
            updatedAt: new Date().toISOString()
          });
        }
      }

      alert("Room layout updated successfully.");
    } else {
      await addDoc(collection(db, "rooms"), payload);
      alert("Room saved successfully.");
    }

    if (typeof showView === "function") showView("view-saved-rooms");
    if (typeof renderSavedRooms === "function") renderSavedRooms();
  } catch (err) {
    console.error("Error saving room:", err);
    alert("Failed to save room: " + err.message);
  }
};

    function getRoomBounds() {
      const desks = window.AppState.roomDesks;

      if (!desks.length) {
        return {
          minX: 0,
          minY: 0,
          maxX: DESK_WIDTH,
          maxY: DESK_HEIGHT,
          width: DESK_WIDTH,
          height: DESK_HEIGHT
        };
      }

      const minX =
        Math.min(...desks.map(desk => Number(desk.left) || 0));

      const minY =
        Math.min(...desks.map(desk => Number(desk.top) || 0));

      const maxX =
        Math.max(
          ...desks.map(
            desk =>
              (Number(desk.left) || 0) +
              DESK_WIDTH
          )
        );

      const maxY =
        Math.max(
          ...desks.map(
            desk =>
              (Number(desk.top) || 0) +
              DESK_HEIGHT
          )
        );

      return {
        minX,
        minY,
        maxX,
        maxY,
        width: Math.max(DESK_WIDTH, maxX - minX),
        height: Math.max(DESK_HEIGHT, maxY - minY)
      };
    }


    function calculateAutoZoom() {
      const canvas = document.getElementById("seating-canvas");
      const bounds = getRoomBounds();
      if (!canvas || !bounds) return 1;

      const totalStageWidth = bounds.width + ROOM_PADDING;
      const totalStageHeight = bounds.height + ROOM_PADDING;

      if (totalStageWidth <= 0 || totalStageHeight <= 0) return 1;

      const scaleX = canvas.clientWidth / totalStageWidth;
      const scaleY = canvas.clientHeight / totalStageHeight;

      const fitScale = Math.min(scaleX, scaleY);
      return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, fitScale));
    }

    /* ------------------------------------------------------------------
       DRAG ENGINE
    ------------------------------------------------------------------ */


    function cleanupDragState() {
      document.body.classList.remove("dragging-active");

      document.querySelectorAll(".drag-source-hidden").forEach(element => {
        element.classList.remove("drag-source-hidden");
      });

      document.querySelectorAll(".drop-highlight").forEach(element => {
        element.classList.remove("drop-highlight");
      });

      document.querySelectorAll(".bench-drop-highlight").forEach(element => {
        element.classList.remove("bench-drop-highlight");
      });

      document.querySelectorAll("[data-dragging='true']").forEach(element => {
        element.removeAttribute("data-dragging");
      });

      document.getElementById("drag-layer").innerHTML = "";

      window.AppState.dragState.active = false;
      window.AppState.dragState.target = null;
    }


    function destroyStudentInteractions() {
      interact(".student-card").unset();
      interact(".desk-slot").unset();
      interact(".dropzone-bench").unset();

      cleanupDragState();
    }


    function setupDragAndDrop() {
      destroyStudentInteractions();

      setupStudentDraggable();
      setupDeskDropzones();
      setupBenchDropzone();
    }


    function setupStudentDraggable() {
      interact(".student-card").draggable({
        inertia: false,
        autoScroll: true,

        listeners: {
          start(event) {
            const target = event.target;
            window.AppState.dragState.active = true;
            window.AppState.dragState.target = target;

            document.body.classList.add("dragging-active");
            target.dataset.dragging = "true";
            target.classList.add("drag-source-hidden");

            document.getElementById("drag-layer").innerHTML = "";

            const dragClone = target.cloneNode(true);
            dragClone.id = "active-drag-clone"; 
            dragClone.classList.remove("drag-source-hidden");
            dragClone.classList.add("drag-ghost");
            
            dragClone.style.pointerEvents = "none";
            
            document.getElementById("drag-layer").appendChild(dragClone);
            
            dragClone.style.left = `${event.clientX}px`;
            dragClone.style.top = `${event.clientY}px`;
          },

          move(event) {
            const target = event.target;
            const zoom = getSeatingZoom() || 1;

            const x = (parseFloat(target.getAttribute("data-x")) || 0) + (event.dx / zoom);
            const y = (parseFloat(target.getAttribute("data-y")) || 0) + (event.dy / zoom);

            target.style.transform = `translate(${x}px, ${y}px)`;
            target.setAttribute("data-x", String(x));
            target.setAttribute("data-y", String(y));

            const dragClone = document.getElementById("active-drag-clone");
            if (dragClone) {
              dragClone.style.left = `${event.clientX}px`;
              dragClone.style.top = `${event.clientY}px`;
            }
          },

          end(event) {
            const target = event.target;
            target.style.transform = "";
            target.removeAttribute("data-x");
            target.removeAttribute("data-y");
            
            document.getElementById("drag-layer").innerHTML = "";
            cleanupDragState();
          },

          cancel(event) {
            if (event && event.target) {
              event.target.style.transform = "";
              event.target.removeAttribute("data-x");
              event.target.removeAttribute("data-y");
            }
            
            document.getElementById("drag-layer").innerHTML = "";
            cleanupDragState();
          }
        }
      });
    }


    function setupDeskDropzones() {
      interact(".desk-slot").dropzone({
        accept: ".student-card",
        overlap: "pointer",

        ondragenter(event) {
          event.target.classList.add("drop-highlight");
        },

        ondragleave(event) {
          event.target.classList.remove("drop-highlight");

    function assignStudentToSeat(studentId, seatIndex) {
      const student = window.AppState.students.find(item => item.id === studentId);

      if (!student) {
        return;
      }

      const previousSeat = student.seatIndex;

      const existingStudent = window.AppState.students.find(
        item => item.id !== studentId && Number(item.seatIndex) === seatIndex
      );

      if (existingStudent) {
        existingStudent.seatIndex = previousSeat === null ? null : previousSeat;
      }

      student.seatIndex = seatIndex;

      cleanupDragState();
      renderSeatingChartWorkspace();
    }


    function unassignStudent(studentId) {
      const student = window.AppState.students.find(item => item.id === studentId);

      cleanupDragState();
      renderSeatingChartWorkspace();

      } else {

      window.AppState.seatingZoom = Math.min(MAX_ZOOM, current + ZOOM_STEP);
      renderCanvasDesks();
    }


    function zoomOutSeating() {
      const current = getSeatingZoom();
      window.AppState.seatingZoom = Math.max(MIN_ZOOM, current - ZOOM_STEP);
      renderCanvasDesks();

    function updateZoomDisplay() {
      const display = document.getElementById("zoom-display");

      if (!display) {
        return;
      }

      const zoom = getSeatingZoom();
      const autoZoom = calculateAutoZoom();

      if (
        window.AppState.seatingZoom === null ||
        window.AppState.seatingZoom === undefined ||
        Math.abs(zoom - autoZoom) < 0.01
      ) {
        display.textContent = "Auto";
        return;
      }

      display.textContent = `${Math.round(zoom * 100)}%`;
    }

    window.exportToPDF = async function() {
      const { jsPDF } = window.jspdf;

      cleanupDragState();

      const bounds = getRoomBounds();
      const totalStageWidth = bounds.width + ROOM_PADDING;
      const totalStageHeight = bounds.height + ROOM_PADDING;

      const originalStage = document.getElementById("room-stage");
      if (!originalStage) return;

      const cloneStage = originalStage.cloneNode(true);
      cloneStage.querySelectorAll("button").forEach(btn => btn.remove());

      cloneStage.querySelectorAll(".desk-slot, .room-desk").forEach(desk => {
        desk.style.overflow = "visible";
        desk.style.display = "flex";
        desk.style.flexDirection = "column";
        desk.style.alignItems = "center";
        desk.style.justifyContent = "center";
      });

      cloneStage.querySelectorAll(".desk-slot > span").forEach(span => {
        span.style.overflow = "visible";
        span.style.lineHeight = "1.3";
        span.style.display = "block";
      });

      cloneStage.style.transform = "none";
      cloneStage.style.left = "0px";
      cloneStage.style.top = "0px";
      cloneStage.style.position = "relative";
      cloneStage.style.width = `${totalStageWidth}px`;
      cloneStage.style.height = `${totalStageHeight}px`;
      cloneStage.style.backgroundColor = "#ffffff";

      const tempContainer = document.createElement("div");
      tempContainer.style.position = "fixed";
      tempContainer.style.left = "-9999px";
      tempContainer.style.top = "-9999px";
      tempContainer.style.width = `${totalStageWidth}px`;
      tempContainer.style.height = `${totalStageHeight}px`;
      tempContainer.style.overflow = "visible";
      tempContainer.appendChild(cloneStage);
      document.body.appendChild(tempContainer);

      try {
        await new Promise(resolve => setTimeout(resolve, 50));

        const canvas = await html2canvas(cloneStage, {
          backgroundColor: "#ffffff",
          scale: 3,
          useCORS: true,
          logging: false
        });

        const imageData = canvas.toDataURL("image/png");
        const pdf = new jsPDF("landscape", "mm", "a4");

        const roomStr = window.AppState.currentRoomName ? ` - Room: ${window.AppState.currentRoomName}` : "";
        pdf.setFontSize(14);
        pdf.setFont("helvetica", "bold");
        pdf.text(
          `${window.AppState.currentClassCode} - ${window.AppState.currentTeacher}${roomStr}`,
          10,
          12
        );

        const pdfWidth = 277;
        const pdfHeight = 180;
        const imageRatio = canvas.width / canvas.height;

        let printWidth = pdfWidth;
        let printHeight = printWidth / imageRatio;

        if (printHeight > pdfHeight) {
          printHeight = pdfHeight;
          printWidth = printHeight * imageRatio;
        }

        pdf.addImage(imageData, "PNG", 10, 18, printWidth, printHeight);

        // Export Notes to Additional Page(s)
        const studentsWithNotes = (window.AppState.students || []).filter(
          s => s.notes && s.notes.trim().length > 0
        );

        if (studentsWithNotes.length > 0) {
          pdf.addPage("a4", "portrait");
          let y = 20;
          const margin = 15;
          const pageWidth = 210;
          const maxTextWidth = pageWidth - (margin * 2);

          pdf.setFont("helvetica", "bold");
          pdf.setFontSize(16);
          pdf.setTextColor(30, 41, 59); // Slate-800
          pdf.text("Student Notes & Comments", margin, y);
          y += 6;

          pdf.setFont("helvetica", "normal");
          pdf.setFontSize(10);
          pdf.setTextColor(100, 116, 139); // Slate-500
          pdf.text(`${window.AppState.currentClassCode} — Teacher: ${window.AppState.currentTeacher}`, margin, y);
          y += 8;

          pdf.setDrawColor(203, 213, 225); // Slate-300
          pdf.setLineWidth(0.5);
          pdf.line(margin, y, pageWidth - margin, y);
          y += 10;

          studentsWithNotes.forEach((student) => {
            const lines = pdf.splitTextToSize(student.notes, maxTextWidth);
            const blockHeight = 6 + (lines.length * 5) + 8;

            if (y + blockHeight > 270) {
              pdf.addPage("a4", "portrait");
              y = 20;
            }

            // Student Name
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(12);
            pdf.setTextColor(15, 23, 42);
            pdf.text(student.name, margin, y);
            y += 6;

            // Student Notes
            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(10);
            pdf.setTextColor(51, 65, 85);
            pdf.text(lines, margin, y);
            y += (lines.length * 5) + 8;
          });
        }

        const filename = `${slugify(window.AppState.currentClassCode)}_seating_plan.pdf`;
        pdf.save(filename);
      } catch (err) {
        console.error("PDF Export failed:", err);
        alert("Failed to export PDF. Please try again.");
      } finally {
        tempContainer.remove();
      }
    };

    async function purgeExpiredTrashItems() {
      const now = Date.now();
      const cutoff = 30 * 24 * 60 * 60 * 1000;

      for (const collectionName of ["rooms", "plans"]) {
        const snapshot = await getDocs(collection(db, collectionName));

        for (const docSnap of snapshot.docs) {
          const data = docSnap.data();

          if (!data.deleted || !data.deletedAt) {
            continue;
          }

          const deletedTime = new Date(data.deletedAt).getTime();

          if (Number.isFinite(deletedTime) && now - deletedTime > cutoff) {
            await deleteDoc(doc(db, collectionName, docSnap.id));
          }
        }
      }
    }

          "bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded ml-auto text-sm",
          () => window.binRoom(docSnap.id),
          "Move to Recycle Bin"
        );

        actions.appendChild(editButton);
        actions.appendChild(copyButton);
        actions.appendChild(binButton);

        card.appendChild(info);
        card.appendChild(actions);

        roomContainer.appendChild(card);
      });
    }

window.clearRoomCanvas = function() {
  const canvas = document.getElementById("room-canvas");
  if (canvas) {
    canvas.innerHTML = "";
  }
};
    async function renderTrashBin() {
      const trashContainer = document.getElementById("trash-list");
      trashContainer.innerHTML = '<span class="text-xs text-slate-400">Loading trash...</span>';

      const roomSnap = await getDocs(collection(db, "rooms"));
      const planSnap = await getDocs(collection(db, "plans"));

      trashContainer.innerHTML = "";

      const trashedRooms = [];
      const trashedPlansByTeacher = {};

      roomSnap.forEach(docSnap => {
        const data = docSnap.data();
        if (data.deleted) {
          trashedRooms.push({ id: docSnap.id, title: data.roomName });
        }
      });

      planSnap.forEach(docSnap => {
        const data = docSnap.data();
        if (data.deleted) {
          const teacher = data.teacherName || "Unassigned";
          if (!trashedPlansByTeacher[teacher]) {
            trashedPlansByTeacher[teacher] = [];
          }
          trashedPlansByTeacher[teacher].push({ id: docSnap.id, title: data.classCode });
        }
      });

      const totalCount = trashedRooms.length + Object.values(trashedPlansByTeacher).flat().length;

      if (totalCount === 0) {
        trashContainer.innerHTML = '<span class="text-xs text-slate-400">Recycle bin is empty.</span>';
        return;
      }

      // Render Plans grouped by Teacher
      for (const [teacher, plans] of Object.entries(trashedPlansByTeacher)) {
        const teacherSection = document.createElement("div");
        teacherSection.className = "space-y-2";
        
        const teacherHeader = document.createElement("h3");
        teacherHeader.className = "font-bold text-sm text-slate-700 border-b pb-1 flex items-center gap-2";
        teacherHeader.innerHTML = `👤 Teacher: <span>${escapeHtml(teacher)}</span>`;
        teacherSection.appendChild(teacherHeader);

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3";

        plans.forEach(plan => {
          const card = document.createElement("div");
          card.className = "bg-white p-3 rounded border flex justify-between items-center text-xs shadow-sm";

          const title = document.createElement("span");
          title.className = "font-medium text-slate-700 truncate mr-2";
          title.textContent = plan.title;

          const actions = document.createElement("div");
          actions.className = "flex items-center gap-1 flex-shrink-0";

          const restoreBtn = createButton(
            "🔄 Restore",
            "bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded font-medium text-xs",
            () => window.restoreItem("plans", plan.id),
            "Restore Plan"
          );

          const deleteBtn = createButton(
            "🗑️ Delete",
            "bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded font-medium text-xs",
            () => window.permanentlyDeleteItem("plans", plan.id),
            "Permanently Delete Plan"
          );

          actions.appendChild(restoreBtn);
          actions.appendChild(deleteBtn);

          card.appendChild(title);
          card.appendChild(actions);
          grid.appendChild(card);
        });

        teacherSection.appendChild(grid);
        trashContainer.appendChild(teacherSection);
      }

      // Render Room Designs
      if (trashedRooms.length > 0) {
        const roomSection = document.createElement("div");
        roomSection.className = "space-y-2 pt-2";

        const roomHeader = document.createElement("h3");
        roomHeader.className = "font-bold text-sm text-slate-700 border-b pb-1 flex items-center gap-2";
        roomHeader.innerHTML = `🏫 Room Designs`;
        roomSection.appendChild(roomHeader);

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3";

        trashedRooms.forEach(room => {
          const card = document.createElement("div");
          card.className = "bg-white p-3 rounded border flex justify-between items-center text-xs shadow-sm";

          const title = document.createElement("span");
          title.className = "font-medium text-slate-700 truncate mr-2";
          title.textContent = room.title;

          const actions = document.createElement("div");
          actions.className = "flex items-center gap-1 flex-shrink-0";

          const restoreBtn = createButton(
            "🔄 Restore",
            "bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded font-medium text-xs",
            () => window.restoreItem("rooms", room.id),
            "Restore Room"
          );

          const deleteBtn = createButton(
            "🗑️ Delete",
            "bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded font-medium text-xs",
            () => window.permanentlyDeleteItem("rooms", room.id),
            "Permanently Delete Room"
          );

          actions.appendChild(restoreBtn);
          actions.appendChild(deleteBtn);

          card.appendChild(title);
          card.appendChild(actions);
          grid.appendChild(card);
        });

        roomSection.appendChild(grid);
        trashContainer.appendChild(roomSection);
      }
    }


    // Initialize Application
    showView("view-home");
  </script>
