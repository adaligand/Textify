<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .container {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      box-sizing: border-box;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    .flex-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button {
        font-size: 20px;
        padding: 10px;
        margin: 5px;
        cursor: pointer;
        border-radius: 10px;
        border: 2px solid #ccc;
        background-color: #f0f0f0;
        transition: all 0.2s ease-in-out;
    }
    button:hover {
      background-color: #A9A9A9;
      transform: translateY(-4px);
    }
    button:active {
      transform: translateY(1px);
      box-shadow: 3px 3px 6px #bebebe, -3px -3px 6px #ffffff;
    }
    .hide {
      display: none;
    }
    .keyboard-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .keyboard-container button {
      font-size: 18px;
      padding: 10px 15px;
      margin: 2px;
      border: none;
      border-radius: 10px;
      background-color: #f0f0f0;
      color: #000000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s, transform 0.2s;
    }
    .keyboard-container button:hover {
      background-color: #A9A9A9;
      transform: translateY(-4px);
    }
    .on-screen-title {
      font-size: 40px;
      font-weight: bold;
      text-align: center;
      color: #333;
    }
    .input-container {
      margin-top: 20px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stats-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-top: 20px;
    }
    #counter, #timer {
      font-weight: bold;
      font-size: 24px;
      color: #555;
      margin-top: 0;
    }
    #textInput {
      border-radius: 12px;
      height: 60px;
      width: 100%;
      max-width: 500px;
      font-size: 40px;
      border: 2px solid #ddd;
      padding: 0 15px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    #textInput:focus {
        border-color: #333;
        outline: none;
    }
    select {
      vertical-align: middle;
      padding: 5px 10px;
      border-radius: 12px;
      height: 50px;
      font-size: 24px;
      border: 2px solid #ddd;
      background-color: #fff;
    }
    #feedback {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      margin-top: 10px;
      width: 100%;
      min-height: 24px;
    }
    .leaderboard-box {
      margin-top: 25px;
      text-align: center;
      border-top: 2px solid #eee;
      padding-top: 20px;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 16px;
      background-color: #fafafa;
      color: #333;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .leaderboard-table th {
      background-color: #f1f3f5;
      color: #333;
      font-weight: bold;
    }
    .leaderboard-table tr:last-child td {
      border-bottom: none;
    }
    .leaderboard-table tr.highlight-row {
      background-color: #d4edda !important;
      color: #155724 !important;
      font-weight: bold;
    }
    .btn {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      background-color: #f9f9f9;
      border: 2px solid #ccc;
      color: #000000;
      border-radius: 10px;
      cursor: pointer;
      margin: 20px 5px 5px 5px;
      transition: transform 0.2s, background-color 0.2s;
      font-family: Arial, sans-serif;
    }
    .btn:hover {
      background-color: #e0e0e0;
      transform: translateY(-2px);
    }
    #googleBtnContainer {
      display: flex;
      justify-content: center;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="on-screen-title" id="gameMainTitle">Type what you hear</div>
    <div class="stats-container" id="statsWrapper">
        <div id="counter"></div>
        <div id="timer">0m 0s</div>
    </div>
    <div id="exerciseOutput" class="hide"></div>
    <div class="input-container flex-container" id="textInputWrapper">
      <input type="text" id="textInput" class="hide" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="handleKeyPress(event)">
    </div>
    <div class="input-container flex-container" id="feedbackWrapper">
        <div id="feedback" class="hide input-feedback"></div>
    </div>
    <div class="input-container flex-container">
        <button id="resetButton" class="hide" onclick="resetExercise()">Reset</button>
    </div>
    <div class="input-container flex-container" id="controlButtonsWrapper">
      <select id="languageSelect" onchange="updateKeyboard()">
        <option value="french">French</option>
        <option value="german">German</option>
        <option value="spanish">Spanish</option>
      </select>
      <button id="playAudioButton" onclick="playAudio()">▶️ Play Audio</button>
      <button id="nextButton" class="hide" onclick="nextPhrase()">Next</button>
      <button id="checkButton" class="hide" onclick="checkAnswer()">Check</button>
    </div>
    <div class="keyboard-container" id="virtualKeyboardWrapper"></div>
    <div id="leaderboardSection" class="leaderboard-box" style="display:none;">
        <h3 style="margin: 5px 0;">🏆 Top 5 Leaderboard 🏆</h3>
        <div id="leaderboardStatus"></div>
        <div id="googleBtnContainer"></div>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Accuracy</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
        <button id="restartBtn" class="btn" onclick="resetExercise()">🔄 Start Again</button>
    </div>
  </div>
<script>
    let currentPhraseIndex = 0;
    let exercisePhrases = [];
    let allPhrases = [];
    let totalPhrases = 10;
    let totalAttempts = 0;
    const LEADERBOARD_API_URL = "https://script.google.com/macros/s/AKfycbzasoQX0sQoLfpK9Uoup_d-IvuEaAKoJvHi79hZKf5qsVei8XP_CxvE5IQcdlrxE0DfHA/exec";
    const GAME_NAME = "Listen";
    let timerInterval;
    let startTime;
    const GOOGLE_CLIENT_ID = "158411898898-17274f13igjs13a5ja3g31vhnp0c4e0u.apps.googleusercontent.com";
    let currentGoogleUser = null;
    let googleInitialised = false;
    let pendingTimeMinutes = null;
    let pendingAccuracy = null;
    const params = new URLSearchParams(window.location.search);
    const sheetUrl = params.get('sheet');
    function getSpreadsheetId(url) {
        if (!url) return null;
        if (url.includes('/d/e/')) {
            const matches = url.match(/\/d\/e\/([a-zA-Z0-9-_]+)/);
            return matches ? matches[1] : url;
        }
        const matches = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        return matches ? matches[1] : url;
    }
    const topicId = sheetUrl ? getSpreadsheetId(sheetUrl) : null;
    if (!sheetUrl) {
        document.getElementById('gameMainTitle').textContent = "⚠️ No CSV URL provided.";
    } else {
        document.getElementById('gameMainTitle').textContent = "Loading vocabulary...";
        Papa.parse(sheetUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                if (results.errors.length) {
                    document.getElementById('gameMainTitle').textContent = "⚠️ Error parsing CSV.";
                    return;
                }
                results.data.forEach(row => {
                    const word = row["French"] || row["English"] || "";
                    if (word.trim()) allPhrases.push(word.trim());
                });
                if (allPhrases.length === 0) {
                    document.getElementById('gameMainTitle').textContent = "⚠️ No data found in sheet.";
                    return;
                }
                document.getElementById('gameMainTitle').textContent = "Type what you hear";
                initialize();
            }
        });
    }
    function normalizeApostrophes(text) {
        if (typeof text !== 'string') return '';
        return text.replace(/’/g, "'");
    }
    function initialize() {
        totalAttempts = 0;
        generateExercisePhrases();
        startTimer();
        updateCounter();
        generateExercise();
        updateKeyboard();
        document.getElementById('textInput').focus();
    }
    function generateKeyboard(language) {
        const keyboardContainer = document.querySelector('.keyboard-container');
        keyboardContainer.innerHTML = '';
        let specialChars = [];
        switch (language) {
          case 'french': specialChars = ['à', 'â', 'ä', 'é', 'è', 'ê', 'ë', 'î', 'ï', 'ô', 'ö', 'ù', 'ü', 'û', 'ç']; break;
          case 'german': specialChars = ['ä', 'ö', 'ü', 'ß']; break;
          case 'spanish': specialChars = ['á', 'é', 'í', 'ó', 'ú', 'ñ']; break;
        }
        specialChars.forEach(function (char) {
            const button = document.createElement('button');
            button.textContent = char;
            button.className = 'keyboard-button';
            button.setAttribute('onclick', `insertLetter('${char}')`);
            keyboardContainer.appendChild(button);
        });
    }
    function insertLetter(letter) {
        const input = document.getElementById('textInput');
        if (input.readOnly) return;
        const start = input.selectionStart;
        const end = input.selectionEnd;
        input.value = input.value.substring(0, start) + letter + input.value.substring(end);
        input.selectionStart = input.selectionEnd = start + 1;
        input.focus();
    }
    function generateExercisePhrases() {
        const shuffledPhrases = [...allPhrases].sort(() => Math.random() - 0.5);
        totalPhrases = Math.min(10, allPhrases.length);
        exercisePhrases = shuffledPhrases.slice(0, totalPhrases);
    }
    function generateExercise() {
        const textInput = document.getElementById('textInput');
        textInput.value = '';
        textInput.readOnly = false;
        textInput.classList.remove('hide');
        document.getElementById('checkButton').classList.remove('hide');
        document.getElementById('nextButton').classList.add('hide');
        document.getElementById('feedback').classList.add('hide');
        textInput.focus();
        playAudio();
    }
    function checkAnswer() {
        const userInput = document.getElementById('textInput').value.trim();
        const correctAnswer = exercisePhrases[currentPhraseIndex];
        const feedbackEl = document.getElementById('feedback');
        const textInput = document.getElementById('textInput');
        if (!userInput) return;
        totalAttempts++;
        const normalizedUserInput = normalizeApostrophes(userInput).toLowerCase();
        const normalizedCorrectAnswer = normalizeApostrophes(correctAnswer).toLowerCase();
        if (normalizedUserInput === normalizedCorrectAnswer) {
            feedbackEl.textContent = 'Correct!';
            feedbackEl.style.color = 'green';
            textInput.readOnly = true;
            document.getElementById('checkButton').classList.add('hide');
            if (currentPhraseIndex < totalPhrases - 1) {
                document.getElementById('nextButton').classList.remove('hide');
                textInput.focus();
            } else {
                stopTimer();
                const totalSeconds = Math.round((new Date().getTime() - startTime) / 1000);
                const displayMins = Math.floor(totalSeconds / 60);
                const displaySecs = totalSeconds % 60;
                const clockFormattedTime = parseFloat(`${displayMins}.${displaySecs < 10 ? '0' : ''}${displaySecs}`);
                const formattedTimeText = `${displayMins}m ${displaySecs}s`;
                const accuracy = Math.min(100, Math.round((totalPhrases / totalAttempts) * 100));
                document.getElementById('gameMainTitle').textContent = `🎉 Score: ${accuracy}% Accuracy in ${formattedTimeText}!`;
                document.getElementById('statsWrapper').style.display = "none";
                document.getElementById('textInputWrapper').style.display = "none";
                document.getElementById('feedbackWrapper').style.display = "none";
                document.getElementById('controlButtonsWrapper').style.display = "none";
                document.getElementById('virtualKeyboardWrapper').style.display = "none";
                checkQualificationAndLoad(clockFormattedTime, accuracy);
            }
        } else {
            feedbackEl.style.color = 'darkorange';
            let correctPrefixLength = 0;
            for (let i = 0; i < normalizedUserInput.length; i++) {
                if (i < normalizedCorrectAnswer.length && normalizedUserInput[i] === normalizedCorrectAnswer[i]) {
                    correctPrefixLength++;
                } else {
                    break;
                }
            }
            const hint = correctAnswer.substring(0, correctPrefixLength + 1);
            feedbackEl.textContent = `Not quite! Hint: ${hint}...`;
        }
        feedbackEl.classList.remove('hide');
    }
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            if (!document.getElementById('checkButton').classList.contains('hide')) {
                checkAnswer();
            } else if (!document.getElementById('nextButton').classList.contains('hide')) {
                nextPhrase();
            } else if (!document.getElementById('resetButton').classList.contains('hide')) {
                resetExercise();
            }
        }
    }
    function nextPhrase() {
        currentPhraseIndex++;
        if (currentPhraseIndex < totalPhrases) {
            generateExercise();
            updateCounter();
        }
    }
    function resetExercise() {
        currentPhraseIndex = 0;
        totalAttempts = 0;
        currentGoogleUser = null;
        pendingTimeMinutes = null;
        pendingAccuracy = null;
        document.getElementById('leaderboardSection').style.display = "none";
        document.getElementById('leaderboardBody').innerHTML = "";
        document.getElementById('googleBtnContainer').innerHTML = "";
        document.getElementById('leaderboardStatus').innerHTML = "";
        document.getElementById('statsWrapper').style.display = "flex";
        document.getElementById('textInputWrapper').style.display = "flex";
        document.getElementById('feedbackWrapper').style.display = "flex";
        document.getElementById('controlButtonsWrapper').style.display = "flex";
        document.getElementById('virtualKeyboardWrapper').style.display = "flex";
        document.getElementById('gameMainTitle').textContent = "Type what you hear";
        document.getElementById('resetButton').classList.add('hide');
        generateExercisePhrases();
        generateExercise();
        updateCounter();
        startTimer();
    }
    function updateCounter() {
        document.getElementById('counter').textContent = `${currentPhraseIndex + 1} / ${totalPhrases}`;
    }
    function startTimer() {
        stopTimer();
        startTime = new Date().getTime();
        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
    }
    function stopTimer() {
        clearInterval(timerInterval);
    }
    function updateTimer() {
        const elapsedTime = new Date().getTime() - startTime;
        const minutes = Math.floor(elapsedTime / (1000 * 60));
        const seconds = Math.floor((elapsedTime % (1000 * 60)) / 1000);
        document.getElementById("timer").textContent = `${minutes}m ${seconds}s`;
    }
    function playAudio() {
        if (!exercisePhrases[currentPhraseIndex]) return;
        const speechSynthesis = window.speechSynthesis;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(exercisePhrases[currentPhraseIndex]);
        const selectedLanguage = document.getElementById('languageSelect').value;
        switch (selectedLanguage) {
            case 'french': utterance.lang = 'fr-FR'; break;
            case 'german': utterance.lang = 'de-DE'; break;
            case 'spanish': utterance.lang = 'es-ES'; break;
            default: utterance.lang = 'en-US'; break;
        }
        utterance.rate = 0.7;
        speechSynthesis.speak(utterance);
    }
    function updateKeyboard() {
        generateKeyboard(document.getElementById('languageSelect').value);
    }
    function formatTimeDisplay(minutesVal) {
        if (minutesVal === undefined || minutesVal === null || isNaN(minutesVal)) return "";
        const num = parseFloat(minutesVal);
        const mins = Math.floor(num);
        const secs = Math.round((num - mins) * 100);
        return `${mins}m ${secs}s`;
    }
    function checkQualificationAndLoad(timeMinutes, accuracy) {
        const tbody = document.getElementById('leaderboardBody');
        const section = document.getElementById('leaderboardSection');
        tbody.innerHTML = '<tr><td colspan="4">Loading board profiles... ⏳</td></tr>';
        section.style.display = "block";
        fetch(`${LEADERBOARD_API_URL}?game=${encodeURIComponent(GAME_NAME)}&topicId=${encodeURIComponent(topicId)}`)
        .then(res => res.json())
        .then(data => {
            let tempBoard = [...data];
            let newAttempt = {
                name: "___TEMP_PLAYER___",
                time: parseFloat(timeMinutes),
                accuracy: parseFloat(accuracy)
            };
            tempBoard.push(newAttempt);
            tempBoard.sort((a, b) => b.accuracy - a.accuracy || a.time - b.time);
            let playerRank = tempBoard.findIndex(e =>
                e.name === "___TEMP_PLAYER___" &&
                e.time === parseFloat(timeMinutes) &&
                e.accuracy === parseFloat(accuracy)
            ) + 1;
            if (playerRank <= 5) {
                pendingTimeMinutes = parseFloat(timeMinutes);
                pendingAccuracy = parseFloat(accuracy);
                tbody.innerHTML = '<tr><td colspan="4">🏆 You made the Top 5! Please sign in below to save your score.</td></tr>';
                startGoogleAuthentication();
            } else {
                renderLeaderboardRows(data, null, null, null);
            }
        })
        .catch(err => {
            console.error("Leaderboard loading failure:", err);
            tbody.innerHTML = '<tr><td colspan="4">Error connecting to records database.</td></tr>';
        });
    }
    function startGoogleAuthentication() {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
            setTimeout(startGoogleAuthentication, 200);
            return;
        }
        if (!googleInitialised) {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredential,
                auto_select: false,
                use_fedcm_for_prompt: false
            });
            googleInitialised = true;
        }
        const btnContainer = document.getElementById('googleBtnContainer');
        btnContainer.innerHTML = '';
        google.accounts.id.renderButton(
            btnContainer,
            {
                theme: "outline",
                size: "large",
                text: "continue_with"
            }
        );
        google.accounts.id.prompt(function(notification) {
            if (notification.isNotDisplayed()) {
                console.warn("One Tap Prompt not displayed:", notification.getNotDisplayedReason());
            }
            if (notification.isSkippedMoment()) {
                console.warn("One Tap Prompt skipped:", notification.getSkippedReason());
            }
        });
    }
    function handleGoogleCredential(response) {
        try {
            const payload = parseJwt(response.credential);
            currentGoogleUser = {
                name: payload.name || "Google User",
                email: payload.email || "",
                googleId: payload.sub || "",
                picture: payload.picture || ""
            };
            document.getElementById('googleBtnContainer').innerHTML = "";
            submitLeaderboardScore();
        } catch (error) {
            console.error("Could not process Google credential:", error);
            document.getElementById('leaderboardStatus').innerHTML = '<h4 style="color:#e74c3c;">Google sign-in could not be completed. Your score was not saved.</h4>';
        }
    }
    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
    }
    function submitLeaderboardScore() {
        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = '<tr><td colspan="4">Saving your spot... ⏳</td></tr>';
        fetch(LEADERBOARD_API_URL, {
            method: "POST",
            body: JSON.stringify({
                topicId: topicId,
                game: GAME_NAME,
                name: currentGoogleUser.name,
                email: currentGoogleUser.email,
                googleId: currentGoogleUser.googleId,
                time: parseFloat(pendingTimeMinutes),
                accuracy: parseFloat(pendingAccuracy)
            })
        })
        .then(res => res.json())
        .then(updatedData => {
            renderLeaderboardRows(updatedData, currentGoogleUser.name, pendingTimeMinutes, pendingAccuracy);
        })
        .catch(err => {
            console.error("Leaderboard save error:", err);
            tbody.innerHTML = '<tr><td colspan="4">Error saving your leaderboard score.</td></tr>';
        });
    }
    function renderLeaderboardRows(data, highlightName, highlightTime, highlightAcc) {
        const tbody = document.getElementById('leaderboardBody');
        const statusDiv = document.getElementById('leaderboardStatus');
        if (!tbody) return;
        tbody.innerHTML = "";
        let rankHeader = document.getElementById('personalRankTitle');
        if (!rankHeader && statusDiv) {
            rankHeader = document.createElement('h4');
            rankHeader.id = 'personalRankTitle';
            rankHeader.style.fontSize = '18px';
            rankHeader.style.margin = '8px 0';
            statusDiv.appendChild(rankHeader);
        }
        if (highlightName) {
            let studentRank = data.findIndex(entry =>
                entry.name === highlightName &&
                entry.time === parseFloat(highlightTime) &&
                entry.accuracy === parseFloat(highlightAcc)
            ) + 1;
            if (rankHeader) {
                rankHeader.style.color = '#2ecc71';
                rankHeader.textContent = studentRank > 0 ? `🎯 Final Status: Rank #${studentRank}!` : `🎯 Score Posted Successfully!`;
            }
        } else {
            if (rankHeader) {
                rankHeader.style.color = '#e67e22';
                rankHeader.textContent = `🏁 Good effort! Try again to break into the Top 5.`;
            }
        }
        const medals = ['🥇 1', '🥈 2', '🥉 3'];
        data.forEach((entry, index) => {
            const tr = document.createElement('tr');
            const accVal = entry.accuracy !== undefined ? entry.accuracy : 100;
            const timeFormatted = formatTimeDisplay(entry.time);
            const rankDisplay = medals[index] || `#${index + 1}`;
            if (highlightName &&
                entry.name === highlightName &&
                entry.time === parseFloat(highlightTime) &&
                entry.accuracy === parseFloat(highlightAcc)) {
                tr.className = 'highlight-row';
            }
            const rankCell = document.createElement('td');
            rankCell.innerHTML = `<strong>${rankDisplay}</strong>`;
            const nameCell = document.createElement('td');
            const nameStrong = document.createElement('strong');
            nameStrong.textContent = entry.name || "Unknown";
            nameCell.appendChild(nameStrong);
            const accCell = document.createElement('td');
            accCell.textContent = `${accVal}%`;
            const timeCell = document.createElement('td');
            timeCell.textContent = timeFormatted;
            tr.appendChild(rankCell);
            tr.appendChild(nameCell);
            tr.appendChild(accCell);
            tr.appendChild(timeCell);
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
