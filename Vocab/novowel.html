<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>No vowels</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    .container {
        width: 100%;
        max-width: 800px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        box-sizing: border-box;
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    #game {
        display: none;
    }

    #loading {
        text-align: center;
        padding: 30px;
    }

    .word-card {
        margin: 20px 0;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafafa;
    }

    .english {
        font-size: 18px;
        margin-bottom: 10px;
    }

    .hidden-word {
        font-size: 26px;
        letter-spacing: 3px;
        margin-bottom: 15px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 20px;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 6px;
    }

    input:focus {
        border-color: #4285f4;
        outline: none;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin: 5px;
    }

    #startButton {
        background: #4285f4;
        color: white;
    }

    #nextButton {
        background: #34a853;
        color: white;
    }

    #restartButton {
        background: #fbbc05;
        color: black;
    }

    .button-container {
        text-align: center;
        margin-top: 20px;
    }

    #results {
        display: none;
        text-align: center;
    }

    #leaderboard {
        margin-top: 25px;
    }

    #leaderboard table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    #leaderboard th,
    #leaderboard td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }

    #leaderboard th {
        background: #f0f0f0;
    }

    .message {
        padding: 15px;
        margin: 15px 0;
        border-radius: 8px;
        text-align: center;
    }

    .success {
        background: #e8f5e9;
    }

    .info {
        background: #e3f2fd;
    }

    .error {
        background: #ffebee;
    }

    #googleStatus {
        display: none;
    }

    .special-characters {
        text-align: center;
        margin-top: 10px;
    }

    .special-characters button {
        padding: 6px 10px;
        margin: 2px;
        background: #eee;
    }
</style>
</head>

<body>

<div class="container">

    <h1>No vowels</h1>

    <div id="loading">
        Loading vocabulary...
    </div>

    <div id="game">

        <div id="progress"></div>

        <div id="wordContainer"></div>

        <div class="button-container">
            <button id="nextButton" onclick="nextWord()" style="display:none;">
                Next
            </button>
        </div>

    </div>

    <div id="results">

        <h2>Game complete!</h2>

        <div id="resultText"></div>

        <div id="leaderboardMessage"></div>

        <div id="leaderboard"></div>

        <div class="button-container">
            <button id="restartButton" onclick="location.reload()">
                Play again
            </button>
        </div>

    </div>

    <!-- Invisible status area.
         This is deliberately not displayed to students during normal play. -->
    <div id="googleStatus"></div>

</div>


<script>

/* ============================================================
   SETTINGS
   ============================================================ */

const LEADERBOARD_API =
    "https://script.google.com/macros/s/AKfycbzasoQX0sQoLfpK9Uoup_d-IvuEaAJoKjHi79hZKf5qsVei8XP_CxvE5IQcdlrxE0DfHA/exec";

const GAME_NAME = "No Vowels";

const GOOGLE_CLIENT_ID =
    "158411898898-17274f13igjs13a5ja3g31vhnp0c4e0u.apps.googleusercontent.com";


/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

let vocabList = [];
let exerciseWords = [];

let currentWordIndex = 0;

let totalVowelsCount = 0;
let totalInputAttempts = 0;

let startTime = null;
let endTime = null;

let currentUser = null;

let googleInitialised = false;
let googleLoginStarted = false;

let pendingTimeMinutes = null;
let pendingAccuracy = null;


/* ============================================================
   GET SHEET URL
   ============================================================ */

const params = new URLSearchParams(window.location.search);
const sheetUrl = params.get("sheet");


/* ============================================================
   GET SPREADSHEET ID
   ============================================================ */

function getSpreadsheetId(url) {

    if (!url) return "";

    const match = url.match(
        /\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/
    );

    if (match) {
        return match[1];
    }

    return "";
}


/* ============================================================
   LOAD VOCABULARY
   ============================================================ */

function loadVocabulary() {

    if (!sheetUrl) {

        document.getElementById("loading").innerHTML =
            "<div class='message error'>" +
            "No vocabulary sheet was specified." +
            "</div>";

        return;
    }

    Papa.parse(sheetUrl, {

        download: true,

        header: true,

        skipEmptyLines: true,

        complete: function(results) {

            vocabList = results.data.filter(row => {

                return row.French &&
                       row.English;

            });

            if (vocabList.length === 0) {

                document.getElementById("loading").innerHTML =
                    "<div class='message error'>" +
                    "No vocabulary was found." +
                    "</div>";

                return;
            }

            startGame();
        },

        error: function(error) {

            console.error(error);

            document.getElementById("loading").innerHTML =
                "<div class='message error'>" +
                "Unable to load the vocabulary." +
                "</div>";
        }
    });
}


/* ============================================================
   START GAME
   ============================================================ */

function startGame() {

    exerciseWords = [...vocabList]
        .sort(() => Math.random() - 0.5)
        .slice(0, 10);

    currentWordIndex = 0;

    totalVowelsCount = 0;
    totalInputAttempts = 0;

    startTime = Date.now();

    document.getElementById("loading").style.display = "none";

    document.getElementById("game").style.display = "block";

    showWord();
}


/* ============================================================
   COUNT VOWELS
   ============================================================ */

function countVowels(word) {

    if (!word) return 0;

    const vowels =
        "aeiouyàâäéèêëîïôöùûüÿAEIOUYÀÂÄÉÈÊËÎÏÔÖÙÛÜŸ";

    let count = 0;

    for (const char of word) {

        if (vowels.includes(char)) {
            count++;
        }
    }

    return count;
}


/* ============================================================
   REMOVE VOWELS
   ============================================================ */

function hideVowels(word) {

    if (!word) return "";

    const vowels =
        "aeiouyàâäéèêëîïôöùûüÿAEIOUYÀÂÄÉÈËÎÏÔÖÙÛÜŸ";

    let output = "";

    for (const char of word) {

        if (vowels.includes(char)) {
            output += "_";
        } else {
            output += char;
        }
    }

    return output;
}


/* ============================================================
   SHOW WORD
   ============================================================ */

function showWord() {

    if (currentWordIndex >= exerciseWords.length) {

        finishGame();

        return;
    }

    const item = exerciseWords[currentWordIndex];

    totalVowelsCount += countVowels(item.French);

    document.getElementById("progress").innerHTML =
        "<strong>" +
        (currentWordIndex + 1) +
        " / " +
        exerciseWords.length +
        "</strong>";

    const container =
        document.getElementById("wordContainer");

    container.innerHTML = "";

    const card = document.createElement("div");

    card.className = "word-card";

    const english = document.createElement("div");

    english.className = "english";

    english.textContent =
        "English: " + item.English;

    card.appendChild(english);


    const hiddenWord = document.createElement("div");

    hiddenWord.className = "hidden-word";

    hiddenWord.textContent =
        hideVowels(item.French);

    card.appendChild(hiddenWord);


    const input = document.createElement("input");

    input.type = "text";

    input.autocomplete = "off";

    input.autocapitalize = "off";

    input.spellcheck = false;

    input.placeholder =
        "Type the missing vowels";

    card.appendChild(input);


    const specialCharacters =
        document.createElement("div");

    specialCharacters.className =
        "special-characters";

    const language =
        detectLanguage(item.French);

    let chars = [];

    if (language === "French") {

        chars = [
            "à", "â", "ä",
            "é", "è", "ê", "ë",
            "î", "ï",
            "ô", "ö",
            "ù", "û", "ü",
            "ÿ",
            "ç"
        ];

    } else if (language === "German") {

        chars = [
            "ä", "ö", "ü", "ß"
        ];

    } else {

        chars = [
            "á", "é", "í", "ó", "ú",
            "ü", "ñ"
        ];
    }


    chars.forEach(char => {

        const button =
            document.createElement("button");

        button.type = "button";

        button.textContent = char;

        button.onclick = function() {

            input.value += char;

            input.focus();

            input.dispatchEvent(
                new Event("input")
            );
        };

        specialCharacters.appendChild(button);
    });

    card.appendChild(specialCharacters);

    container.appendChild(card);


    input.addEventListener(
        "input",
        function() {

            if (input.value.trim() !== "") {

                totalInputAttempts++;
            }

            checkAnswer(input, item.French);
        }
    );


    input.focus();
}


/* ============================================================
   DETECT LANGUAGE
   ============================================================ */

function detectLanguage(word) {

    if (!word) return "French";

    if (
        /[àâäçéèêëîïôöùûüÿ]/i.test(word)
    ) {
        return "French";
    }

    if (
        /[äöüß]/i.test(word)
    ) {
        return "German";
    }

    if (
        /[áíóúñ]/i.test(word)
    ) {
        return "Spanish";
    }

    return "French";
}


/* ============================================================
   CHECK ANSWER
   ============================================================ */

function checkAnswer(input, correctAnswer) {

    const typed =
        input.value.trim().toLowerCase();

    const correct =
        correctAnswer.trim().toLowerCase();

    if (typed === correct) {

        input.disabled = true;

        input.style.borderColor = "#34a853";

        document.getElementById("nextButton")
            .style.display = "inline-block";
    }
}


/* ============================================================
   NEXT WORD
   ============================================================ */

function nextWord() {

    currentWordIndex++;

    document.getElementById("nextButton")
        .style.display = "none";

    showWord();
}


/* ============================================================
   FINISH GAME
   ============================================================ */

function finishGame() {

    endTime = Date.now();

    const elapsedSeconds =
        (endTime - startTime) / 1000;

    const minutes =
        Math.floor(elapsedSeconds / 60);

    const seconds =
        Math.floor(elapsedSeconds % 60);

    /*
       Keep your existing leaderboard time format:
       minutes.seconds

       Example:
       1 minute 05 seconds = 1.05
    */

    const timeMinutes =
        Number(
            minutes + "." +
            String(seconds).padStart(2, "0")
        );

    let accuracy = 0;

    if (totalVowelsCount > 0) {

        accuracy =
            (totalVowelsCount /
            Math.max(
                totalVowelsCount,
                totalInputAttempts
            )) * 100;
    }

    accuracy =
        Math.round(accuracy * 100) / 100;


    document.getElementById("game")
        .style.display = "none";

    document.getElementById("results")
        .style.display = "block";


    document.getElementById("resultText").innerHTML =
        "<p><strong>Time:</strong> " +
        formatTimeDisplay(timeMinutes) +
        "</p>" +

        "<p><strong>Accuracy:</strong> " +
        accuracy +
        "%</p>";


    /*
       IMPORTANT:
       Google authentication is NOT started here.

       First check whether the score qualifies.
    */

    checkQualificationAndLoad(
        timeMinutes,
        accuracy
    );
}


/* ============================================================
   FORMAT TIME
   ============================================================ */

function formatTimeDisplay(time) {

    const str = String(time);

    const parts = str.split(".");

    const minutes =
        parseInt(parts[0], 10) || 0;

    const seconds =
        parts[1]
            ? parseInt(
                parts[1].padEnd(2, "0"),
                10
              )
            : 0;

    return (
        minutes +
        "m " +
        seconds +
        "s"
    );
}


/* ============================================================
   CHECK LEADERBOARD
   ============================================================ */

function checkQualificationAndLoad(
    timeMinutes,
    accuracy
) {

    const topicId =
        getSpreadsheetId(sheetUrl);


    document.getElementById("leaderboardMessage")
        .innerHTML =
        "<div class='message info'>" +
        "Checking leaderboard..." +
        "</div>";


    fetch(
        LEADERBOARD_API +
        "?game=" +
        encodeURIComponent(GAME_NAME) +
        "&topicId=" +
        encodeURIComponent(topicId)
    )

    .then(response => response.json())

    .then(data => {

        console.log(
            "Leaderboard response:",
            data
        );


        /*
           Get existing leaderboard.

           Your Apps Script may return the array
           directly or inside a property.
        */

        let leaderboard = [];

        if (Array.isArray(data)) {

            leaderboard = data;

        } else if (
            Array.isArray(data.leaderboard)
        ) {

            leaderboard = data.leaderboard;
        }


        /*
           Sort:

           1. Highest accuracy
           2. Fastest time
        */

        leaderboard.sort(
            (a, b) => {

                const accuracyA =
                    Number(a.accuracy) || 0;

                const accuracyB =
                    Number(b.accuracy) || 0;

                const timeA =
                    Number(a.time) || Infinity;

                const timeB =
                    Number(b.time) || Infinity;


                if (
                    accuracyA !==
                    accuracyB
                ) {

                    return accuracyB -
                           accuracyA;
                }


                return timeA - timeB;
            }
        );


        /*
           Determine whether this score
           would make the Top 5.
        */

        const candidate = {

            accuracy: accuracy,

            time: timeMinutes
        };


        const combined =
            [...leaderboard, candidate]
            .sort(
                (a, b) => {

                    const accuracyA =
                        Number(a.accuracy) || 0;

                    const accuracyB =
                        Number(b.accuracy) || 0;

                    const timeA =
                        Number(a.time) || Infinity;

                    const timeB =
                        Number(b.time) || Infinity;


                    if (
                        accuracyA !==
                        accuracyB
                    ) {

                        return accuracyB -
                               accuracyA;
                    }


                    return timeA - timeB;
                }
            );


        const candidateIndex =
            combined.indexOf(candidate);


        const qualifies =
            candidateIndex < 5;


        if (qualifies) {

            /*
               ONLY NOW do we ask Google
               to identify the student.
            */

            pendingTimeMinutes =
                timeMinutes;

            pendingAccuracy =
                accuracy;


            document.getElementById(
                "leaderboardMessage"
            ).innerHTML =
                "<div class='message success'>" +
                "🏆 You've made the leaderboard! " +
                "Sign in with Google to save your score." +
                "</div>";


            startGoogleLogin();

        } else {

            /*
               Not Top 5.

               Google is never called.
            */

            document.getElementById(
                "leaderboardMessage"
            ).innerHTML =
                "<div class='message info'>" +
                "You didn't make the current Top 5 this time." +
                "</div>";


            displayLeaderboard(
                leaderboard
            );
        }

    })

    .catch(error => {

        console.error(
            "Leaderboard error:",
            error
        );


        document.getElementById(
            "leaderboardMessage"
        ).innerHTML =
            "<div class='message error'>" +
            "Unable to check the leaderboard." +
            "</div>";
    });
}


/* ============================================================
   START GOOGLE LOGIN
   ============================================================ */

function startGoogleLogin() {

    /*
       Prevent duplicate calls.
    */

    if (googleLoginStarted) return;

    googleLoginStarted = true;


    /*
       Google may not have finished loading
       when the student reaches the leaderboard.

       Wait until GIS is available.
    */

    waitForGoogle();
}


/* ============================================================
   WAIT FOR GOOGLE
   ============================================================ */

function waitForGoogle() {

    if (
        window.google &&
        window.google.accounts &&
        window.google.accounts.id
    ) {

        initialiseGoogleAndPrompt();

        return;
    }


    setTimeout(
        waitForGoogle,
        200
    );
}


/* ============================================================
   INITIALISE GOOGLE
   ============================================================ */

function initialiseGoogleAndPrompt() {

    if (!googleInitialised) {

        google.accounts.id.initialize({

            client_id:
                GOOGLE_CLIENT_ID,

            callback:
                handleCredentialResponse,

            auto_select:
                true,

            use_fedcm_for_prompt:
                true
        });

        googleInitialised = true;
    }


    /*
       This is the ONLY place in the game
       where Google authentication is requested.
    */

    google.accounts.id.prompt(
        function(notification) {

            console.log(
                "Google authentication:",
                notification.getNotDisplayedReason
                    ? notification.getNotDisplayedReason()
                    : "",
                notification.getSkippedReason
                    ? notification.getSkippedReason()
                    : ""
            );
        }
    );
}


/* ============================================================
   GOOGLE CREDENTIAL RECEIVED
   ============================================================ */

function handleCredentialResponse(
    response
) {

    try {

        const payload =
            parseJwt(response.credential);


        currentUser = {

            name:
                payload.name || "",

            email:
                payload.email || "",

            googleId:
                payload.sub || "",

            picture:
                payload.picture || "",

            hostedDomain:
                payload.hd || "",

            credential:
                response.credential
        };


        console.log(
            "Google account identified:",
            currentUser.name
        );


        /*
           Now submit the score.
        */

        submitLeaderboardScore(
            pendingTimeMinutes,
            pendingAccuracy
        );


    } catch (error) {

        console.error(
            "Google credential error:",
            error
        );


        document.getElementById(
            "leaderboardMessage"
        ).innerHTML =
            "<div class='message error'>" +
            "Google sign-in could not be completed. " +
            "Your score has not been added to the leaderboard." +
            "</div>";
    }
}


/* ============================================================
   DECODE GOOGLE JWT
   ============================================================ */

function parseJwt(token) {

    const base64Url =
        token.split(".")[1];

    const base64 =
        base64Url
            .replace(/-/g, "+")
            .replace(/_/g, "/");

    const jsonPayload =
        decodeURIComponent(
            atob(base64)
                .split("")
                .map(
                    c =>
                        "%" +
                        (
                            "00" +
                            c.charCodeAt(0)
                                .toString(16)
                        ).slice(-2)
                )
                .join("")
        );

    return JSON.parse(jsonPayload);
}


/* ============================================================
   SUBMIT LEADERBOARD SCORE
   ============================================================ */

function submitLeaderboardScore(
    timeMinutes,
    accuracy
) {

    const topicId =
        getSpreadsheetId(sheetUrl);


    if (!currentUser) {

        document.getElementById(
            "leaderboardMessage"
        ).innerHTML =
            "<div class='message error'>" +
            "No Google account was identified. " +
            "Your score could not be saved." +
            "</div>";

        return;
    }


    const scoreData = {

        topicId:
            topicId,

        game:
            GAME_NAME,

        name:
            currentUser.name,

        email:
            currentUser.email,

        googleId:
            currentUser.googleId,

        time:
            timeMinutes,

        accuracy:
            accuracy
    };


    console.log(
        "Submitting leaderboard score:",
        scoreData
    );


    document.getElementById(
        "leaderboardMessage"
    ).innerHTML =
        "<div class='message info'>" +
        "Saving your leaderboard score..." +
        "</div>";


    fetch(
        LEADERBOARD_API,
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"
            },

            body:
                JSON.stringify(scoreData)
        }
    )

    .then(response => response.json())

    .then(data => {

        console.log(
            "Score submission:",
            data
        );


        if (
            data.success === false
        ) {

            throw new Error(
                data.error ||
                "Score submission failed."
            );
        }


        document.getElementById(
            "leaderboardMessage"
        ).innerHTML =
            "<div class='message success'>" +
            "🏆 Your score has been added to the leaderboard!" +
            "</div>";


        /*
           Reload leaderboard after submission.
        */

        loadLeaderboard();

    })

    .catch(error => {

        console.error(
            "Score submission error:",
            error
        );


        document.getElementById(
            "leaderboardMessage"
        ).innerHTML =
            "<div class='message error'>" +
            "There was a problem saving your score." +
            "</div>";


        /*
           Still show existing leaderboard.
        */

        loadLeaderboard();
    });
}


/* ============================================================
   LOAD LEADERBOARD
   ============================================================ */

function loadLeaderboard() {

    const topicId =
        getSpreadsheetId(sheetUrl);


    fetch(
        LEADERBOARD_API +
        "?game=" +
        encodeURIComponent(GAME_NAME) +
        "&topicId=" +
        encodeURIComponent(topicId)
    )

    .then(response => response.json())

    .then(data => {

        let leaderboard = [];

        if (Array.isArray(data)) {

            leaderboard = data;

        } else if (
            Array.isArray(data.leaderboard)
        ) {

            leaderboard = data.leaderboard;
        }


        leaderboard.sort(
            (a, b) => {

                const accuracyA =
                    Number(a.accuracy) || 0;

                const accuracyB =
                    Number(b.accuracy) || 0;

                const timeA =
                    Number(a.time) || Infinity;

                const timeB =
                    Number(b.time) || Infinity;


                if (
                    accuracyA !==
                    accuracyB
                ) {

                    return accuracyB -
                           accuracyA;
                }


                return timeA - timeB;
            }
        );


        displayLeaderboard(
            leaderboard
        );

    })

    .catch(error => {

        console.error(
            "Could not load leaderboard:",
            error
        );
    });
}


/* ============================================================
   DISPLAY LEADERBOARD
   ============================================================ */

function displayLeaderboard(
    leaderboard
) {

    const container =
        document.getElementById(
            "leaderboard"
        );


    if (
        !leaderboard ||
        leaderboard.length === 0
    ) {

        container.innerHTML =
            "<h3>Leaderboard</h3>" +
            "<p>No scores yet.</p>";

        return;
    }


    const topFive =
        leaderboard.slice(0, 5);


    let html =
        "<h3>🏆 Leaderboard</h3>" +

        "<table>" +

        "<thead>" +

        "<tr>" +

        "<th>#</th>" +

        "<th>Name</th>" +

        "<th>Accuracy</th>" +

        "<th>Time</th>" +

        "</tr>" +

        "</thead>" +

        "<tbody>";


    topFive.forEach(
        (player, index) => {

            html +=
                "<tr>" +

                "<td>" +
                (index + 1) +
                "</td>" +

                "<td>" +
                escapeHtml(
                    player.name || "Unknown"
                ) +
                "</td>" +

                "<td>" +
                (player.accuracy || 0) +
                "%</td>" +

                "<td>" +
                formatTimeDisplay(
                    Number(player.time)
                ) +
                "</td>" +

                "</tr>";
        }
    );


    html +=
        "</tbody>" +
        "</table>";


    container.innerHTML =
        html;
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* ============================================================
   INITIAL LOAD
   ============================================================ */

loadVocabulary();
