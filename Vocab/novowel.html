<body>

<div class="container">

    <div class="title">No vowels</div>

    <!-- GOOGLE LOGIN -->
    <div id="googleLoginSection">

        <div id="googleUser"></div>

        <div id="googleLoginMessage">

        </div>

        <div id="googleButton"></div>

    <div class="subtitle" id="gameSubtitle">
        Fill in the missing vowels
    </div>

         class="leaderboard-box"

            </thead>

            <tbody id="leaderboardBody"></tbody>

        </table>

        <button id="restartBtn"
                class="btn"
                onclick="restartGame()">
            🔄 Start Again
        </button>

    </div>

</div>


<script>

/* =========================================================
   GAME VARIABLES
   ========================================================= */

let vocabList = [];
let exerciseWords = [];
let currentIndex = 0;
let lastFocusedInput = null;

const vowels = [
    'a','e','i','o','u',
    'à','â','ä',
    'é','è','ê','ë',
    'î','ï',
    'ô','ö',
    'ù','ü','û',
    'á','í','ó','ú'
];

let totalVowelsCount = 0;
let totalInputAttempts = 0;

let startTime;


/* =========================================================
   GOOGLE ACCOUNT
   ========================================================= */

let currentUser = null;
let googleReady = false;

const GOOGLE_CLIENT_ID =
    "158411898898-17274f13igjs13a5ja3g31vhnp0c4e0u.apps.googleusercontent.com";


/* =========================================================
   LEADERBOARD CONFIGURATION
   ========================================================= */

const LEADERBOARD_API_URL =
    "https://script.google.com/macros/s/AKfycbzasoQX0sQoLfpK9Uoup_d-IvuEaAKoJvHi79hZKf5qsVei8XP_CxvE5IQcdlrxE0DfHA/exec";

const GAME_NAME = "No Vowels";


/* =========================================================
   SHEET / TOPIC
   ========================================================= */

const params = new URLSearchParams(window.location.search);

const sheetUrl = params.get('sheet');

function getSpreadsheetId(url) {

    if (!url) return null;

    if (url.includes('/d/e/')) {

        const matches =
            url.match(/\/d\/e\/([a-zA-Z0-9-_]+)/);

        return matches ? matches[1] : url;
    }

    const matches =
        url.match(/\/d\/([a-zA-Z0-9-_]+)/);

    return matches ? matches[1] : url;
}

const topicId = sheetUrl
    ? getSpreadsheetId(sheetUrl)
    : null;


/* =========================================================
   GOOGLE IDENTITY INITIALISATION
   ========================================================= */

/*
   Google Identity Services loads asynchronously.

   We therefore don't initialise Google inside a simple
   window.onload and hope the library is ready.

   Instead, we wait until the library actually exists.
*/

function initialiseGoogleSignIn() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.id
    ) {
        setTimeout(initialiseGoogleSignIn, 200);
        return;
    }

    if (googleReady) return;

    googleReady = true;

    try {

        google.accounts.id.initialize({

            client_id: GOOGLE_CLIENT_ID,

            callback: handleCredentialResponse,

            /*
             * Automatically select an account where Google
             * is able to do so.
             */
            auto_select: true,

            /*
             * Use Google's newer FedCM account selection
             * where available.
             */
            use_fedcm_for_prompt: true

        });


        /*
         * Also create a Google Sign-In button.

         * This is NOT a name-entry fallback.

         * If Google cannot automatically identify the
         * student, they can simply click their school
         * Google account.
         */

        google.accounts.id.renderButton(

            document.getElementById("googleButton"),

            {
                type: "standard",
                theme: "outline",
                size: "large",
                text: "signin_with",
                shape: "rectangular",
                logo_alignment: "left",
                width: 260
            }

        );


        /*
         * Ask Google to attempt automatic sign-in.
         */

        google.accounts.id.prompt(

            function(notification) {

                if (notification.isNotDisplayed()) {

                    console.log(
                        "Google One Tap was not displayed:",
                        notification.getNotDisplayedReason()
                    );

                    showGoogleButton();

                }

                else if (notification.isSkippedMoment()) {

                    console.log(
                        "Google One Tap was skipped:",
                        notification.getSkippedReason()
                    );

                    showGoogleButton();

                }

            }

        );

    }

    catch (error) {

        console.error(
            "Google Identity Services error:",
            error
        );

        showGoogleButton();

    }
}


/*
 * Start checking for Google as soon as the page loads.
 */

document.addEventListener(
    "DOMContentLoaded",
    function() {
        initialiseGoogleSignIn();
    }
);


/* =========================================================
   GOOGLE CREDENTIAL RESPONSE
   ========================================================= */

function handleCredentialResponse(response) {

    console.log(
        "Google credential received."
    );

    try {

        const payload =
            parseJwt(response.credential);


        /*
         * We use Google's returned name for the
         * leaderboard display.

         * We also keep the email internally.
         */

        currentUser = {

            name: payload.name || "Google user",

            email: payload.email || "",

            googleId: payload.sub || "",

            picture: payload.picture || "",

            hostedDomain: payload.hd || "",

            credential: response.credential

        };


        console.log(
            "Logged in with Google:",
            currentUser.name,
            currentUser.email
        );


        /*
         * Update the UI.
         */

        const userDiv =
            document.getElementById("googleUser");

        const messageDiv =
            document.getElementById("googleLoginMessage");

        const buttonDiv =
            document.getElementById("googleButton");


        userDiv.textContent =
            "👤 Signed in as " + currentUser.name;


        messageDiv.textContent =
            "Your Google account will be used for the leaderboard.";


        messageDiv.style.color =
            "#218838";


        buttonDiv.style.display =
            "none";


        /*
         * If the game has already finished while
         * authentication was happening, allow the
         * leaderboard process to continue.
         */

        if (window.waitingForGoogleLogin) {

            window.waitingForGoogleLogin = false;

            checkQualificationAndLoad(
                window.pendingTimeMinutes,
                window.pendingAccuracy
            );

        }

    }

    catch (error) {

        console.error(
            "Could not process Google credential:",
            error
        );

        currentUser = null;

        showGoogleButton();

    }
}


/* =========================================================
   JWT DECODER
   ========================================================= */

function parseJwt(token) {

    const base64Url =
        token.split('.')[1];

    const base64 =
        base64Url
            .replace(/-/g, '+')
            .replace(/_/g, '/');

    const jsonPayload =
        decodeURIComponent(
            atob(base64)
                .split('')
                .map(function(c) {

                    return '%' +
                        ('00' +
                        c.charCodeAt(0).toString(16))
                        .slice(-2);

                })
                .join('')
        );

    return JSON.parse(jsonPayload);
}


/* =========================================================
   GOOGLE BUTTON FALLBACK
   ========================================================= */

function showGoogleButton() {

    const message =
        document.getElementById(
            "googleLoginMessage"
        );

    if (!currentUser) {

        message.textContent =
            "Please sign in with your school Google account to use the leaderboard.";

        message.className =
            "login-required";

    }

}


/* =========================================================
   LOAD CSV
   ========================================================= */

if (!sheetUrl) {

    document.getElementById(
        'englishWord'
    ).textContent =
        "⚠️ No CSV URL provided in query string.";

}

else {

    Papa.parse(

        sheetUrl,

        {
            download: true,

            header: true,

            skipEmptyLines: true,

            complete: function(results) {

                results.data.forEach(row => {

                    if (
                        row.French &&
                        row.English
                    ) {

                        vocabList.push({

                            french:
                                row.French.trim(),

                            english:
                                row.English.trim()

                        });

                    }

                });


                if (vocabList.length === 0) {

                    document.getElementById(
                        'englishWord'
                    ).textContent =
                        "⚠️ No items found in columns A/B!";

                    return;
                }


                restartGame();

            },


            error: function(err) {

                console.error(err);

                document.getElementById(
                    'englishWord'
                ).textContent =
                    "⚠️ CSV load error: " + err;

            }

        }

    );

}


/* =========================================================
   RESTART GAME
   ========================================================= */

function restartGame() {

    exerciseWords =
        [...vocabList]
            .sort(() => 0.5 - Math.random())
            .slice(0, 10);


    currentIndex = 0;

    totalVowelsCount = 0;

    totalInputAttempts = 0;


    document.getElementById(
        'frenchWord'
    ).textContent = "";


    document.getElementById(
        'gameSubtitle'
    ).style.display = "block";


    document.getElementById(
        'englishWord'
    ).style.display = "block";


    document.getElementById(
        'languageSelect'
    ).style.display = "block";


    document.getElementById(
        'wordCounter'
    ).style.display = "block";


    document.getElementById(
        'keyboardContainer'
    ).style.display = "block";


    document.getElementById(
        'leaderboardSection'
    ).style.display = "none";


    document.getElementById(
        'feedback'
    ).style.display = "none";


    generateExercise();


    generateKeyboard(
        document.getElementById(
            'languageSelect'
        ).value || 'french'
    );


    startTime = Date.now();

}


/* =========================================================
   GENERATE EXERCISE
   ========================================================= */

function generateExercise() {

    if (
        currentIndex >=
        exerciseWords.length
    ) {

        const totalSeconds =
            Math.round(
                (Date.now() - startTime) / 1000
            );


        const displayMins =
            Math.floor(totalSeconds / 60);


        const displaySecs =
            totalSeconds % 60;


        /*
         * Keep your existing leaderboard time
         * format: minutes.seconds
         */

        const clockFormattedTime =
            parseFloat(
                `${displayMins}.${displaySecs < 10 ? '0' : ''}${displaySecs}`
            );


        const formattedTimeText =
            `${displayMins}m ${displaySecs}s`;


        const accuracy =
            Math.min(
                100,
                Math.round(
                    (
                        totalVowelsCount /
                        Math.max(
                            totalVowelsCount,
                            totalInputAttempts
                        )
                    ) * 100
                )
            );


        document.getElementById(
            'frenchWord'
        ).textContent =
            `🎉 Score: ${accuracy}% Accuracy in ${formattedTimeText}!`;


        document.getElementById(
            'gameSubtitle'
        ).style.display = "none";


        document.getElementById(
            'englishWord'
        ).style.display = "none";


        document.getElementById(
            'languageSelect'
        ).style.display = "none";


        document.getElementById(
            'wordCounter'
        ).style.display = "none";


        document.getElementById(
            'feedback'
        ).style.display = "none";


        document.getElementById(
            'keyboardContainer'
        ).style.display = "none";


        /*
         * Leaderboard handling.
         */

        checkQualificationAndLoad(
            clockFormattedTime,
            accuracy
        );

        return;
    }


    const word =
        exerciseWords[currentIndex].french;


    document.getElementById(
        'englishWord'
    ).textContent =
        exerciseWords[currentIndex].english;


    const wordDiv =
        document.getElementById('frenchWord');


    wordDiv.innerHTML = "";


    for (
        let i = 0;
        i < word.length;
        i++
    ) {

        const char = word[i];


        if (
            vowels.includes(
                char.toLowerCase()
            )
        ) {

            totalVowelsCount++;


            const input =
                document.createElement('input');


            input.type = 'text';

            input.maxLength = 1;

            input.className = 'missing-word';

            input.dataset.index = i;


            input.addEventListener(
                'input',
                validateInput
            );


            input.addEventListener(
                'focus',
                () => {
                    lastFocusedInput = input;
                }
            );


            input.addEventListener(
                'keydown',
                handleKeydown
            );


            wordDiv.appendChild(input);

        }

        else {

            const span =
                document.createElement('span');


            span.textContent = char;


            wordDiv.appendChild(span);

        }

    }


    document.getElementById(
        'feedback'
    ).style.display = "none";


    document.getElementById(
        'nextButton'
    ).style.display = "none";


    document.getElementById(
        'wordCounter'
    ).textContent =
        `${currentIndex + 1} / ${exerciseWords.length}`;


    const firstInput =
        wordDiv.querySelector(
            '.missing-word'
        );


    if (firstInput) {

        setTimeout(
            () => {

                firstInput.focus();

                lastFocusedInput =
                    firstInput;

            },
            50
        );

    }

}


/* =========================================================
   VALIDATE INPUT
   ========================================================= */

function validateInput(e) {

    const input = e.target;


    const word =
        exerciseWords[currentIndex].french;


    const correctChar =
        word[input.dataset.index]
            .toLowerCase();


    if (input.value !== '') {

        totalInputAttempts++;

    }


    if (
        input.value.toLowerCase() ===
        correctChar
    ) {

        input.classList.add('correct');

        input.classList.remove('incorrect');

    }

    else {

        input.classList.add('incorrect');

        input.classList.remove('correct');

    }


    if (input.value.length === 1) {

        let nextInput =
            input.nextElementSibling;


        while (
            nextInput &&
            !nextInput.classList.contains(
                'missing-word'
            )
        ) {

            nextInput =
                nextInput.nextElementSibling;

        }


        if (nextInput) {

            nextInput.focus();

        }

    }


    const allInputs =
        document.querySelectorAll(
            '.missing-word'
        );


    let allCorrect = true;


    allInputs.forEach(
        inp => {

            if (
                !inp.classList.contains(
                    'correct'
                )
            ) {

                allCorrect = false;

            }

        }
    );


    if (allCorrect) {

        document.getElementById(
            'feedback'
        ).style.display = "flex";


        document.getElementById(
            'nextButton'
        ).style.display = "inline-block";

    }

}


/* =========================================================
   KEYBOARD
   ========================================================= */

function handleKeydown(e) {

    if (e.key === "Backspace") {

        const input = e.target;


        if (input.value === '') {

            e.preventDefault();


            let prevInput =
                input.previousElementSibling;


            while (
                prevInput &&
                !prevInput.classList.contains(
                    'missing-word'
                )
            ) {

                prevInput =
                    prevInput.previousElementSibling;

            }


            if (prevInput) {

                prevInput.focus();

                prevInput.value = '';

                prevInput.classList.remove(
                    'correct',
                    'incorrect'
                );

            }

        }

    }

    else if (e.key === "Enter") {

        const allInputs =
            document.querySelectorAll(
                '.missing-word'
            );


        let allCorrect = true;


        allInputs.forEach(
            inp => {

                if (
                    !inp.classList.contains(
                        'correct'
                    )
                ) {

                    allCorrect = false;

                }

            }
        );


        if (allCorrect) {

            e.preventDefault();

            nextText();

        }

    }

}


/* =========================================================
   NEXT
   ========================================================= */

function nextText() {

    currentIndex++;

    generateExercise();

}


/* =========================================================
   SPECIAL CHARACTER KEYBOARD
   ========================================================= */

function generateKeyboard(language) {

    const container =
        document.getElementById(
            'keyboardContainer'
        );


    container.innerHTML = '';


    let chars = [];


    switch(language) {

        case 'french':

            chars = [
                'à','â','ä',
                'é','è','ê','ë',
                'î','ï',
                'ô','ö',
                'ù','ü','û',
                'ç'
            ];

            break;


        case 'german':

            chars = [
                'ä','ö','ü','ß'
            ];

            break;


        case 'spanish':

            chars = [
                'á','é','í','ó','ú','ñ'
            ];

            break;

    }


    chars.forEach(c => {

        const btn =
            document.createElement('button');


        btn.textContent = c;

        btn.className =
            'keyboard-button';

        btn.type = 'button';


        btn.onclick = () => {

            if (lastFocusedInput) {

                const pos =
                    lastFocusedInput.selectionStart;


                const val =
                    lastFocusedInput.value;


                lastFocusedInput.value =
                    val.slice(0, pos) +
                    c +
                    val.slice(pos);


                lastFocusedInput.setSelectionRange(
                    pos + 1,
                    pos + 1
                );


                lastFocusedInput.focus();


                lastFocusedInput.dispatchEvent(
                    new Event('input')
                );

            }

        };


        container.appendChild(btn);

    });

}


document.getElementById(
    'languageSelect'
).addEventListener(
    'change',
    (e) => {

        generateKeyboard(
            e.target.value
        );

    }
);


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTimeDisplay(minutesVal) {

    if (
        minutesVal === undefined ||
        minutesVal === null ||
        isNaN(minutesVal)
    ) {

        return "";

    }


    const num =
        parseFloat(minutesVal);


    const mins =
        Math.floor(num);


    const secs =
        Math.round(
            (num - mins) * 100
        );


    return `${mins}m ${secs}s`;

}


/* =========================================================
   LEADERBOARD
   ========================================================= */

function checkQualificationAndLoad(
    timeMinutes,
    accuracy
) {

    const tbody =
        document.getElementById(
            'leaderboardBody'
        );


    const section =
        document.getElementById(
            'leaderboardSection'
        );


    tbody.innerHTML =
        '<tr><td colspan="4">Loading board profiles... ⏳</td></tr>';


    section.style.display = "block";


    /*
     * First get the current leaderboard.
     */

    fetch(
        `${LEADERBOARD_API_URL}?game=${encodeURIComponent(GAME_NAME)}&topicId=${encodeURIComponent(topicId || "")}`
    )

    .then(res => res.json())

    .then(data => {

        let tempBoard =
            [...data];


        /*
         * Temporary score used ONLY to determine
         * whether the player would enter the Top 5.
         */

        let newAttempt = {

            name: "___TEMP_PLAYER___",

            time:
                parseFloat(timeMinutes),

            accuracy:
                parseFloat(accuracy)

        };


        tempBoard.push(
            newAttempt
        );


        tempBoard.sort(
            (a, b) =>
                b.accuracy - a.accuracy ||
                a.time - b.time
        );


        let playerRank =
            tempBoard.findIndex(

                e =>
                    e.name ===
                        "___TEMP_PLAYER___" &&

                    parseFloat(e.time) ===
                        parseFloat(timeMinutes) &&

                    parseFloat(e.accuracy) ===
                        parseFloat(accuracy)

            ) + 1;


        /*
         * Only people who would enter the Top 5
         * need Google identity for submission.
         */

        if (playerRank <= 5) {

            /*
             * IMPORTANT:
             *
             * There is NO prompt() here.
             *
             * If Google hasn't identified the student,
             * we wait for them to sign in.
             */

            if (!currentUser) {

                window.waitingForGoogleLogin = true;

                window.pendingTimeMinutes =
                    timeMinutes;

                window.pendingAccuracy =
                    accuracy;


                tbody.innerHTML =
                    `<tr>
                        <td colspan="4">
                            🏆 You reached the Top 5!<br>
                            Please sign in with your Google account above to save your score.
                        </td>
                    </tr>`;


                /*
                 * Scroll back to Google login.
                 */

                document.getElementById(
                    'googleLoginSection'
                ).scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });


                return;

            }


            /*
             * We have a Google account.
             */

            const studentName =
                currentUser.name ||
                "Google user";


            tbody.innerHTML =
                '<tr><td colspan="4">Saving your spot... ⏳</td></tr>';


            /*
             * Submit the Google account information.
             */

            fetch(
                LEADERBOARD_API_URL,
                {

                    method: "POST",

                    body: JSON.stringify({

                        topicId:
                            topicId,

                        game:
                            GAME_NAME,

                        name:
                            studentName,

                        email:
                            currentUser.email,

                        googleId:
                            currentUser.googleId,

                        time:
                            parseFloat(
                                timeMinutes
                            ),

                        accuracy:
                            parseFloat(
                                accuracy
                            )

                    })

                }
            )

            .then(res => res.json())

            .then(updatedData => {

                renderLeaderboardRows(

                    updatedData,

                    studentName,

                    timeMinutes,

                    accuracy

                );

            })

            .catch(err => {

                console.error(
                    "Leaderboard save error:",
                    err
                );


                tbody.innerHTML =
                    `<tr>
                        <td colspan="4">
                            ⚠️ Your score could not be saved.
                        </td>
                    </tr>`;

            });

        }

        else {

            /*
             * Not Top 5.
             *
             * We don't need to identify the student.
             */

            renderLeaderboardRows(
                data,
                null,
                null,
                null
            );

        }

    })

    .catch(err => {

        console.error(
            "Leaderboard loading failure:",
            err
        );


        tbody.innerHTML =
            `<tr>
                <td colspan="4">
                    Error connecting to records database.
                </td>
            </tr>`;

    });

}


/* =========================================================
   RENDER LEADERBOARD
   ========================================================= */

function renderLeaderboardRows(
    data,
    highlightName,
    highlightTime,
    highlightAcc
) {

    const tbody =
        document.getElementById(
            'leaderboardBody'
        );


    const statusDiv =
        document.getElementById(
            'leaderboardStatus'
        );


    if (!tbody) return;


    tbody.innerHTML = "";


    let rankHeader =
        document.getElementById(
            'personalRankTitle'
        );


    if (
        !rankHeader &&
        statusDiv
    ) {

        rankHeader =
            document.createElement('h4');


        rankHeader.id =
            'personalRankTitle';


        rankHeader.style.fontSize =
            '18px';


        rankHeader.style.margin =
            '8px 0';


        statusDiv.appendChild(
            rankHeader
        );

    }


    if (highlightName) {

        let studentRank =
            data.findIndex(

                entry =>

                    entry.name ===
                        highlightName &&

                    parseFloat(entry.time) ===
                        parseFloat(highlightTime) &&

                    parseFloat(entry.accuracy) ===
                        parseFloat(highlightAcc)

            ) + 1;


        if (rankHeader) {

            rankHeader.style.color =
                '#2ecc71';


            rankHeader.textContent =
                studentRank > 0
                    ? `🎯 Final Status: Rank #${studentRank}!`
                    : `🎯 Score Posted Successfully!`;

        }

    }

    else {

        if (rankHeader) {

            rankHeader.style.color =
                '#e67e22';


            rankHeader.textContent =
                `🏁 Good effort! Try again to break into the Top 5.`;

        }

    }


    const medals = [
        '🥇 1',
        '🥈 2',
        '🥉 3'
    ];


    data.forEach(
        (entry, index) => {

            const tr =
                document.createElement('tr');


            const accVal =
                entry.accuracy !== undefined
                    ? entry.accuracy
                    : 100;


            const timeFormatted =
                formatTimeDisplay(
                    entry.time
                );


            const rankDisplay =
                medals[index] ||
                `#${index + 1}`;


            if (

                highlightName &&

                entry.name ===
                    highlightName &&

                parseFloat(entry.time) ===
                    parseFloat(highlightTime) &&

                parseFloat(entry.accuracy) ===
                    parseFloat(highlightAcc)

            ) {

                tr.className =
                    'highlight-row';

            }


            /*
             * textContent is deliberately used for
             * player names rather than inserting
             * untrusted names through innerHTML.
             */

            const rankCell =
                document.createElement('td');


            const nameCell =
                document.createElement('td');


            const accuracyCell =
                document.createElement('td');


            const timeCell =
                document.createElement('td');


            rankCell.innerHTML =
                `<strong>${rankDisplay}</strong>`;


            nameCell.innerHTML =
                `<strong></strong>`;


            nameCell.querySelector(
                'strong'
            ).textContent =
                entry.name || "Anonymous";


            accuracyCell.textContent =
                `${accVal}%`;


            timeCell.textContent =
                timeFormatted;


            tr.appendChild(rankCell);

            tr.appendChild(nameCell);

            tr.appendChild(accuracyCell);

            tr.appendChild(timeCell);


            tbody.appendChild(tr);

        }
    );

}
