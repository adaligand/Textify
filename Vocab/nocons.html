<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No consonants</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        width: 100%;
        max-width: 800px;
        padding: 40px;
        box-sizing: border-box;
        font-size: 16px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        position: relative;
    }

    .title {
        font-size: 40px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
    }

    .subtitle {
        font-size: 20px;
        margin-bottom: 10px;
        text-align: center;
    }

    .counter {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
    }

    .english-sentence {
        font-size: 24px;
        text-align: center;
        margin-bottom: 20px;
        padding: 10px 20px;
        border-radius: 10px;
        background-color: #eee;
    }

    .french-sentence {
        font-size: 30px;
        text-align: center;
        margin-bottom: 20px;
        word-spacing: 20px;
    }

    .missing-word {
        width: 25px;
        font-size: 30px;
        border: none;
        border-bottom: 1px solid #000;
        background: transparent;
        text-align: center;
        margin-right: 2px;
    }

    .correct {
        background-color: #cef4ce;
    }

    .incorrect {
        background-color: #ffb6c19c;
    }

    .keyboard-container {
        text-align: center;
        margin-top: 20px;
    }

    .keyboard-button {
        font-size: 18px;
        padding: 10px 15px;
        margin: 2px;
        border: none;
        border-radius: 10px;
        background-color: #eee;
        cursor: pointer;
    }

    .keyboard-button:hover {
        background-color: #A9A9A9;
        transform: translateY(-4px);
    }

    .feedback {
        font-weight: bold;
        font-size: 24px;
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        margin-top: 10px;
    }

    #nextButton {
        padding: 10px 20px;
        border-radius: 10px;
        border: 2px solid #ccc;
        background: #f9f9f9;
        cursor: pointer;
        display: none;
        font-size: 24px;
    }

    /* --- LEADERBOARD --- */

    .leaderboard-box {
        margin-top: 25px;
        text-align: center;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }

    .leaderboard-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 16px;
        background-color: #fafafa;
        color: #333;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .leaderboard-table th,
    .leaderboard-table td {
        padding: 10px 12px;
        text-align: center;
        border-bottom: 1px solid #eee;
    }

    .leaderboard-table th {
        background-color: #f1f3f5;
        color: #333;
        font-weight: bold;
    }

    .leaderboard-table tr:last-child td {
        border-bottom: none;
    }

    .leaderboard-table tr.highlight-row {
        background-color: #d4edda !important;
        color: #155724 !important;
        font-weight: bold;
    }

    .btn {
        padding: 10px 20px;
        font-size: 18px;
        font-weight: bold;
        background-color: #f9f9f9;
        border: 2px solid #ccc;
        color: #000000;
        border-radius: 10px;
        cursor: pointer;
        margin: 20px 5px 5px 5px;
        transition: transform 0.2s, background-color 0.2s;
        font-family: Arial, sans-serif;
    }

    .btn:hover {
        background-color: #e0e0e0;
        transform: translateY(-2px);
    }

    #googleBtnContainer {
        display: flex;
        justify-content: center;
        margin: 15px 0;
    }
</style>
</head>

<body>

<div class="container">

    <div class="title">No consonants</div>

    <div class="subtitle" id="gameSubtitle">
        Fill in the missing consonants
    </div>

    <div class="counter" id="sentenceCounter"></div>

    <div class="english-sentence" id="englishSentence"></div>

    <div class="french-sentence" id="frenchSentence"></div>

    <div id="keyboardContainer" class="keyboard-container"></div>

    <div id="feedback" class="feedback" style="display:none;">
        <span>Correct ✅</span>
        <button id="nextButton">Next</button>
    </div>

    <!-- LEADERBOARD -->

    <div id="leaderboardSection" class="leaderboard-box" style="display:none;">

        <h3 style="margin: 5px 0;">
            🏆 Top 5 Leaderboard 🏆
        </h3>

        <div id="leaderboardStatus"></div>

        <div id="googleBtnContainer"></div>

        <table class="leaderboard-table">

            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Accuracy</th>
                    <th>Time</th>
                </tr>
            </thead>

            <tbody id="leaderboardBody"></tbody>

        </table>

        <button id="restartBtn"
                class="btn"
                onclick="restartGame()">
            🔄 Start Again
        </button>

    </div>

</div>

<script>

let sentencePairs = [];
let exerciseSentences = [];
let currentIndex = 0;
let lastFocusedInput = null;

let totalConsonantsCount = 0;
let totalInputAttempts = 0;

/* =========================================================
   LEADERBOARD CONFIGURATION
   ========================================================= */

const LEADERBOARD_API_URL =
    "https://script.google.com/macros/s/AKfycbzasoQX0sQoLfpK9Uoup_d-IvuEaAKoJvHi79hZKf5qsVei8XP_CxvE5IQcdlrxE0DfHA/exec";

const GAME_NAME = "No Consonants";

let startTime;


/* =========================================================
   GOOGLE AUTHENTICATION
   EXACT SAME SYSTEM AS NO VOWELS
   ========================================================= */

const GOOGLE_CLIENT_ID =
    "158411898898-17274f13igjs13a5ja3g31vhnp0c4e0u.apps.googleusercontent.com";

let currentGoogleUser = null;
let googleInitialised = false;

let pendingTimeMinutes = null;
let pendingAccuracy = null;


/* =========================================================
   GET TOPIC ID FROM SHEET URL
   ========================================================= */

const params = new URLSearchParams(window.location.search);
const csvUrl = params.get('sheet');

function getSpreadsheetId(url) {

    if (!url) return null;

    if (url.includes('/d/e/')) {

        const matches =
            url.match(/\/d\/e\/([a-zA-Z0-9-_]+)/);

        return matches ? matches[1] : url;
    }

    const matches =
        url.match(/\/d\/([a-zA-Z0-9-_]+)/);

    return matches ? matches[1] : url;
}

const topicId = csvUrl
    ? getSpreadsheetId(csvUrl)
    : null;


/* =========================================================
   CSV LOADING
   ========================================================= */

if (!csvUrl) {

    document.getElementById('englishSentence').textContent =
        "⚠️ No CSV URL provided in query string.";

} else {

    Papa.parse(csvUrl, {

        download: true,
        header: true,
        skipEmptyLines: true,

        complete: function(results) {

            results.data.forEach(row => {

                if (row.French && row.English) {

                    sentencePairs.push({
                        french: row.French.trim(),
                        english: row.English.trim()
                    });

                }

            });

            if (sentencePairs.length === 0) {

                document.getElementById('englishSentence').textContent =
                    "⚠️ No valid French/English data found!";

                return;
            }

            restartGame();
        },

        error: function(err) {

            console.error(err);

            document.getElementById('englishSentence').textContent =
                "⚠️ CSV load error: " + err;
        }
    });
}


/* =========================================================
   RESTART GAME
   ========================================================= */

function restartGame() {

    exerciseSentences =
        sentencePairs
            .sort(() => 0.5 - Math.random())
            .slice(0, 10);

    currentIndex = 0;

    totalConsonantsCount = 0;
    totalInputAttempts = 0;

    /* Reset Google / leaderboard state */

    currentGoogleUser = null;
    pendingTimeMinutes = null;
    pendingAccuracy = null;

    document.getElementById('frenchSentence').textContent = "";

    document.getElementById('gameSubtitle').style.display = "block";

    document.getElementById('englishSentence').style.display = "block";

    document.getElementById('sentenceCounter').style.display = "block";

    if (document.getElementById('keyboardContainer')) {

        document.getElementById('keyboardContainer').style.display = "block";
    }

    document.getElementById('leaderboardSection').style.display = "none";

    document.getElementById('googleBtnContainer').innerHTML = "";

    generateSentence();

    generateKeyboard();

    startTime = Date.now();
}


/* =========================================================
   GENERATE SENTENCE
   ========================================================= */

function generateSentence() {

    /* -----------------------------------------------------
       GAME FINISHED
       ----------------------------------------------------- */

    if (currentIndex >= exerciseSentences.length) {

        const totalSeconds =
            Math.round((Date.now() - startTime) / 1000);

        const displayMins =
            Math.floor(totalSeconds / 60);

        const displaySecs =
            totalSeconds % 60;

        /*
         * Keep exactly the same time format used by No Vowels.
         * Example:
         * 34 seconds = 0.34
         * 1m 30s = 1.30
         */

        const clockFormattedTime =
            parseFloat(
                `${displayMins}.${displaySecs < 10 ? '0' : ''}${displaySecs}`
            );

        const formattedTimeText =
            `${displayMins}m ${displaySecs}s`;

        const accuracy =
            Math.min(
                100,
                Math.round(
                    (
                        totalConsonantsCount /
                        Math.max(
                            totalConsonantsCount,
                            totalInputAttempts
                        )
                    ) * 100
                )
            );

        document.getElementById('frenchSentence').textContent =
            `🎉 Score: ${accuracy}% Accuracy in ${formattedTimeText}!`;

        document.getElementById('gameSubtitle').style.display = "none";

        document.getElementById('englishSentence').style.display = "none";

        document.getElementById('sentenceCounter').style.display = "none";

        document.getElementById('feedback').style.display = "none";

        if (document.getElementById('keyboardContainer')) {

            document.getElementById('keyboardContainer').style.display = "none";
        }

        /*
         * IMPORTANT:
         * Do NOT automatically save the score.
         *
         * First check whether the result is Top 5.
         */

        checkQualificationAndLoad(
            clockFormattedTime,
            accuracy
        );

        return;
    }


    /* -----------------------------------------------------
       DISPLAY CURRENT SENTENCE
       ----------------------------------------------------- */

    const sentence =
        exerciseSentences[currentIndex].french;

    document.getElementById('englishSentence').textContent =
        exerciseSentences[currentIndex].english;

    const sentenceDiv =
        document.getElementById('frenchSentence');

    sentenceDiv.innerHTML = '';


    for (let i = 0; i < sentence.length; i++) {

        const char = sentence[i];

        if (consonants.test(char)) {

            totalConsonantsCount++;

            const input =
                document.createElement('input');

            input.type = 'text';

            input.maxLength = 1;

            input.className = 'missing-word';

            input.dataset.index = i;

            input.addEventListener(
                'input',
                validateInput
            );

            input.addEventListener(
                'focus',
                () => {
                    lastFocusedInput = input;
                }
            );

            input.addEventListener(
                'keydown',
                handleKeydown
            );

            sentenceDiv.appendChild(input);

        } else {

            const span =
                document.createElement('span');

            span.textContent = char;

            sentenceDiv.appendChild(span);
        }
    }


    document.getElementById('sentenceCounter').textContent =
        ` ${currentIndex + 1} / ${exerciseSentences.length}`;

    document.getElementById('feedback').style.display = "none";


    const firstInput =
        sentenceDiv.querySelector('.missing-word');

    if (firstInput) {

        setTimeout(() => {

            firstInput.focus();

            lastFocusedInput = firstInput;

        }, 50);
    }
}


/* =========================================================
   VALIDATE INPUT
   ========================================================= */

function validateInput(e) {

    const input = e.target;

    const sentence =
        exerciseSentences[currentIndex].french;

    const correctChar =
        sentence[input.dataset.index];


    if (input.value !== '') {

        totalInputAttempts++;
    }


    if (
        input.value.toLowerCase() ===
        correctChar.toLowerCase()
    ) {

        input.classList.add('correct');

        input.classList.remove('incorrect');

    } else {

        input.classList.add('incorrect');

        input.classList.remove('correct');
    }


    if (input.value.length === 1) {

        let nextInput =
            input.nextElementSibling;

        while (
            nextInput &&
            !nextInput.classList.contains('missing-word')
        ) {

            nextInput =
                nextInput.nextElementSibling;
        }

        if (nextInput) {

            nextInput.focus();
        }
    }


    const allInputs =
        document.querySelectorAll('.missing-word');

    const allCorrect =
        Array.from(allInputs).every(
            inp => inp.classList.contains('correct')
        );


    if (allCorrect) {

        document.getElementById('feedback').style.display =
            "flex";

        document.getElementById('nextButton').style.display =
            "inline-block";
    }
}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

function handleKeydown(e) {

    if (e.key === "Backspace") {

        const input = e.target;

        if (input.value === '') {

            e.preventDefault();

            let prevInput =
                input.previousElementSibling;

            while (
                prevInput &&
                !prevInput.classList.contains('missing-word')
            ) {

                prevInput =
                    prevInput.previousElementSibling;
            }

            if (prevInput) {

                prevInput.focus();

                prevInput.value = '';

                prevInput.classList.remove(
                    'correct',
                    'incorrect'
                );
            }
        }

    } else if (e.key === "Enter") {

        const allInputs =
            document.querySelectorAll('.missing-word');

        const allCorrect =
            Array.from(allInputs).every(
                inp => inp.classList.contains('correct')
            );

        if (allCorrect) {

            e.preventDefault();

            currentIndex++;

            generateSentence();
        }
    }
}


/* =========================================================
   NEXT BUTTON
   ========================================================= */

document.getElementById('nextButton').addEventListener(
    'click',
    () => {

        currentIndex++;

        generateSentence();
    }
);


/* =========================================================
   SPECIAL CHARACTER KEYBOARD
   ========================================================= */

function generateKeyboard() {

    const container =
        document.getElementById('keyboardContainer');

    container.innerHTML = '';

    const chars = ['ß', 'ç', 'ñ'];


    chars.forEach(c => {

        const btn =
            document.createElement('button');

        btn.textContent = c;

        btn.className = 'keyboard-button';

        btn.type = 'button';

        btn.onclick = () => {

            if (lastFocusedInput) {

                const pos =
                    lastFocusedInput.selectionStart;

                const val =
                    lastFocusedInput.value;

                lastFocusedInput.value =
                    val.slice(0, pos) +
                    c +
                    val.slice(pos);

                lastFocusedInput.setSelectionRange(
                    pos + 1,
                    pos + 1
                );

                lastFocusedInput.focus();

                lastFocusedInput.dispatchEvent(
                    new Event('input')
                );
            }
        };

        container.appendChild(btn);
    });
}


/* =========================================================
   FORMAT LEADERBOARD TIME
   ========================================================= */

function formatTimeDisplay(minutesVal) {

    if (
        minutesVal === undefined ||
        minutesVal === null ||
        isNaN(minutesVal)
    ) {

        return "";
    }

    const num =
        parseFloat(minutesVal);

    const mins =
        Math.floor(num);

    const secs =
        Math.round((num - mins) * 100);

    return `${mins}m ${secs}s`;
}


/* =========================================================
   CHECK IF PLAYER QUALIFIES FOR TOP 5
   ========================================================= */

function checkQualificationAndLoad(
    timeMinutes,
    accuracy
) {

    const tbody =
        document.getElementById('leaderboardBody');

    const section =
        document.getElementById('leaderboardSection');


    tbody.innerHTML =
        '<tr><td colspan="4">Loading board profiles... ⏳</td></tr>';

    section.style.display = "block";


    fetch(
        `${LEADERBOARD_API_URL}?game=${encodeURIComponent(GAME_NAME)}&topicId=${encodeURIComponent(topicId)}`
    )

    .then(res => res.json())

    .then(data => {

        let tempBoard =
            [...data];


        /*
         * IMPORTANT:
         * Always use a temporary player here.
         *
         * This means Google sign-in is NOT required
         * just to determine whether they made Top 5.
         */

        let newAttempt = {

            name: "___TEMP_PLAYER___",

            time: parseFloat(timeMinutes),

            accuracy: parseFloat(accuracy)
        };


        tempBoard.push(newAttempt);


        tempBoard.sort(
            (a, b) =>
                b.accuracy - a.accuracy ||
                a.time - b.time
        );


        let playerRank =
            tempBoard.findIndex(e =>
                e.name === "___TEMP_PLAYER___" &&
                e.time === parseFloat(timeMinutes) &&
                e.accuracy === parseFloat(accuracy)
            ) + 1;


        /*
         * PLAYER MADE TOP 5
         */

        if (playerRank <= 5) {

            pendingTimeMinutes =
                parseFloat(timeMinutes);

            pendingAccuracy =
                parseFloat(accuracy);


            tbody.innerHTML =
                '<tr><td colspan="4">🏆 You made the Top 5! Please sign in below to save your score.</td></tr>';


            startGoogleAuthentication();


        } else {

            /*
             * PLAYER DID NOT MAKE TOP 5
             *
             * Show leaderboard but do not ask them
             * to sign in or save their result.
             */

            renderLeaderboardRows(
                data,
                null,
                null,
                null
            );
        }

    })

    .catch(err => {

        console.error(
            "Leaderboard loading failure:",
            err
        );

        tbody.innerHTML =
            '<tr><td colspan="4">Error connecting to records database.</td></tr>';
    });
}


/* =========================================================
   GOOGLE AUTHENTICATION
   EXACT SAME AS WORKING NO VOWELS VERSION
   ========================================================= */

function startGoogleAuthentication() {

    /*
     * Wait until Google Identity Services has loaded.
     */

    if (
        !window.google ||
        !window.google.accounts ||
        !window.google.accounts.id
    ) {

        setTimeout(
            startGoogleAuthentication,
            200
        );

        return;
    }


    /*
     * Initialise only once.
     */

    if (!googleInitialised) {

        google.accounts.id.initialize({

            client_id: GOOGLE_CLIENT_ID,

            callback: handleGoogleCredential,

            auto_select: false,

            use_fedcm_for_prompt: false
        });

        googleInitialised = true;
    }


    /*
     * Render explicit Google button.
     *
     * This is the important fallback that makes
     * the sign-in reliably clickable.
     */

    const btnContainer =
        document.getElementById(
            'googleBtnContainer'
        );

    btnContainer.innerHTML = '';


    google.accounts.id.renderButton(

        btnContainer,

        {
            theme: "outline",
            size: "large",
            text: "continue_with"
        }
    );


    /*
     * Also attempt passive One Tap.
     */

    google.accounts.id.prompt(
        function(notification) {

            if (notification.isNotDisplayed()) {

                console.warn(
                    "One Tap Prompt not displayed:",
                    notification.getNotDisplayedReason()
                );
            }

            if (notification.isSkippedMoment()) {

                console.warn(
                    "One Tap Prompt skipped:",
                    notification.getSkippedReason()
                );
            }
        }
    );
}


/* =========================================================
   HANDLE GOOGLE CREDENTIAL
   ========================================================= */

function handleGoogleCredential(response) {

    try {

        const payload =
            parseJwt(response.credential);


        currentGoogleUser = {

            name:
                payload.name ||
                "Google User",

            email:
                payload.email ||
                "",

            googleId:
                payload.sub ||
                "",

            picture:
                payload.picture ||
                ""
        };


        /*
         * Remove Google button once signed in.
         */

        document.getElementById(
            'googleBtnContainer'
        ).innerHTML = "";


        /*
         * Now save the score.
         */

        submitLeaderboardScore();


    } catch (error) {

        console.error(
            "Could not process Google credential:",
            error
        );


        document.getElementById(
            'leaderboardStatus'
        ).innerHTML =
            '<h4 style="color:#e74c3c;">Google sign-in could not be completed. Your score was not saved.</h4>';
    }
}


/* =========================================================
   PARSE GOOGLE JWT
   ========================================================= */

function parseJwt(token) {

    const base64Url =
        token.split('.')[1];

    const base64 =
        base64Url
            .replace(/-/g, '+')
            .replace(/_/g, '/');

    const jsonPayload =
        decodeURIComponent(
            atob(base64)
                .split('')
                .map(c =>
                    '%' +
                    ('00' +
                    c.charCodeAt(0).toString(16))
                    .slice(-2)
                )
                .join('')
        );

    return JSON.parse(jsonPayload);
}


/* =========================================================
   SUBMIT SCORE
   ========================================================= */

function submitLeaderboardScore() {

    const tbody =
        document.getElementById(
            'leaderboardBody'
        );


    tbody.innerHTML =
        '<tr><td colspan="4">Saving your spot... ⏳</td></tr>';


    fetch(
        LEADERBOARD_API_URL,
        {

            method: "POST",

            body: JSON.stringify({

                topicId: topicId,

                game: GAME_NAME,

                name:
                    currentGoogleUser.name,

                email:
                    currentGoogleUser.email,

                googleId:
                    currentGoogleUser.googleId,

                time:
                    parseFloat(
                        pendingTimeMinutes
                    ),

                accuracy:
                    parseFloat(
                        pendingAccuracy
                    )
            })
        }
    )

    .then(res => res.json())

    .then(updatedData => {

        renderLeaderboardRows(

            updatedData,

            currentGoogleUser.name,

            pendingTimeMinutes,

            pendingAccuracy
        );
    })

    .catch(err => {

        console.error(
            "Leaderboard save error:",
            err
        );

        tbody.innerHTML =
            '<tr><td colspan="4">Error saving your leaderboard score.</td></tr>';
    });
}


/* =========================================================
   RENDER LEADERBOARD
   ========================================================= */

function renderLeaderboardRows(
    data,
    highlightName,
    highlightTime,
    highlightAcc
) {

    const tbody =
        document.getElementById(
            'leaderboardBody'
        );

    const statusDiv =
        document.getElementById(
            'leaderboardStatus'
        );


    if (!tbody) return;


    tbody.innerHTML = "";


    let rankHeader =
        document.getElementById(
            'personalRankTitle'
        );


    if (!rankHeader && statusDiv) {

        rankHeader =
            document.createElement('h4');

        rankHeader.id =
            'personalRankTitle';

        rankHeader.style.fontSize =
            '18px';

        rankHeader.style.margin =
            '8px 0';

        statusDiv.appendChild(
            rankHeader
        );
    }


    /*
     * Player has just posted a score.
     */

    if (highlightName) {

        let studentRank =
            data.findIndex(entry =>

                entry.name === highlightName &&

                entry.time ===
                    parseFloat(highlightTime) &&

                entry.accuracy ===
                    parseFloat(highlightAcc)

            ) + 1;


        if (rankHeader) {

            rankHeader.style.color =
                '#2ecc71';

            rankHeader.textContent =
                studentRank > 0
                    ? `🎯 Final Status: Rank #${studentRank}!`
                    : `🎯 Score Posted Successfully!`;
        }


    } else {

        /*
         * Player did not make Top 5.
         */

        if (rankHeader) {

            rankHeader.style.color =
                '#e67e22';

            rankHeader.textContent =
                `🏁 Good effort! Try again to break into the Top 5.`;
        }
    }


    const medals = [
        '🥇 1',
        '🥈 2',
        '🥉 3'
    ];


    data.forEach((entry, index) => {

        const tr =
            document.createElement('tr');


        const accVal =
            entry.accuracy !== undefined
                ? entry.accuracy
                : 100;


        const timeFormatted =
            formatTimeDisplay(entry.time);


        const rankDisplay =
            medals[index] ||
            `#${index + 1}`;


        /*
         * Highlight newly submitted score.
         */

        if (
            highlightName &&

            entry.name === highlightName &&

            entry.time ===
                parseFloat(highlightTime) &&

            entry.accuracy ===
                parseFloat(highlightAcc)
        ) {

            tr.className =
                'highlight-row';
        }


        const rankCell =
            document.createElement('td');

        rankCell.innerHTML =
            `<strong>${rankDisplay}</strong>`;


        const nameCell =
            document.createElement('td');

        const nameStrong =
            document.createElement('strong');

        nameStrong.textContent =
            entry.name || "Unknown";

        nameCell.appendChild(
            nameStrong
        );


        const accCell =
            document.createElement('td');

        accCell.textContent =
            `${accVal}%`;


        const timeCell =
            document.createElement('td');

        timeCell.textContent =
            timeFormatted;


        tr.appendChild(rankCell);

        tr.appendChild(nameCell);

        tr.appendChild(accCell);

        tr.appendChild(timeCell);


        tbody.appendChild(tr);
    });
}

</script>

</body>
</html>
